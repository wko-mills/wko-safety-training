      <h3>Fall Hazards at WKO Inc.</h3>

      <h3>What Happens</h3>
      <p>When you are suspended motionless in a full body harness, the leg straps compress the femoral arteries in your upper thighs. Blood pools in your lower legs, reducing oxygen delivery to your brain, kidneys, and other vital organs.</p>

  sections: [
    {
      title: "Sección 1: Por Qué las Caídas Son Peligrosas",
      content: `<p>Las caídas son una de las principales causas de lesiones graves y muertes en el lugar de trabajo en todas las industrias. En la fabricación de productos de madera, existen peligros de caídas en toda la instalación — desde plataformas elevadas y áreas de techos hasta pilas de troncos, cadenas de clasificación y mezzanines.</p>
      <h3>Peligros de Caídas en WKO Inc.</h3>
      <p>El Estado de Washington requiere protección contra caídas a <strong>cuatro (4) pies</strong> o más sobre el suelo o un nivel inferior. En WKO Inc., los peligros de caídas incluyen:</p>
      <ul>
        <li><strong>Pisos, plataformas y pasarelas con lados abiertos</strong> — cualquier superficie de trabajo con lados o bordes sin protección</li>
        <li><strong>Trabajo en techos</strong> — dentro de seis (6) pies del borde del techo, o cerca de tragaluces y aberturas del techo</li>
        <li><strong>Escaleras fijas</strong> — escaleras de más de veinticuatro (24) pies de altura</li>
        <li><strong>Elevadores aéreos</strong> — elevadores de pluma y de tijera utilizados para mantenimiento y reparación</li>
        <li><strong>Aberturas en pisos, agujeros y escotillas</strong> — cualquier hueco o vacío de dos (2) pulgadas o más</li>
        <li><strong>Pilas de troncos y cadenas de clasificación de madera</strong> — áreas de trabajo elevadas específicas del aserradero</li>
        <li><strong>Bordes de mezzanines</strong> — áreas de trabajo elevadas sin protección de barandas</li>
        <li><strong>Sobre equipos peligrosos</strong> — se requiere protección contra caídas independientemente de la altura cuando se trabaja sobre maquinaria peligrosa, pozos o tanques</li>
      </ul>
      <div class="danger">🚨 Las caídas de solo 4 pies pueden causar huesos rotos, lesiones cerebrales traumáticas, lesiones de la médula espinal y muerte. Nunca asuma que una caída corta es segura.</div>
      <h3>La Protección contra Caídas No Es Opcional</h3>
      <p>Si está en cualquier superficie a cuatro pies o más sobre el suelo — o sobre equipos peligrosos a cualquier altura — se requiere protección contra caídas. No hay excepciones por "tareas rápidas" o "solo un minuto." Si ve un peligro de caída sin protección, detenga el trabajo e informe a su supervisor.</p>`

    {
      title: "Sección 2: La Jerarquía de Protección",
      content: `<p>WKO Inc. sigue una <strong>jerarquía de tres niveles</strong> al abordar los peligros de caídas. La jerarquía va de lo más efectivo a lo menos efectivo. Siempre comience desde arriba.</p>
      <h3>Nivel 1 — Eliminación (Mejor)</h3>
      <p>Eliminar el peligro de caída por completo. Esta es siempre la primera y mejor opción. Ejemplos:</p>
      <ul>
        <li>Reubicar las tareas de trabajo al nivel del suelo cuando sea posible</li>
        <li>Usar equipos operados remotamente para evitar trabajo elevado</li>
        <li>Diseñar estructuras con sistemas de acceso permanentes y anclajes integrados</li>
      </ul>
      <h3>Nivel 2 — Prevención (Segundo Mejor)</h3>
      <p>Cuando la eliminación no es posible, use protección pasiva contra caídas que no dependa del comportamiento del empleado. Ejemplos:</p>
      <ul>
        <li><strong>Sistemas de barandas estándar</strong> — baranda superior a 42 pulgadas (±3 pulgadas), baranda intermedia y rodapié</li>
        <li><strong>Cubiertas de agujeros</strong> — aseguradas, marcadas "HOLE" o "COVER," y capaces de soportar el doble de la carga máxima</li>
        <li><strong>Sistemas completos de andamios</strong></li>
        <li><strong>Escaleras y sistemas de acceso fijos</strong></li>
      </ul>
      <h3>Nivel 3 — Detención de Caídas / Sistemas Activos (Último Recurso)</h3>
      <p>Los sistemas activos de protección contra caídas son la última línea de defensa. Requieren interacción y capacitación del empleado. Ejemplos:</p>
      <ul>

    {
      title: "Sección 3: Conozca Su Equipo",
      content: `<p>Cuando los peligros de caída no se pueden eliminar o prevenir con barandas, es posible que deba usar equipo personal de protección contra caídas. Comprender este equipo es esencial para su seguridad.</p>
      <h3>Arnés de Cuerpo Completo — Requerido</h3>
      <p>Solo se permiten arneses de cuerpo completo para la detención de caídas en WKO Inc. <strong>Los cinturones corporales están prohibidos para la detención de caídas</strong> — no distribuyen las fuerzas de detención de manera segura y pueden causar lesiones internas graves.</p>
      <ul>
        <li>Distribuye las fuerzas de detención de caídas en los muslos superiores, la pelvis, el pecho y los hombros</li>
        <li>El anillo D dorsal (centro de la espalda) es el punto de conexión principal para la detención de caídas</li>
        <li>Debe estar equipado con <strong>correas de alivio de suspensión</strong> (correas de trauma)</li>
      </ul>
      <h3>Línea de Vida con Absorbedor de Impacto</h3>
      <p>Una línea de vida con absorbedor de impacto (desaceleración) limita la fuerza máxima de detención en su cuerpo a <strong>1,800 libras o menos</strong>. Esto es crítico — sin ella, la parada repentina de una caída puede causar lesiones fatales incluso usando un arnés.</p>
      <h3>Dispositivos Autorretráctiles (SRDs)</h3>
      <p>Los dispositivos autorretráctiles permiten movimiento libre durante el trabajo normal, pero se bloquean instantáneamente cuando comienza una caída — similar a un cinturón de seguridad. WKO Inc. usa dos clases:</p>
      <ul>
        <li><strong>Clase 1</strong> — solo anclaje sobre la cabeza, caída libre máxima de 2 pies</li>
        <li><strong>Clase 2</strong> — por encima o debajo del anillo D, caída libre máxima de 6 pies (incluye unidades con clasificación de borde principal)</li>
      </ul>
      <h3>Conectores — Solo de Doble Bloqueo</h3>
      <p>Todos los ganchos y mosquetones deben ser <strong>de cierre automático y bloqueo automático (doble acción)</strong>. Los ganchos de acción simple están prohibidos. El seguro debe cerrarse y bloquearse automáticamente después de la conexión.</p>
      <h3>Anclaje — La Base</h3>
      <p>Todo se conecta a un punto de anclaje. Para detención de caídas, el anclaje debe soportar:</p>
      <div class="warn">⚠️ <strong>5,000 libras por trabajador conectado</strong> — o ser diseñado por una persona calificada con un factor de seguridad de al menos 2. Nunca se conecte a barandas, grúas o cualquier cosa que no esté clasificada como anclaje.</div>
      <h3>Distancia Total de Caída</h3>
      <p>Antes de trabajar en un sistema de detención de caídas, se debe calcular la distancia total de caída para asegurar que no entre en contacto con ningún nivel inferior. Esto incluye: longitud de la línea de vida + despliegue del absorbedor de impacto (típicamente 3.5 pies) + estiramiento del arnés (aproximadamente 1 pie) + un espacio libre mínimo de seguridad de 3 pies debajo de sus pies.</p>`
    },

      content: `<p>Todo el equipo personal de protección contra caídas debe ser inspeccionado por el usuario <strong>antes de cada uso</strong>. El equipo defectuoso debe retirarse del servicio de inmediato.</p>

    {
      title: "Sección 5: Trauma por Suspensión — Un Asesino Oculto",
      content: `<p>El trauma por suspensión (intolerancia ortostática) es una condición que amenaza la vida y ocurre cuando un trabajador cuelga inmóvil en un arnés después de una caída. Es uno de los conceptos más críticos de protección contra caídas que necesita comprender.</p>
      <h3>Qué Sucede</h3>
      <p>Cuando está suspendido inmóvil en un arnés de cuerpo completo, las correas de las piernas comprimen las arterias femorales en la parte superior de los muslos. La sangre se acumula en las piernas inferiores, reduciendo el suministro de oxígeno al cerebro, riñones y otros órganos vitales.</p>
      <h3>Qué Tan Rápido Ocurre</h3>
      <div class="danger">🚨 <strong>La pérdida de conciencia puede ocurrir en tan solo 15 minutos. La muerte puede ocurrir en menos de 30 minutos.</strong> Este no es un proceso lento — es una emergencia médica que requiere rescate inmediato.</div>
      <h3>Señales y Síntomas</h3>
      <ul>
        <li>Mareos, vértigo o desmayo</li>
        <li>Náuseas y sudoración</li>
        <li>Latidos rápidos del corazón seguidos de frecuencia cardíaca peligrosamente baja</li>
        <li>Sofocos y palidez</li>
        <li>Pérdida del conocimiento</li>
      </ul>
      <h3>Lo Que USTED Puede Hacer Mientras Está Suspendido</h3>
      <ul>
        <li><strong>Despliegue sus correas de alivio de suspensión inmediatamente</strong> — cada arnés en WKO Inc. las tiene. Crean un estribo para que pueda pararse en el arnés y aliviar la presión en sus piernas</li>
        <li><strong>Siga moviéndose</strong> — bombee sus piernas, empuje contra superficies, haga cualquier cosa para promover la circulación sanguínea</li>
        <li>Intente alcanzar una superficie, estructura o escalera cercana</li>
      </ul>
      <h3>Después del Rescate — Regla Crítica</h3>

      <div class="danger">🚨 <strong>TODO el equipo de protección contra caídas involucrado en un evento de caída se retira permanentemente.</strong> Etiquételo "FUERA DE SERVICIO — INVOLUCRADO EN EVENTO DE CAÍDA." No intente repararlo ni reutilizarlo. El equipo ha absorbido fuerzas de detención y ya no se puede confiar en él para protegerlo.</div>
      <h3>Investigación</h3>
      <p>Cada evento de caída y casi-accidente significativo será investigado por el Gerente de Seguridad. No altere el equipo de protección contra caídas ni el área de la caída hasta que se complete la investigación, a menos que sea necesario para el rescate. La investigación determinará las causas raíz y las acciones correctivas para prevenir la recurrencia.</p>
      <div class="cross-ref">📋 <strong>Capacitación relacionada:</strong> La capacitación de Evacuación de Emergencia cubre los procedimientos generales de emergencia de la instalación y los puntos de reunión. La capacitación de Protección Respiratoria cubre el uso de equipos respiratorios que pueden ser necesarios en algunos entornos de trabajo. Las técnicas prácticas de rescate en caídas se cubren en su capacitación anual con el capacitador contratado de protección contra caídas y rescate de la compañía.</div>`
    }
  ],
  quizQuestions: [
    {
      q: "En la jerarquía de protección contra caídas, ¿qué debe intentarse ANTES de usar un sistema personal de detención de caídas (arnés y línea de vida)?",
      opts: ["Señales de advertencia e instrucciones verbales", "Eliminación del peligro, luego barandas o barreras", "Una reunión de seguridad para discutir el peligro", "Proporcionar EPP adicional como cascos y guantes"],
      ans: 1
    },
    {
      q: "¿Qué tipo de soporte corporal está permitido para la DETENCIÓN personal de caídas en WKO Inc.?",
      opts: ["Un arnés de pecho con un anillo D frontal", "Cinturón corporal o arnés de cuerpo completo — cualquiera es aceptable", "Solo arnés de cuerpo completo — los cinturones corporales están prohibidos para la detención de caídas", "Un chaleco de seguridad con puntos de conexión integrados"],
      ans: 2
    },
    {
      q: "Durante una inspección de un SRD (dispositivo autorretráctil) antes del uso, ¿cómo verifica que el mecanismo de bloqueo funcione?",
      opts: ["Tire bruscamente de la línea para confirmar que se bloquea", "Inspeccione visualmente la etiqueta para ver si tiene una calcomanía verde", "Déjelo caer desde la cintura y vea si se engancha", "Presione el botón de reinicio en la carcasa"],
      ans: 0
    },
    {
      q: "Después de rescatar a un trabajador que estuvo suspendido en un arnés, ¿cuál es la posición correcta para colocarlo?",
      opts: ["Acostado boca arriba", "Sentado o semi-erguido durante al menos 30 minutos", "De pie y caminando inmediatamente", "De lado en posición de recuperación"],
      ans: 1
    },
    {
      q: "¿Qué sucede con el equipo de protección contra caídas después de haber estado involucrado en un evento de detención de caída?",
      opts: ["Se inspecciona y se devuelve al servicio si no se encuentra daño visible", "Se limpia, repara y vuelve a usar", "Se retira permanentemente del servicio — etiquételo y no lo reutilice", "Se devuelve al fabricante para recertificación"],
      ans: 2
    }
  ]
}
};
// ============================================================
// ENGINE
// ============================================================
const ANSWER_KEY = [1,2,0,1,2];
const FORM_URL = "https://forms.cloud.microsoft/r/YHYEJNbAMt";
const MODULE_VERSION = "v1.0";
const CODE_PREFIX = "FP26-";
const PASS_PCT = 80;
let lang = 'en', userName = '', currentScreen = 'splash', sectionIdx = 0, completionCode = null;
let quizIdx = 0, quizScore = 0, quizAnswers = [], quizLocked = false;

function L() { return LANG[lang]; }
function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === (l==='en'?'English':'Español')));
  render();
}
function genCode() {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let r = ''; for (let i=0;i<5;i++) r += c[Math.floor(Math.random()*c.length)];
  return CODE_PREFIX + r;
}
function render() {
  const l = L();
  document.getElementById('headerTitle').textContent = l.headerTitle;
  document.getElementById('headerSub').textContent = l.headerSub;
  document.getElementById('progBanner').textContent = l.progBanner;
  document.title = l.headerTitle + ' — WKO Inc.';
  const c = document.getElementById('appContainer');
  if (currentScreen === 'splash') renderSplash(c, l);
  else if (currentScreen === 'section') renderSection(c, l);
  else if (currentScreen === 'quiz') renderQuiz(c, l);
  else if (currentScreen === 'results') renderResults(c, l);
}
function renderSplash(c, l) {
  c.innerHTML = `<div class="card active">
    <div class="splash-title">${l.splashTitle}</div>
    <p>${l.splashText}</p>
    <div class="info" style="margin:12px 0">${l.splashNote}</div>
    <p style="margin-top:14px"><strong>${l.enterName}</strong></p>
    <input type="text" id="nameInput" placeholder="${l.namePlaceholder}" style="margin:8px 0">
    <div id="nameErr" class="hidden" style="color:#dc3545;font-size:.9em">${l.nameError}</div>
    <div><button class="btn btn-primary" onclick="startTraining()">${l.beginBtn}</button></div>
  </div>`;
  const inp = document.getElementById('nameInput');
  if (inp) { inp.value = userName; inp.addEventListener('keydown', e => { if (e.key === 'Enter') startTraining(); }); }
}
function startTraining() {
  const v = document.getElementById('nameInput').value.trim();
  if (!v || v.split(/\s+/).length < 2) { document.getElementById('nameErr').classList.remove('hidden'); return; }
  userName = v; currentScreen = 'section'; sectionIdx = 0; render();
}
function renderSection(c, l) {
  const sec = l.sections[sectionIdx];
  const totalSteps = l.sections.length + 1;
  const pct = Math.round((sectionIdx / totalSteps) * 100);
  let html = `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
  html += `<div class="card active"><div style="color:#666;font-size:.85em;margin-bottom:6px">${l.secLabel} ${sectionIdx+1} ${l.ofLabel} ${l.sections.length}</div><h2>${sec.title}</h2>${sec.content}`;
  if (sec.kc) {
    html += `<div style="margin-top:16px;padding-top:12px;border-top:2px solid #e0e0e0">
      <h3 style="color:#1F4E79">✓ ${lang==='en'?'Knowledge Check':'Verificación de Conocimiento'}</h3>
      <p style="margin:8px 0"><strong>${sec.kc.question}</strong></p>`;
    sec.kc.options.forEach((o, i) => {
      html += `<button class="quiz-option" id="kc-opt-${i}" onclick="selectKC(${i})">${o}</button>`;
    });
    html += `<div id="kcFeedback"></div>
      <div id="kcBtnRow" class="hidden"><button class="btn btn-primary" onclick="kcContinue()">${l.continueBtn}</button></div>
    </div>`;
  }
  html += `<div class="nav-row">`;
  if (sectionIdx > 0) html += `<button class="btn btn-secondary" onclick="prevSection()">${l.prevBtn}</button>`;
  else html += `<span></span>`;
  if (!sec.kc) {
    if (sectionIdx < l.sections.length - 1) html += `<button class="btn btn-primary" onclick="nextSection()">${l.nextBtn}</button>`;
    else html += `<button class="btn btn-success" onclick="goQuiz()">${l.startQuiz}</button>`;
  }
  html += `</div></div>`;
  c.innerHTML = html;
  window.scrollTo(0, 0);
}
let kcAnswered = false;
function selectKC(i) {
  if (kcAnswered) return;
  kcAnswered = true;
  const sec = L().sections[sectionIdx];
  const correct = sec.kc.correct;
  document.getElementById(`kc-opt-${i}`).classList.add(i===correct?'correct':'incorrect');
  if (i !== correct) document.getElementById(`kc-opt-${correct}`).classList.add('correct');
  document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
  const fb = document.getElementById('kcFeedback');
  fb.innerHTML = `<div class="kc-feedback ${i===correct?'kc-correct':'kc-incorrect'}">${i===correct?sec.kc.rightMsg:sec.kc.wrongMsg}</div>`;
  document.getElementById('kcBtnRow').classList.remove('hidden');
}
function kcContinue() {
  kcAnswered = false;
  if (sectionIdx < L().sections.length - 1) nextSection();
  else goQuiz();
}
function prevSection() { if (sectionIdx > 0) { sectionIdx--; kcAnswered = false; render(); } }
function nextSection() { sectionIdx++; kcAnswered = false; render(); }
function goQuiz() { currentScreen = 'quiz'; quizIdx = 0; quizScore = 0; quizAnswers = []; quizLocked = false; completionCode = null; render(); }
function renderQuiz(c, l) {
  const qs = l.quizQuestions;
  const q = qs[quizIdx];
  const totalSteps = l.sections.length + 1;
  const prog = Math.round(((l.sections.length + quizIdx/qs.length) / totalSteps) * 100);
  let html = `<div class="card active"><h2>${l.quizTitle}</h2>`;
  if (quizIdx === 0) html += `<p style="font-size:.9em;color:#444;margin-bottom:8px">${l.quizIntro} ${l.quizDetail||''}</p>`;
  html += `
    <div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
    <p style="font-size:.9em;color:#666;margin-bottom:4px">${l.questionOf.replace('{n}',quizIdx+1).replace('{t}',qs.length)}</p>
    <p style="margin:12px 0"><strong>${q.q}</strong></p>`;
  q.opts.forEach((o, i) => {
    html += `<button class="quiz-option" id="q-opt-${i}" onclick="selectQuizOpt(${i})">${o}</button>`;
  });
  html += `<div id="quizBtnRow"><button class="btn btn-primary" id="quizSubmitBtn" onclick="submitQuizAnswer()" disabled>${l.submitAnswer}</button></div></div>`;
  c.innerHTML = html;
  window.scrollTo(0, 0);
}
let selectedQuizOpt = -1;
function selectQuizOpt(i) {
  if (quizLocked) return;
  selectedQuizOpt = i;
  document.querySelectorAll('.quiz-option').forEach((b, j) => b.classList.toggle('selected', j===i));
  document.getElementById('quizSubmitBtn').disabled = false;
}
function submitQuizAnswer() {
  if (quizLocked || selectedQuizOpt < 0) return;
  quizLocked = true;
  const correct = ANSWER_KEY[quizIdx];
  quizAnswers.push(selectedQuizOpt);
  if (selectedQuizOpt === correct) quizScore++;
  document.getElementById(`q-opt-${selectedQuizOpt}`).classList.add(selectedQuizOpt===correct?'correct':'incorrect');
  if (selectedQuizOpt !== correct) document.getElementById(`q-opt-${correct}`).classList.add('correct');
  document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
  const l = L();
  const isLast = quizIdx >= l.quizQuestions.length - 1;
  document.getElementById('quizBtnRow').innerHTML = isLast
    ? `<button class="btn btn-success" onclick="showResults()">${l.seeResults}</button>`
    : `<button class="btn btn-primary" onclick="nextQuizQ()">${l.nextQuestion}</button>`;
}
function nextQuizQ() { quizIdx++; quizLocked = false; selectedQuizOpt = -1; render(); }
function showResults() { currentScreen = 'results'; render(); }
function renderResults(c, l) {
  const needed = Math.ceil(l.quizQuestions.length * PASS_PCT / 100);
  const passed = quizScore >= needed;
  const totalQ = l.quizQuestions.length;
  const pct = Math.round(quizScore / totalQ * 100);
  const today = new Date().toLocaleDateString(lang==='es'?'es-US':'en-US', {year:'numeric',month:'long',day:'numeric'});
  let html = '';
  if (passed) {
    if (!completionCode) completionCode = genCode();
    html += '<div class="card active"><p style="font-size:1.15em;font-weight:bold;color:#28a745">'+l.passH+'</p></div>';
    html += '<div class="cert">';
    html += '<div style="font-size:.95em;color:#666">'+l.passSub+'</div>';
    html += '<div style="font-size:1.5em;font-weight:bold;color:#1F4E79;margin:10px 0">'+userName+'</div>';
    html += '<div>'+l.passModule+'</div>';
    html += '<div style="margin:8px 0">'+l.scoreLabel+': <b>'+quizScore+'/'+totalQ+' ('+pct+'%)</b> &middot; '+l.dateLabel+': <b>'+today+'</b></div>';
    html += '<div style="margin-top:10px">'+l.codeLabel+':</div>';
    html += '<div class="code">'+completionCode+'</div>';
    html += '</div>';
    html += '<div class="card active" style="margin-top:12px"><p>'+l.passInstr+'</p>';
    html += '<div style="text-align:center;margin:12px 0"><a href="'+FORM_URL+'" target="_blank" class="btn btn-success" style="text-decoration:none;color:#fff">'+l.recordBtn+'</a></div>';
    html += '</div>';
  } else {
    html += '<div class="card active">';
    html += '<p style="font-size:1.15em;font-weight:bold;color:#dc3545">'+l.failH+'</p>';
    html += '<p style="margin:8px 0">'+l.yourScore+': <b>'+quizScore+'/'+totalQ+' ('+pct+'%)</b></p>';
    html += '<p style="margin:8px 0;font-size:.95em">'+(l.failDetail||'')+'</p>';
    html += '<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">';
    html += '<button class="btn btn-secondary" onclick="retryFromSections()">'+l.reviewBtn+'</button>';
    html += '<button class="btn btn-primary" onclick="retakeQuiz()">'+l.retakeBtn+'</button>';
    html += '</div></div>';
  }
  c.innerHTML = html;
  window.scrollTo(0, 0);
}
function retryFromSections() { currentScreen = 'section'; sectionIdx = 0; render(); }
function retakeQuiz() { currentScreen = 'quiz'; quizIdx = 0; quizScore = 0; quizAnswers = []; quizLocked = false; selectedQuizOpt = -1; render(); }
render();
</script>
</body>
</html>
