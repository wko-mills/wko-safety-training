      content: `<p>WKO Inc. is a wood products manufacturing facility. Every day, our mill produces the very materials that make hot work dangerous: sawdust, wood chips, bark, shavings, and dried lumber. These combustible materials are present in production areas, on equipment, in conveyors, in dust collection systems, and on the ground.</p>

function startTraining() {
  const v = document.getElementById('nameInput').value.trim();
  if (!v || v.split(/\s+/).length < 2) { document.getElementById('nameErr').classList.remove('hidden'); return; }
  userName = v; currentScreen = 'section'; sectionIdx = 0; render();
}
function renderSection(c, l) {
  const sec = l.sections[sectionIdx];
  const totalSteps = l.sections.length + 1; // sections + quiz
  const pct = Math.round((sectionIdx / totalSteps) * 100);
  let html = `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
  html += `<div class="card active"><div style="color:#666;font-size:.85em;margin-bottom:6px">${l.secLabel} ${sectionIdx+1} ${l.ofLabel} ${l.sections.length}</div><h2>${sec.title}</h2>${sec.content}`;
  if (sec.kc) {
    html += `<div style="margin-top:16px;padding-top:12px;border-top:2px solid #e0e0e0">
      <h3 style="color:#1F4E79">✓ ${lang==='en'?'Knowledge Check':'Verificación de Conocimiento'}</h3>
      <p style="margin:8px 0"><strong>${sec.kc.question}</strong></p>`;
    sec.kc.options.forEach((o, i) => {
      html += `<button class="quiz-option" id="kc-opt-${i}" onclick="selectKC(${i})">${o}</button>`;
    });
    html += `<div id="kcFeedback"></div>
      <div id="kcBtnRow" class="hidden"><button class="btn btn-primary" onclick="kcContinue()">${l.continueBtn}</button></div>
    </div>`;
  }
  html += `<div class="nav-row">`;
  if (sectionIdx > 0) html += `<button class="btn btn-secondary" onclick="prevSection()">${l.prevBtn}</button>`;
  else html += `<span></span>`;
  if (!sec.kc) {
    if (sectionIdx < l.sections.length - 1) html += `<button class="btn btn-primary" onclick="nextSection()">${l.nextBtn}</button>`;
    else html += `<button class="btn btn-success" onclick="goQuiz()">${l.startQuiz}</button>`;
  }
  html += `</div></div>`;
  c.innerHTML = html;
  window.scrollTo(0, 0);
}
let kcAnswered = false;
function selectKC(i) {
  if (kcAnswered) return;
  kcAnswered = true;
  const sec = L().sections[sectionIdx];
  const correct = sec.kc.correct;
  document.getElementById(`kc-opt-${i}`).classList.add(i===correct?'correct':'incorrect');
  if (i !== correct) document.getElementById(`kc-opt-${correct}`).classList.add('correct');
  document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
  const fb = document.getElementById('kcFeedback');
  fb.innerHTML = `<div class="kc-feedback ${i===correct?'kc-correct':'kc-incorrect'}">${i===correct?sec.kc.rightMsg:sec.kc.wrongMsg}</div>`;
  document.getElementById('kcBtnRow').classList.remove('hidden');
}
function kcContinue() {
  kcAnswered = false;
  if (sectionIdx < L().sections.length - 1) nextSection();
  else goQuiz();
}
function prevSection() { if (sectionIdx > 0) { sectionIdx--; kcAnswered = false; render(); } }
function nextSection() { sectionIdx++; kcAnswered = false; render(); }
function goQuiz() { currentScreen = 'quiz'; quizIdx = 0; quizScore = 0; quizAnswers = []; quizLocked = false; completionCode = null; render(); }
function renderQuiz(c, l) {
  const qs = l.quizQuestions;
  const q = qs[quizIdx];
  const totalSteps = l.sections.length + 1;
  const prog = Math.round(((l.sections.length + quizIdx/qs.length) / totalSteps) * 100);
  let html = `<div class="card active"><h2>${l.quizTitle}</h2>`;
  if (quizIdx === 0) html += `<p style="font-size:.9em;color:#444;margin-bottom:8px">${l.quizIntro} ${l.quizDetail||''}</p>`;
  html += `
    <div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
    <p style="font-size:.9em;color:#666;margin-bottom:4px">${l.questionOf.replace('{n}',quizIdx+1).replace('{t}',qs.length)}</p>
    <p style="margin:12px 0"><strong>${q.q}</strong></p>`;
  q.opts.forEach((o, i) => {
    html += `<button class="quiz-option" id="q-opt-${i}" onclick="selectQuizOpt(${i})">${o}</button>`;
  });
  html += `<div id="quizBtnRow"><button class="btn btn-primary" id="quizSubmitBtn" onclick="submitQuizAnswer()" disabled>${l.submitAnswer}</button></div></div>`;
  c.innerHTML = html;
  window.scrollTo(0, 0);
}
let selectedQuizOpt = -1;
function selectQuizOpt(i) {
  if (quizLocked) return;
  selectedQuizOpt = i;
  document.querySelectorAll('.quiz-option').forEach((b, j) => b.classList.toggle('selected', j===i));
  document.getElementById('quizSubmitBtn').disabled = false;
}
function submitQuizAnswer() {
  if (quizLocked || selectedQuizOpt < 0) return;
  quizLocked = true;
  const correct = ANSWER_KEY[quizIdx];
  quizAnswers.push(selectedQuizOpt);
  if (selectedQuizOpt === correct) quizScore++;
  document.getElementById(`q-opt-${selectedQuizOpt}`).classList.add(selectedQuizOpt===correct?'correct':'incorrect');
  if (selectedQuizOpt !== correct) document.getElementById(`q-opt-${correct}`).classList.add('correct');
  document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
  const l = L();
  const isLast = quizIdx >= l.quizQuestions.length - 1;
  document.getElementById('quizBtnRow').innerHTML = isLast
    ? `<button class="btn btn-success" onclick="showResults()">${l.seeResults}</button>`
    : `<button class="btn btn-primary" onclick="nextQuizQ()">${l.nextQuestion}</button>`;
}
function nextQuizQ() { quizIdx++; quizLocked = false; selectedQuizOpt = -1; render(); }
function showResults() { currentScreen = 'results'; render(); }
function renderResults(c, l) {
  const needed = Math.ceil(l.quizQuestions.length * PASS_PCT / 100);
  const passed = quizScore >= needed;
  const totalQ = l.quizQuestions.length;
  const pct = Math.round(quizScore / totalQ * 100);
  const today = new Date().toLocaleDateString(lang==='es'?'es-US':'en-US', {year:'numeric',month:'long',day:'numeric'});
  let html = '';
  if (passed) {
    if (!completionCode) completionCode = genCode();
    html += '<div class="card active"><p style="font-size:1.15em;font-weight:bold;color:#28a745">'+l.passH+'</p></div>';
    html += '<div class="cert">';
    html += '<div style="font-size:.95em;color:#666">'+l.passSub+'</div>';
    html += '<div style="font-size:1.5em;font-weight:bold;color:#1F4E79;margin:10px 0">'+userName+'</div>';
    html += '<div>'+l.passModule+'</div>';
    html += '<div style="margin:8px 0">'+l.scoreLabel+': <b>'+quizScore+'/'+totalQ+' ('+pct+'%)</b> &middot; '+l.dateLabel+': <b>'+today+'</b></div>';
    html += '<div style="margin-top:10px">'+l.codeLabel+':</div>';
    html += '<div class="code">'+completionCode+'</div>';
    html += '</div>';
    html += '<div class="card active" style="margin-top:12px"><p>'+l.passInstr+'</p>';
    html += '<div style="text-align:center;margin:12px 0"><a href="'+FORM_URL+'" target="_blank" class="btn btn-success" style="text-decoration:none;color:#fff">'+l.recordBtn+'</a></div>';
    html += '</div>';
  } else {
    html += '<div class="card active">';
    html += '<p style="font-size:1.15em;font-weight:bold;color:#dc3545">'+l.failH+'</p>';
    html += '<p style="margin:8px 0">'+l.yourScore+': <b>'+quizScore+'/'+totalQ+' ('+pct+'%)</b></p>';
    html += '<p style="margin:8px 0;font-size:.95em">'+(l.failDetail||'')+'</p>';
    html += '<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">';
    html += '<button class="btn btn-secondary" onclick="retryFromSections()">'+l.reviewBtn+'</button>';
    html += '<button class="btn btn-primary" onclick="retakeQuiz()">'+l.retakeBtn+'</button>';
    html += '</div></div>';
  }
  c.innerHTML = html;
  window.scrollTo(0, 0);
}
function retryFromSections() { currentScreen = 'section'; sectionIdx = 0; render(); }
function retakeQuiz() { currentScreen = 'quiz'; quizIdx = 0; quizScore = 0; quizAnswers = []; quizLocked = false; selectedQuizOpt = -1; render(); }
render();
</script>
</body>
</html>
