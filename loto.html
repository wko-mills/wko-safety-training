<style>
  :root { --blue:#2E75B6; --dark:#1F4E79; --light:#F2F2F2; --gray:#666666; --red:#C00000; --green:#2E7D32; --amber:#E07B00; }

  .langbar { text-align:right; padding:10px 16px 0; }

  .kc { background:var(--light); border-left:4px solid var(--blue); padding:16px; border-radius:0 6px 6px 0; margin-top:16px; }

  .cert { border:3px solid var(--dark); border-radius:10px; padding:26px; text-align:center; background:#fff; }
  .cert .big { font-size:1.5em; color:var(--dark); font-weight:bold; margin:10px 0; }
  .cert .code { font-size:1.6em; letter-spacing:2px; font-weight:bold; color:var(--blue); background:var(--light); display:inline-block; padding:8px 20px; border-radius:6px; margin:10px 0; }
  .passmsg { color:var(--green); font-weight:bold; font-size:1.2em; }
  .failmsg { color:var(--red); font-weight:bold; font-size:1.2em; }

<script>
"use strict";
var FORM_URL = "https://forms.cloud.microsoft/r/YHYEJNbAMt";

/* ------------ Language packs ------------ */
var STR = {
en: {
  basedOn: "Based on the WKO Inc. Lockout/Tagout Program v2.0 (chapter 296-803 WAC). Questions? Contact the Environmental Compliance and Safety Lead.",
  introH: "Welcome — Lockout/Tagout at WKO Inc.",
  introP1: "This training covers how hazardous energy is controlled at WKO Inc.: what a lock on a disconnect means, what you must never do, and what to do when equipment around you is locked out. It takes about 20 minutes.",
  introP2: "</p><div class='notice'><b>Why this one matters:</b> lockout exists because machines can start, move, or release energy when nobody is touching the controls. People die this way in sawmills. The lock is what stands between a coworker and the machine.</div><p>Required for all WKO Inc. employees. Employees who personally apply locks (authorized employees) receive additional training.",
  nameLabel: "Enter your full name to begin:",
  namePh: "First and last name",
  startBtn: "Start Training",
  continueBtn: "Continue",
  checkBtn: "Check Answer",
  kcOk: "Correct — well done.",
  kcBad: "Not quite — the correct answer is highlighted. Review it, then continue.",
  secLabel: "Section",
  ofLabel: "of",
  sections: [
    { h:"1. Why Lockout Exists", body:
      "<p>A machine does not need a hand on its controls to start. Automatic sequences restart conveyors. Control faults energize motors. Pressure moves cylinders. And the electrical gear itself is not perfect:</p>"+
      "<div class='notice'><b>\"MCCs are mechanical devices — failures should be expected, and labeling errors are inherently possible.\"</b> That line is in our program because MCC buckets at this facility <b>have</b> failed. A stop button, a selector switch, or an operator's promise is never protection.</p>"+
      "<p><b>Lockout</b> means the energy is physically disconnected at the source — the disconnect, the valve — and a lock holds it there so the machine <i>cannot</i> be operated until the lock comes off. Stop buttons and control switches are <b>not</b> energy-isolating devices: they ask the machine to stop; a disconnect makes it unable to run.</p>"+
      "<p>At WKO Inc., <b>authorized employees</b> — people trained to lock out specific equipment — apply the locks. This module is about what everyone else must know and do.</p>",
      kc:{ q:"Why isn't pressing STOP enough protection for someone working inside a machine?", opts:["It is enough if the operator stays nearby","Stop buttons are control devices — they don't remove energy, and the machine can restart","It is enough for short jobs","STOP works as long as a tag is added"], a:1 } },

    { h:"2. Nine Kinds of Energy", body:
      "<p>Electricity is only one of them. Our program recognizes <b>nine energy sources</b> in this mill:</p>"+
      "<table class='mini'><tr><th>Energy</th><th>Where you see it</th></tr>"+
      "<tr><td><b>Electrical</b></td><td>Motors, MCC buckets, welders, capacitors</td></tr>"+
      "<tr><td><b>Pneumatic (air)</b></td><td>Air valves, cylinders, gates, brushes, hoods</td></tr>"+
      "<tr><td><b>Hydraulic</b> (high/low/stored)</td><td>HPUs, log loaders, kickers, chargers</td></tr>"+
      "<tr><td><b>Gravity</b></td><td>Log decks, elevated conveyors, raised gates, material in hoppers</td></tr>"+
      "<tr><td><b>Steam</b></td><td>Kilns, boiler and steam plant lines</td></tr>"+
      "<tr><td><b>Momentum</b></td><td>Saw arbors and flywheels that keep spinning after power-off</td></tr>"+
      "<tr><td><b>Stored energy</b></td><td>Springs, accumulators, charged capacitors, trapped pressure</td></tr>"+
      "<tr><td><b>Infrared</b></td><td>Scanner and detection systems</td></tr>"+
      "<tr><td><b>Lasers</b></td><td>Alignment and scanning lasers</td></tr></table>"+
      "<p><b>Killing the electricity does not make a machine safe.</b> A raised deck can still fall. A pressurized line can still release. An arbor can still be spinning. Every energy source on the machine must be isolated and any stored energy released or restrained before the machine is safe.</p>",
      kc:{ q:"The electrical disconnect is off and locked. What can still hurt you?", opts:["Nothing — the machine is safe","Only static electricity","Stored energy: raised loads, trapped pressure, parts still spinning","Only heat"], a:2 } },

    { h:"3. The Lock and the Tag", body:
      "<div style='text-align:center;margin:14px 0;'><div style='display:inline-block;vertical-align:top;text-align:center;margin:0 14px;'><svg width='120' height='150' viewBox='0 0 120 150'><path d='M35 62 V40 a25 25 0 0 1 50 0 V62' fill='none' stroke='#8a8f98' stroke-width='11'/><rect x='22' y='60' width='76' height='72' rx='8' fill='#C00000'/><rect x='30' y='82' width='60' height='30' rx='3' fill='#fff'/><text x='60' y='95' text-anchor='middle' font-family='Arial' font-size='9.5' font-weight='bold' fill='#1F4E79'>MIGUEL</text><text x='60' y='107' text-anchor='middle' font-family='Arial' font-size='9.5' font-weight='bold' fill='#1F4E79'>TORRES</text></svg><div style='font-size:.85em;color:#666;'>Your lock: first and last name</div></div><div style='display:inline-block;vertical-align:top;text-align:center;margin:0 14px;'><svg width='104' height='150' viewBox='0 0 104 150'><rect x='12' y='8' width='80' height='134' rx='6' fill='#fff' stroke='#333' stroke-width='2'/><circle cx='52' cy='22' r='6' fill='none' stroke='#333' stroke-width='2'/><rect x='12' y='34' width='80' height='26' fill='#C00000'/><text x='52' y='52' text-anchor='middle' font-family='Arial' font-size='14' font-weight='bold' fill='#fff'>DANGER</text><text x='52' y='84' text-anchor='middle' font-family='Arial' font-size='11' font-weight='bold' fill='#111'>DO NOT</text><text x='52' y='99' text-anchor='middle' font-family='Arial' font-size='11' font-weight='bold' fill='#111'>OPERATE</text><text x='52' y='124' text-anchor='middle' font-family='Arial' font-size='7.5' fill='#666'>Locked out by: (name)</text></svg><div style='font-size:.85em;color:#666;'>DO NOT OPERATE tag</div></div></div>"+
      "<p>Every WKO lock carries the owner's <b>first and last name</b>. One person, one lock, one key. The name is the authority: only that person may remove that lock. A <b>DO NOT OPERATE</b> tag identifies the lockout and warns everyone at the point of control.</p>"+
      "<p><b>The absolute rules — no exceptions, no matter who asks:</b></p>"+
      "<ul><li><b>Never remove, open, bypass, or borrow another person's lock or tag.</b> Not for a supervisor, not to \"help,\" not because they went home.</li>"+
      "<li><b>Never attempt to start, energize, or operate</b> any machine that is locked or tagged out.</li>"+
      "<li><b>A tag alone is a warning, not a restraint.</b> If a device physically cannot take a lock, a tag is used with extra safeguards — you treat that tag with exactly the respect you give a lock.</li></ul>",
      kc:{ q:"You need a machine that is locked out, and the lock belongs to someone who already went home. What do you do?", opts:["Tell your supervisor — never touch the lock","Cut the lock if the area looks clear","Remove it since the owner is gone","Start the machine from a different control"], a:0 } },

    { h:"4. Reading the System: MCCs, Colors, and Stickers", body:
      "<p>Electrical power in each department runs through <b>Motor Control Centers (MCCs)</b> — panels of individual \"buckets,\" one per circuit. Every MCC has a <b>color code</b>, every bucket has a <b>position</b> (like 8C), and every circuit has a <b>sticker description</b> that names the equipment and its number.</p>"+
      "<div style='max-width:330px;margin:12px auto;border:1px solid #CCCCCC;border-radius:8px;overflow:hidden;'><div style='background:#f5d90a;color:#333;font-weight:bold;text-align:center;padding:7px;'>MCC-1 &middot; YELLOW &mdash; Stud Mill Basement, North Wall</div><table style='width:100%;border-collapse:collapse;background:#fff;'><tr><td style='border:1px solid #CCCCCC;padding:7px 4px;text-align:center;font-size:.85em;'>8A</td><td style='border:1px solid #CCCCCC;padding:7px 4px;text-align:center;font-size:.85em;background:#eaf2fb;font-weight:bold;border:2px solid #2E75B6;'>8C</td><td style='border:1px solid #CCCCCC;padding:7px 4px;text-align:center;font-size:.85em;'>8E</td></tr><tr><td style='border:1px solid #CCCCCC;padding:7px 4px;text-align:center;font-size:.85em;'>9A</td><td style='border:1px solid #CCCCCC;padding:7px 4px;text-align:center;font-size:.85em;'>9C</td><td style='border:1px solid #CCCCCC;padding:7px 4px;text-align:center;font-size:.85em;color:#999;'>9E</td></tr></table></div>"+
      "<p>The written lockout procedure for a machine tells the authorized employee exactly which buckets to lock: MCC, position, color, and sticker text — all four must match before a lock goes on.</p>"+
      "<div class='notice'><b>Colors do not carry between departments.</b> The color identifies a panel <i>within</i> a department:</div>"+
      "<div style='margin:10px 0;'><div style='margin-bottom:6px;'><b>Stud Mill:</b> <span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#f5d90a;color:#333;'>MCC-1</span> <span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#f28c28;color:#fff;'>MCC-4</span> <span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#9acd32;color:#333;'>MCC-7</span> <span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#2E75B6;color:#fff;'>MCC-8</span></div><div><b>Planer Mill:</b> <span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#f5d90a;color:#333;'>MCC-1</span> <span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#2E75B6;color:#fff;'>MCC-2</span> <span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#7a4ba0;color:#fff;'>MCC-5</span> <span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#C00000;color:#fff;'>MCC-8</span></div></div>"+
      "<p>MCC-8 is <b>blue</b> in the Stud Mill and <b>red</b> in the Planer Mill. Match the MCC <b>number + color + sticker description</b> on <i>your department's</i> procedure — never assume a color means the same panel somewhere else.</p>"+
      "<p><b>Remote disconnects:</b> some circuits — not all — also have a remote disconnect mounted near the machine, named after its bucket (bucket <b>8A</b> pairs with remote <b>8Aa</b>, wearing the same color). Stand-alone remotes fed from the transformer are <b>gray</b>. A lock on the proper remote isolates that circuit the same as a lock on the bucket.</p>",
      kc:{ q:"Does an MCC color mean the same panel in every department?", opts:["Yes — colors are facility-wide","Only for electrical panels","Colors change monthly","No — match MCC number + color + sticker description on your own department's procedure"], a:3 } },

    { h:"5. What a Real Lockout Looks Like", body:
      "<p>Here is part of the actual Stud Mill <b>Log Decks</b> procedure, the way authorized employees see it:</p>"+
      "<div style='border:1px solid #CCCCCC;border-radius:8px;margin:12px 0;overflow:hidden;background:#fff;'><div style='display:flex;justify-content:space-between;align-items:center;background:#1F4E79;color:#fff;padding:8px 12px;'><b>Log Decks — Lockout Procedure (excerpt)</b><span style='background:#C00000;border-radius:12px;padding:2px 10px;font-size:.82em;font-weight:bold;'>&#128274; 15 locks/tags required</span></div><div style='background:#fff3cd;color:#7a5c00;padding:6px 12px;font-size:.85em;'><b>&#9888;&#65039; Always perform a machine stop before locking out disconnect</b></div><div style='display:flex;align-items:center;gap:8px;padding:6px 8px;border-top:1px solid #eee;'><div style='min-width:20px;height:20px;border-radius:50%;background:#1F4E79;color:#fff;font-size:.8em;font-weight:bold;display:flex;align-items:center;justify-content:center;'>1</div><span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#f5d90a;color:#333;white-space:nowrap;'>MCC-1 &middot; 8A or 8Aa &middot; YELLOW</span><div style='font-size:.88em;'>Stud Block Roll Case &middot; 214.100 &mdash; Stud Mill Basement, North Wall (remote 8Aa: East of Computer Rm catwalk)</div></div><div style='display:flex;align-items:center;gap:8px;padding:6px 8px;border-top:1px solid #eee;'><div style='min-width:20px;height:20px;border-radius:50%;background:#1F4E79;color:#fff;font-size:.8em;font-weight:bold;display:flex;align-items:center;justify-content:center;'>2</div><span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#9acd32;color:#333;white-space:nowrap;'>MCC-7 &middot; 3E &middot; LIME GREEN</span><div style='font-size:.88em;'>HPU #6 &middot; 500.600 &mdash; Stud Mill Basement, South Wall</div></div><div style='display:flex;align-items:center;gap:8px;padding:6px 8px;border-top:1px solid #eee;'><div style='min-width:20px;height:20px;border-radius:50%;background:#1F4E79;color:#fff;font-size:.8em;font-weight:bold;display:flex;align-items:center;justify-content:center;'>3</div><span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#8a8f98;color:#fff;white-space:nowrap;'>REMOTE 15a &middot; GRAY</span><div style='font-size:.88em;'>Remote Disconnect 15a &mdash; North of Head Rig, on wall</div></div><div style='display:flex;align-items:center;gap:8px;padding:6px 8px;border-top:1px solid #eee;'><div style='min-width:20px;height:20px;border-radius:50%;background:#1F4E79;color:#fff;font-size:.8em;font-weight:bold;display:flex;align-items:center;justify-content:center;'>4</div><span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#2E75B6;color:#fff;white-space:nowrap;'>HYD VALVE 3</span><div style='font-size:.88em;'>Hydraulic quarter-turn valve &mdash; West side of Rotary Kicker, on catwalk</div></div><div style='padding:7px 12px;background:#F2F2F2;font-size:.82em;color:#666;'>…continues: 12 more isolation points across MCC-1, MCC-4, MCC-7, MCC-8, hydraulic and air valves. Verify at the named control for EVERY device.</div></div>"+
      "<p>Notice what that tells you: a \"simple\" lockout of the log decks takes <b>15 locks or tags</b> across multiple MCCs, remotes, and valves. One lock is almost never the whole job.</p>"+
      "<p><b>Your part as an affected employee:</b></p>"+
      "<ul><li>The authorized employee <b>notifies you before</b> locks go on and <b>before</b> they come off and the machine re-energizes. Take the notification seriously — move clear.</li>"+
      "<li>A <b>machine stop is always performed first</b>, then the disconnects are locked. Don't touch the controls during any of it.</li>"+
      "<li>Respect barricades and warnings. When a procedure says \"inform the forklift driver, place a barricade,\" that barricade is part of the lockout.</li></ul>",
      kc:{ q:"Before a locked-out machine is re-energized, you should expect…", opts:["The machine to simply start","A test run at half speed","To be notified that locks are coming off and the machine will start","Nothing — re-energizing is silent"], a:2 } },

    { h:"6. Finding a Lock — or a Machine You Didn't Expect Locked", body:
      "<p>Sooner or later you will find a lock where you did not expect one, or need equipment someone locked out and left.</p>"+
      "<ul><li><b>The lock stays on.</b> Only the person named on it removes it — that is the entire system.</li>"+
      "<li><b>Tell your supervisor.</b> If the owner truly cannot be found and the equipment must run, there is a strict emergency procedure — contact attempts, confirming the person is off site, a supervisor's direct control, and informing the owner before they return to work. <b>Only a supervisor can direct it. It is never done casually, and never by you.</b></li>"+
      "<li><b>Report orphan locks</b> — a lock that seems forgotten still means someone may be exposed somewhere. Never assume.</li></ul>",
      kc:{ q:"Who can direct removal of a lock when its owner cannot be found?", opts:["Any authorized employee","A supervisor, following the strict emergency procedure — no one else","Whoever needs the machine","The next shift"], a:1 } },

    { h:"7. Group Lockout and Shift Changes", body:
      "<p>Big jobs involve crews. <b>Group lockout</b> works like this: the energy is isolated once, and every worker on the job attaches a <b>personal lock</b> to a group device — a hasp or a lockbox. A <b>primary authorized employee</b> runs the job, locks on first, and comes off <b>last</b>.</p>"+
      "<p><b>The job is not done until the last personal lock is off.</b> If your lock is on that hasp, no one can start the machine — and you never remove your lock until <i>your</i> work is finished and you are clear.</p>"+
      "<p><b>Shift changes:</b> protection never lapses. The incoming employee's lock goes <b>on before</b> the outgoing employee's lock comes off, with both present. Equipment is never left unprotected in between.</p>",
      kc:{ q:"During a group lockout, when can the machine be re-energized?", opts:["When the primary authorized employee's work is done","When the shift ends","At the supervisor's request","Only after the last personal lock is removed from the group device"], a:3 } },

    { h:"8. When Lockout Applies to YOU", body:
      "<p>Lockout is not just for millwrights. <b>Service and maintenance</b> includes unjamming, cleaning, clearing upset conditions, lubricating, adjusting, and tool changes — the everyday tasks of operators and clean-up crews.</p>"+
      "<div class='notice'><b>\"If your feet leave the catwalk, lock out.\"</b> That is the standing rule on the barker complex, and the thinking applies everywhere: if a task puts your body where the machine can reach it, the machine gets locked out first.</div>"+
      "<ul><li>A jam that takes \"just a few seconds\" to clear is still service work. Seconds are all a machine needs.</li>"+
      "<li>If the task requires removing or reaching past a guard, or placing any part of your body in the point of operation — <b>lockout first</b>.</li>"+
      "<li>If you are not trained and authorized to lock out that equipment: <b>stop and get the authorized person</b>. Asking is never the wrong move.</li></ul>",
      kc:{ q:"A board is jammed and you could flip it clear in five seconds by reaching past the guard. What is required?", opts:["Nothing, if the operator watches","Just a machine stop","Lockout — reaching past a guard is service work, no matter how quick","A second person standing by"], a:2 } },

    { h:"9. Your Responsibilities", body:
      "<p>As an affected or other employee, you are required to:</p>"+
      "<ul><li>Follow every lockout/tagout instruction and never attempt to restart or operate locked or tagged equipment.</li>"+
      "<li>Report concerns immediately: damaged locks, missing tags, unclear procedures, or anything that looks wrong at an MCC or disconnect.</li>"+
      "<li>Leave electrical enclosures alone. <b>Opening electrical panels and resetting MCC buckets is restricted to company electricians, qualified maintenance personnel, and other employees the company has trained and qualified for that work.</b> If you have not been designated for it, it is not your job — report it and stand clear.</li></ul>"+
      "<p>Violations of lockout/tagout endanger lives and are subject to disciplinary action under the Employee Handbook.</p>"+
      "<p>Your department's machine-specific procedures are posted at the point of use — your supervisor will show you where. When in doubt about anything with a lock on it: stop, ask, and never touch the lock.</p>",
      kc:{ q:"A bucket in the MCC has tripped and production is waiting. Who resets it?", opts:["A company electrician or another employee the company has trained and qualified for that work","The nearest operator","Anyone who has watched it done","The person who locked it out last"], a:0 } }
  ],
  quiz: [
    { q:"Why is pressing STOP not enough protection for service work?", opts:["It is enough for short tasks","It is enough if a tag is added","Stop buttons are control devices — they do not remove energy, and the machine can restart","It is enough when the operator stays at the controls"], a:2 },
    { q:"Whose lock may you remove?", opts:["Only your own — never anyone else's, for any reason","Your crew's locks","Any lock, if a supervisor is watching","Locks left on overnight"], a:0 },
    { q:"Even with electrical power locked out, hazards can remain from…", opts:["Nothing — electricity is the only hazard","Only the lighting circuits","Only static","Stored energy: raised loads, trapped pressure, and parts still spinning"], a:3 },
    { q:"MCC colors across departments…", opts:["Are identical facility-wide","Identify panels within a department — the same MCC number can be a different color in another department","Follow the rainbow in order","Only apply to the Stud Mill"], a:1 },
    { q:"A remote disconnect such as 8Aa…", opts:["Exists on every machine","Replaces the need for locks","Pairs with its MCC bucket on some machines — not all machines have one","Is always gray"], a:2 },
    { q:"You find a lock on equipment and its owner went home. You should…", opts:["Tell your supervisor — only a supervisor may direct the emergency removal procedure","Remove it, since the owner is off site","Wait an hour, then remove it","Start the machine from another control"], a:0 },
    { q:"Clearing a jam that takes \"just a few seconds\"…", opts:["Needs only a machine stop","Is fine if a coworker watches","Is exempt from the program","Is service work — lockout applies before you reach past a guard"], a:3 },
    { q:"In a group lockout, the machine can be re-energized when…", opts:["The primary authorized employee finishes","The last personal lock comes off the hasp or lockbox","The shift changes","Most of the crew is done"], a:1 },
    { q:"A DO NOT OPERATE tag without a lock…", opts:["Is a warning that you must treat exactly like a lock — never operate the device","Can be ignored after 24 hours","Means the machine is probably fine","Only applies to electricians"], a:0 },
    { q:"Before a locked-out machine is re-energized, affected employees must be…", opts:["Off shift","Standing at the controls","Notified that locks are being removed and the machine will start","Nothing is required"], a:2 }
  ],

es: {
  basedOn: "Basado en el Programa de Bloqueo y Etiquetado de WKO Inc. v2.0 (capítulo 296-803 WAC). ¿Preguntas? Contacte al Líder de Cumplimiento Ambiental y Seguridad.",
  introH: "Bienvenido — Bloqueo y Etiquetado en WKO Inc.",
  introP1: "Esta capacitación cubre cómo se controla la energía peligrosa en WKO Inc.: qué significa un candado en un desconectador, lo que usted nunca debe hacer, y qué hacer cuando el equipo a su alrededor está bloqueado. Toma unos 20 minutos.",
  introP2: "</p><div class='notice'><b>Por qué esta importa:</b> el bloqueo existe porque las máquinas pueden arrancar, moverse o liberar energía cuando nadie está tocando los controles. Así muere gente en los aserraderos. El candado es lo que protege a un compañero de la máquina.</div><p>Requerida para todos los empleados de WKO Inc. Los empleados que aplican candados personalmente (empleados autorizados) reciben capacitación adicional.</p><p style='font-size:.85em;color:#666;'>Nota: los nombres de equipos y las descripciones de las etiquetas aparecen en inglés, tal como están rotulados en el piso.",
  nameLabel: "Escriba su nombre completo para comenzar:",
  namePh: "Nombre y apellido",
  startBtn: "Comenzar la Capacitación",
  continueBtn: "Continuar",
  checkBtn: "Verificar Respuesta",
  kcOk: "Correcto — bien hecho.",
  kcBad: "No exactamente — la respuesta correcta está resaltada. Revísela y continúe.",
  secLabel: "Sección",
  ofLabel: "de",
  sections: [
    { h:"1. Por Qué Existe el Bloqueo", body:
      "<p>Una máquina no necesita una mano en sus controles para arrancar. Las secuencias automáticas reinician transportadores. Las fallas de control energizan motores. La presión mueve cilindros. Y el equipo eléctrico mismo no es perfecto:</p>"+
      "<div class='notice'><b>\"Los MCC son dispositivos mecánicos — se deben esperar fallas, y los errores de etiquetado son inherentemente posibles.\"</b> Esa línea está en nuestro programa porque los compartimentos de MCC en esta planta <b>han</b> fallado. Un botón de paro, un selector, o la promesa de un operador nunca son protección.</p>"+
      "<p><b>Bloqueo</b> significa que la energía está físicamente desconectada en la fuente — el desconectador, la válvula — y un candado la mantiene así para que la máquina <i>no pueda</i> operarse hasta que se quite el candado. Los botones de paro y los interruptores de control <b>no</b> son dispositivos de aislamiento de energía: le piden a la máquina que se detenga; un desconectador hace que no pueda funcionar.</p>"+
      "<p>En WKO Inc., los <b>empleados autorizados</b> — personas capacitadas para bloquear equipos específicos — aplican los candados. Este módulo trata de lo que todos los demás deben saber y hacer.</p>",
      kc:{ q:"¿Por qué presionar PARO no es protección suficiente para alguien que trabaja dentro de una máquina?", opts:["Es suficiente si el operador se queda cerca","Los botones de paro son dispositivos de control — no eliminan la energía, y la máquina puede reiniciar","Es suficiente para trabajos cortos","PARO funciona siempre que se agregue una etiqueta"], a:1 } },

    { h:"2. Nueve Tipos de Energía", body:
      "<p>La electricidad es solo uno de ellos. Nuestro programa reconoce <b>nueve fuentes de energía</b> en este aserradero:</p>"+
      "<table class='mini'><tr><th>Energía</th><th>Dónde la ve</th></tr>"+
      "<tr><td><b>Eléctrica</b></td><td>Motores, compartimentos de MCC, soldadoras, capacitores</td></tr>"+
      "<tr><td><b>Neumática (aire)</b></td><td>Válvulas de aire, cilindros, compuertas, cepillos, campanas</td></tr>"+
      "<tr><td><b>Hidráulica</b> (alta/baja/almacenada)</td><td>Unidades HPU, cargadores de troncos, expulsores</td></tr>"+
      "<tr><td><b>Gravedad</b></td><td>Cubiertas de troncos, transportadores elevados, compuertas levantadas, material en tolvas</td></tr>"+
      "<tr><td><b>Vapor</b></td><td>Hornos de secado, líneas de la caldera y planta de vapor</td></tr>"+
      "<tr><td><b>Impulso (momentum)</b></td><td>Ejes de sierra y volantes que siguen girando después de cortar la energía</td></tr>"+
      "<tr><td><b>Energía almacenada</b></td><td>Resortes, acumuladores, capacitores cargados, presión atrapada</td></tr>"+
      "<tr><td><b>Infrarrojo</b></td><td>Sistemas de escáner y detección</td></tr>"+
      "<tr><td><b>Láseres</b></td><td>Láseres de alineación y escaneo</td></tr></table>"+
      "<p><b>Cortar la electricidad no hace que una máquina sea segura.</b> Una cubierta levantada todavía puede caer. Una línea presurizada todavía puede liberarse. Un eje todavía puede estar girando. Cada fuente de energía de la máquina debe aislarse, y toda energía almacenada debe liberarse o sujetarse, antes de que la máquina sea segura.</p>",
      kc:{ q:"El desconectador eléctrico está apagado y con candado. ¿Qué todavía puede lastimarlo?", opts:["Nada — la máquina es segura","Solo la electricidad estática","Energía almacenada: cargas levantadas, presión atrapada, piezas que siguen girando","Solo el calor"], a:2 } },

    { h:"3. El Candado y la Etiqueta", body:
      "<div style='text-align:center;margin:14px 0;'><div style='display:inline-block;vertical-align:top;text-align:center;margin:0 14px;'><svg width='120' height='150' viewBox='0 0 120 150'><path d='M35 62 V40 a25 25 0 0 1 50 0 V62' fill='none' stroke='#8a8f98' stroke-width='11'/><rect x='22' y='60' width='76' height='72' rx='8' fill='#C00000'/><rect x='30' y='82' width='60' height='30' rx='3' fill='#fff'/><text x='60' y='95' text-anchor='middle' font-family='Arial' font-size='9.5' font-weight='bold' fill='#1F4E79'>MIGUEL</text><text x='60' y='107' text-anchor='middle' font-family='Arial' font-size='9.5' font-weight='bold' fill='#1F4E79'>TORRES</text></svg><div style='font-size:.85em;color:#666;'>Su candado: nombre y apellido</div></div><div style='display:inline-block;vertical-align:top;text-align:center;margin:0 14px;'><svg width='104' height='150' viewBox='0 0 104 150'><rect x='12' y='8' width='80' height='134' rx='6' fill='#fff' stroke='#333' stroke-width='2'/><circle cx='52' cy='22' r='6' fill='none' stroke='#333' stroke-width='2'/><rect x='12' y='34' width='80' height='26' fill='#C00000'/><text x='52' y='52' text-anchor='middle' font-family='Arial' font-size='14' font-weight='bold' fill='#fff'>PELIGRO</text><text x='52' y='84' text-anchor='middle' font-family='Arial' font-size='11' font-weight='bold' fill='#111'>NO</text><text x='52' y='99' text-anchor='middle' font-family='Arial' font-size='11' font-weight='bold' fill='#111'>OPERAR</text><text x='52' y='124' text-anchor='middle' font-family='Arial' font-size='7.5' fill='#666'>Bloqueado por: (nombre)</text></svg><div style='font-size:.85em;color:#666;'>Etiqueta de NO OPERAR</div></div></div>"+
      "<p>Cada candado de WKO lleva el <b>nombre y apellido</b> de su dueño. Una persona, un candado, una llave. El nombre es la autoridad: solo esa persona puede quitar ese candado. Una etiqueta de <b>NO OPERAR</b> identifica el bloqueo y advierte a todos en el punto de control.</p>"+
      "<p><b>Las reglas absolutas — sin excepciones, sin importar quién lo pida:</b></p>"+
      "<ul><li><b>Nunca quite, abra, evada ni preste el candado o la etiqueta de otra persona.</b> Ni por un supervisor, ni para \"ayudar,\" ni porque se fue a casa.</li>"+
      "<li><b>Nunca intente arrancar, energizar ni operar</b> ninguna máquina que esté bloqueada o etiquetada.</li>"+
      "<li><b>Una etiqueta sola es una advertencia, no una restricción física.</b> Si un dispositivo físicamente no puede recibir un candado, se usa una etiqueta con protecciones adicionales — usted trata esa etiqueta con exactamente el mismo respeto que un candado.</li></ul>",
      kc:{ q:"Usted necesita una máquina que está bloqueada, y el candado pertenece a alguien que ya se fue a casa. ¿Qué hace?", opts:["Avisar a su supervisor — nunca tocar el candado","Cortar el candado si el área se ve despejada","Quitarlo porque el dueño se fue","Arrancar la máquina desde otro control"], a:0 } },

    { h:"4. Leer el Sistema: MCCs, Colores y Etiquetas de Circuito", body:
      "<p>La energía eléctrica de cada departamento pasa por los <b>Centros de Control de Motores (MCC)</b> — paneles de \"compartimentos\" (buckets) individuales, uno por circuito. Cada MCC tiene un <b>código de color</b>, cada compartimento tiene una <b>posición</b> (como 8C), y cada circuito tiene una <b>descripción en etiqueta</b> que nombra el equipo y su número.</p>"+
      "<div style='max-width:330px;margin:12px auto;border:1px solid #CCCCCC;border-radius:8px;overflow:hidden;'><div style='background:#f5d90a;color:#333;font-weight:bold;text-align:center;padding:7px;'>MCC-1 &middot; AMARILLO &mdash; Sótano del Stud Mill, pared norte</div><table style='width:100%;border-collapse:collapse;background:#fff;'><tr><td style='border:1px solid #CCCCCC;padding:7px 4px;text-align:center;font-size:.85em;'>8A</td><td style='border:1px solid #CCCCCC;padding:7px 4px;text-align:center;font-size:.85em;background:#eaf2fb;font-weight:bold;border:2px solid #2E75B6;'>8C</td><td style='border:1px solid #CCCCCC;padding:7px 4px;text-align:center;font-size:.85em;'>8E</td></tr><tr><td style='border:1px solid #CCCCCC;padding:7px 4px;text-align:center;font-size:.85em;'>9A</td><td style='border:1px solid #CCCCCC;padding:7px 4px;text-align:center;font-size:.85em;'>9C</td><td style='border:1px solid #CCCCCC;padding:7px 4px;text-align:center;font-size:.85em;color:#999;'>9E</td></tr></table></div>"+
      "<p>El procedimiento escrito de bloqueo de una máquina le dice al empleado autorizado exactamente qué compartimentos bloquear: MCC, posición, color y texto de la etiqueta — los cuatro deben coincidir antes de poner un candado.</p>"+
      "<div class='notice'><b>Los colores no se trasladan entre departamentos.</b> El color identifica un panel <i>dentro</i> de un departamento:</div>"+
      "<div style='margin:10px 0;'><div style='margin-bottom:6px;'><b>Stud Mill:</b> <span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#f5d90a;color:#333;'>MCC-1</span> <span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#f28c28;color:#fff;'>MCC-4</span> <span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#9acd32;color:#333;'>MCC-7</span> <span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#2E75B6;color:#fff;'>MCC-8</span></div><div><b>Planer Mill:</b> <span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#f5d90a;color:#333;'>MCC-1</span> <span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#2E75B6;color:#fff;'>MCC-2</span> <span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#7a4ba0;color:#fff;'>MCC-5</span> <span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#C00000;color:#fff;'>MCC-8</span></div></div>"+
      "<p>El MCC-8 es <b>azul</b> en el Stud Mill y <b>rojo</b> en el Planer Mill. Verifique el <b>número de MCC + color + descripción de la etiqueta</b> en el procedimiento de <i>su propio departamento</i> — nunca suponga que un color significa el mismo panel en otro lugar.</p>"+
      "<p><b>Desconectadores remotos:</b> algunos circuitos — no todos — también tienen un desconectador remoto montado cerca de la máquina, nombrado según su compartimento (el compartimento <b>8A</b> se empareja con el remoto <b>8Aa</b>, con el mismo color). Los remotos independientes alimentados desde el transformador son <b>grises</b>. Un candado en el remoto correcto aísla ese circuito igual que un candado en el compartimento.</p>",
      kc:{ q:"¿Un color de MCC significa el mismo panel en todos los departamentos?", opts:["Sí — los colores son iguales en toda la planta","Solo para paneles eléctricos","Los colores cambian cada mes","No — verifique número de MCC + color + descripción de etiqueta en el procedimiento de su propio departamento"], a:3 } },

    { h:"5. Cómo Se Ve un Bloqueo Real", body:
      "<p>Aquí hay una parte del procedimiento real de las <b>Cubiertas de Troncos (Log Decks)</b> del Stud Mill, tal como lo ven los empleados autorizados:</p>"+
      "<div style='border:1px solid #CCCCCC;border-radius:8px;margin:12px 0;overflow:hidden;background:#fff;'><div style='display:flex;justify-content:space-between;align-items:center;background:#1F4E79;color:#fff;padding:8px 12px;'><b>Log Decks — Procedimiento de Bloqueo (extracto)</b><span style='background:#C00000;border-radius:12px;padding:2px 10px;font-size:.82em;font-weight:bold;'>&#128274; Se requieren 15 candados/etiquetas</span></div><div style='background:#fff3cd;color:#7a5c00;padding:6px 12px;font-size:.85em;'><b>&#9888;&#65039; Siempre realice un paro de máquina antes de bloquear el desconectador</b></div><div style='display:flex;align-items:center;gap:8px;padding:6px 8px;border-top:1px solid #eee;'><div style='min-width:20px;height:20px;border-radius:50%;background:#1F4E79;color:#fff;font-size:.8em;font-weight:bold;display:flex;align-items:center;justify-content:center;'>1</div><span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#f5d90a;color:#333;white-space:nowrap;'>MCC-1 &middot; 8A o 8Aa &middot; AMARILLO</span><div style='font-size:.88em;'>Stud Block Roll Case &middot; 214.100 &mdash; Sótano del Stud Mill, pared norte (remoto 8Aa: al este de la pasarela del cuarto de computadoras)</div></div><div style='display:flex;align-items:center;gap:8px;padding:6px 8px;border-top:1px solid #eee;'><div style='min-width:20px;height:20px;border-radius:50%;background:#1F4E79;color:#fff;font-size:.8em;font-weight:bold;display:flex;align-items:center;justify-content:center;'>2</div><span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#9acd32;color:#333;white-space:nowrap;'>MCC-7 &middot; 3E &middot; VERDE LIMA</span><div style='font-size:.88em;'>HPU #6 &middot; 500.600 &mdash; Sótano del Stud Mill, pared sur</div></div><div style='display:flex;align-items:center;gap:8px;padding:6px 8px;border-top:1px solid #eee;'><div style='min-width:20px;height:20px;border-radius:50%;background:#1F4E79;color:#fff;font-size:.8em;font-weight:bold;display:flex;align-items:center;justify-content:center;'>3</div><span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#8a8f98;color:#fff;white-space:nowrap;'>REMOTO 15a &middot; GRIS</span><div style='font-size:.88em;'>Desconectador Remoto 15a &mdash; Al norte del Head Rig, en la pared</div></div><div style='display:flex;align-items:center;gap:8px;padding:6px 8px;border-top:1px solid #eee;'><div style='min-width:20px;height:20px;border-radius:50%;background:#1F4E79;color:#fff;font-size:.8em;font-weight:bold;display:flex;align-items:center;justify-content:center;'>4</div><span style='display:inline-block;padding:3px 10px;border-radius:4px;font-weight:bold;font-size:.85em;background:#2E75B6;color:#fff;white-space:nowrap;'>VÁLVULA HID. 3</span><div style='font-size:.88em;'>Válvula hidráulica de cuarto de vuelta &mdash; Lado oeste del Rotary Kicker, en la pasarela</div></div><div style='padding:7px 12px;background:#F2F2F2;font-size:.82em;color:#666;'>…continúa: 12 puntos de aislamiento más en MCC-1, MCC-4, MCC-7, MCC-8, válvulas hidráulicas y de aire. Verifique en el control indicado CADA dispositivo.</div></div>"+
      "<p>Note lo que eso le dice: un bloqueo \"sencillo\" de las cubiertas de troncos requiere <b>15 candados o etiquetas</b> en varios MCC, remotos y válvulas. Un solo candado casi nunca es el trabajo completo.</p>"+
      "<p><b>Su parte como empleado afectado:</b></p>"+
      "<ul><li>El empleado autorizado <b>le avisa antes</b> de poner los candados y <b>antes</b> de quitarlos y re-energizar la máquina. Tome el aviso en serio — aléjese.</li>"+
      "<li>Siempre se realiza <b>primero un paro de máquina</b>, y luego se bloquean los desconectadores. No toque los controles durante nada de esto.</li>"+
      "<li>Respete las barricadas y advertencias. Cuando un procedimiento dice \"avise al operador del montacargas, coloque una barricada,\" esa barricada es parte del bloqueo.</li></ul>",
      kc:{ q:"Antes de re-energizar una máquina bloqueada, usted debe esperar…", opts:["Que la máquina simplemente arranque","Una prueba a media velocidad","Que le avisen que los candados se van a quitar y la máquina va a arrancar","Nada — la re-energización es silenciosa"], a:2 } },

    { h:"6. Encontrar un Candado — o una Máquina Bloqueada Inesperadamente", body:
      "<p>Tarde o temprano encontrará un candado donde no lo esperaba, o necesitará un equipo que alguien bloqueó y dejó.</p>"+
      "<ul><li><b>El candado se queda puesto.</b> Solo la persona nombrada en él lo quita — ese es todo el sistema.</li>"+
      "<li><b>Avise a su supervisor.</b> Si de verdad no se puede encontrar al dueño y el equipo debe funcionar, hay un procedimiento estricto de emergencia — intentos de contacto, confirmar que la persona no está en la planta, el control directo de un supervisor, e informar al dueño antes de que regrese a trabajar. <b>Solo un supervisor puede dirigirlo. Nunca se hace a la ligera, y nunca lo hace usted.</b></li>"+
      "<li><b>Reporte los candados huérfanos</b> — un candado que parece olvidado todavía significa que alguien puede estar expuesto en alguna parte. Nunca suponga.</li></ul>",
      kc:{ q:"¿Quién puede dirigir la remoción de un candado cuando no se encuentra a su dueño?", opts:["Cualquier empleado autorizado","Un supervisor, siguiendo el procedimiento estricto de emergencia — nadie más","Quien necesite la máquina","El siguiente turno"], a:1 } },

    { h:"7. Bloqueo en Grupo y Cambios de Turno", body:
      "<p>Los trabajos grandes involucran cuadrillas. El <b>bloqueo en grupo</b> funciona así: la energía se aísla una vez, y cada trabajador coloca un <b>candado personal</b> en un dispositivo de grupo — un gancho múltiple (hasp) o una caja de candados. Un <b>empleado autorizado principal</b> dirige el trabajo, pone su candado primero, y lo quita <b>al final</b>.</p>"+
      "<p><b>El trabajo no está terminado hasta que se quita el último candado personal.</b> Si su candado está en ese gancho, nadie puede arrancar la máquina — y usted nunca quita su candado hasta que <i>su</i> trabajo esté terminado y usted esté fuera de peligro.</p>"+
      "<p><b>Cambios de turno:</b> la protección nunca se interrumpe. El candado del empleado entrante se pone <b>antes</b> de quitar el candado del empleado saliente, con ambos presentes. El equipo nunca queda sin protección en el intermedio.</p>",
      kc:{ q:"Durante un bloqueo en grupo, ¿cuándo se puede re-energizar la máquina?", opts:["Cuando termina el trabajo del empleado autorizado principal","Cuando termina el turno","Cuando lo pida el supervisor","Solo después de que se quite el último candado personal del dispositivo de grupo"], a:3 } },

    { h:"8. Cuándo el Bloqueo Aplica a USTED", body:
      "<p>El bloqueo no es solo para los mecánicos. El <b>servicio y mantenimiento</b> incluye destrabar, limpiar, despejar condiciones anormales, lubricar, ajustar y cambiar herramientas — las tareas diarias de operadores y cuadrillas de limpieza.</p>"+
      "<div class='notice'><b>\"Si sus pies dejan la pasarela, bloquee.\"</b> Esa es la regla permanente en el complejo del descortezador, y el razonamiento aplica en todas partes: si una tarea pone su cuerpo donde la máquina puede alcanzarlo, la máquina se bloquea primero.</div>"+
      "<ul><li>Un atasco que toma \"solo unos segundos\" despejar sigue siendo trabajo de servicio. Unos segundos es todo lo que una máquina necesita.</li>"+
      "<li>Si la tarea requiere quitar una guarda o pasar más allá de ella, o poner cualquier parte de su cuerpo en el punto de operación — <b>bloquee primero</b>.</li>"+
      "<li>Si usted no está capacitado y autorizado para bloquear ese equipo: <b>deténgase y busque a la persona autorizada</b>. Preguntar nunca es un error.</li></ul>",
      kc:{ q:"Una tabla está atascada y usted podría liberarla en cinco segundos pasando la mano más allá de la guarda. ¿Qué se requiere?", opts:["Nada, si el operador está mirando","Solo un paro de máquina","Bloqueo — pasar más allá de una guarda es trabajo de servicio, sin importar qué tan rápido sea","Una segunda persona vigilando"], a:2 } },

    { h:"9. Sus Responsabilidades", body:
      "<p>Como empleado afectado u otro empleado, usted está obligado a:</p>"+
      "<ul><li>Seguir toda instrucción de bloqueo/etiquetado y nunca intentar reiniciar ni operar equipo bloqueado o etiquetado.</li>"+
      "<li>Reportar inquietudes de inmediato: candados dañados, etiquetas faltantes, procedimientos poco claros, o cualquier cosa que se vea mal en un MCC o desconectador.</li>"+
      "<li>No tocar los gabinetes eléctricos. <b>Abrir paneles eléctricos y restablecer compartimentos de MCC está restringido a los electricistas de la compañía, al personal de mantenimiento calificado, y a otros empleados que la compañía haya capacitado y calificado para ese trabajo.</b> Si usted no ha sido designado para ello, no es su trabajo — repórtelo y manténgase alejado.</li></ul>"+
      "<p>Las violaciones del bloqueo/etiquetado ponen vidas en peligro y están sujetas a medidas disciplinarias conforme al Manual del Empleado.</p>"+
      "<p>Los procedimientos específicos de cada máquina de su departamento están publicados en el punto de uso — su supervisor le mostrará dónde. Ante cualquier duda con algo que tenga un candado: deténgase, pregunte, y nunca toque el candado.</p>",
      kc:{ q:"Un compartimento del MCC se disparó y la producción está esperando. ¿Quién lo restablece?", opts:["Un electricista de la compañía u otro empleado que la compañía haya capacitado y calificado para ese trabajo","El operador más cercano","Cualquiera que haya visto cómo se hace","La última persona que lo bloqueó"], a:0 } }
  ],
  quiz: [
    { q:"¿Por qué presionar PARO no es protección suficiente para el trabajo de servicio?", opts:["Es suficiente para tareas cortas","Es suficiente si se agrega una etiqueta","Los botones de paro son dispositivos de control — no eliminan la energía, y la máquina puede reiniciar","Es suficiente cuando el operador se queda en los controles"], a:2 },
    { q:"¿El candado de quién puede quitar usted?", opts:["Solo el suyo — nunca el de otra persona, por ninguna razón","Los candados de su cuadrilla","Cualquier candado, si un supervisor está mirando","Los candados que quedaron puestos de un día para otro"], a:0 },
    { q:"Aun con la energía eléctrica bloqueada, pueden quedar peligros por…", opts:["Nada — la electricidad es el único peligro","Solo los circuitos de iluminación","Solo la estática","Energía almacenada: cargas levantadas, presión atrapada y piezas que siguen girando"], a:3 },
    { q:"Los colores de los MCC entre departamentos…", opts:["Son idénticos en toda la planta","Identifican paneles dentro de un departamento — el mismo número de MCC puede ser de un color diferente en otro departamento","Siguen el orden del arcoíris","Solo aplican al Stud Mill"], a:1 },
    { q:"Un desconectador remoto como el 8Aa…", opts:["Existe en todas las máquinas","Reemplaza la necesidad de candados","Se empareja con su compartimento de MCC en algunas máquinas — no todas las máquinas tienen uno","Siempre es gris"], a:2 },
    { q:"Usted encuentra un candado en un equipo y su dueño se fue a casa. Usted debe…", opts:["Avisar a su supervisor — solo un supervisor puede dirigir el procedimiento de remoción de emergencia","Quitarlo, ya que el dueño no está en la planta","Esperar una hora y luego quitarlo","Arrancar la máquina desde otro control"], a:0 },
    { q:"Despejar un atasco que toma \"solo unos segundos\"…", opts:["Solo necesita un paro de máquina","Está bien si un compañero mira","Está exento del programa","Es trabajo de servicio — el bloqueo aplica antes de pasar más allá de una guarda"], a:3 },
    { q:"En un bloqueo en grupo, la máquina se puede re-energizar cuando…", opts:["Termina el empleado autorizado principal","Se quita el último candado personal del gancho o la caja de candados","Cambia el turno","La mayoría de la cuadrilla terminó"], a:1 },
    { q:"Una etiqueta de NO OPERAR sin candado…", opts:["Es una advertencia que usted debe tratar exactamente como un candado — nunca opere el dispositivo","Se puede ignorar después de 24 horas","Significa que la máquina probablemente está bien","Solo aplica a los electricistas"], a:0 },
    { q:"Antes de re-energizar una máquina bloqueada, los empleados afectados deben ser…", opts:["Enviados a casa","Puestos en los controles","Avisados de que los candados se van a quitar y la máquina va a arrancar","No se requiere nada"], a:2 }
  ],
  quizH:"Examen Final",
  quizIntro:"Responda las 10 preguntas. Necesita 8 correctas (80%) para aprobar. Tómese su tiempo — puede revisar el material y volver a tomar el examen si es necesario.",
  submitBtn:"Enviar Examen",
  answerAll:"Por favor responda todas las preguntas antes de enviar.",
  passH:"¡Felicidades — Aprobó!",
  passSub:"Certificado de Finalización",
  passModule:"Bloqueo y Etiquetado — Capacitación del Empleado " + MODULE_VERSION,
  scoreLabel:"Puntuación",
  dateLabel:"Fecha",
  codeLabel:"Su código de finalización",
  passInstr:"<b>Último paso — registre su finalización:</b> toque el botón de abajo y envíe el formulario de finalización. Escriba su nombre, seleccione <b>\"Lockout/Tagout / Bloqueo y Etiquetado\"</b> de la lista de módulos, e ingrese el código de finalización mostrado arriba. Su capacitación no queda registrada hasta que envíe el formulario.",
  recordBtn:"Registrar Mi Finalización",
  failH:"Todavía No — Siga Adelante",
  failMsg:"Obtuvo menos del 80%. Revise el material — especialmente el candado de quién puede quitar, lo que la energía almacenada todavía puede hacer, cómo funciona el sistema de colores de los MCC, y cuándo el bloqueo aplica a sus propias tareas — e intente de nuevo. No hay límite de intentos.",
  reviewBtn:"Revisar el Material",
  retakeBtn:"Volver a Tomar el Examen",
  yourScore:"Su puntuación"
}
};

var ANSWER_KEY = STR.en.quiz.map(function(q){ return q.a; });

/* ------------ State ------------ */
var state = { lang:null, screen:"lang", section:0, name:"", kcDone:{}, quizAnswers:{}, lastScore:null, code:null };

/* ------------ Helpers ------------ */
function T(){ return STR[state.lang]; }
function $(id){ return document.getElementById(id); }
function esc(s){ var d=document.createElement("div"); d.appendChild(document.createTextNode(s)); return d.innerHTML; }

function generateCode(){
  var chars="ABCDEFGHJKMNPQRSTUVWXYZ23456789", out="";
  for(var i=0;i<5;i++){ out+=chars.charAt(Math.floor(Math.random()*chars.length)); }
  return CODE_PREFIX+out;
}
function gradeQuiz(answers){
  var correct=0;
  for(var i=0;i<ANSWER_KEY.length;i++){ if(answers[i]===ANSWER_KEY[i]) correct++; }
  var pct=Math.round(correct/ANSWER_KEY.length*100);
  return { correct:correct, total:ANSWER_KEY.length, pct:pct, pass: pct>=PASS_PCT };
}

/* ------------ Rendering ------------ */
function setLang(l){
  state.lang=l;
  if(state.screen==="lang") state.screen="intro";
  $("langBar").className="langbar";
  $("btnEN").className = l==="en"?"active":"";
  $("btnES").className = l==="es"?"active":"";
  render();
}
function progress(){
  if(state.screen==="lang"){ $("progBar").style.width="0%"; return; }
  var total = T().sections.length + 2;
  var pos = state.screen==="intro"?0 : state.screen==="quiz"?total-1 : state.screen==="pass"||state.screen==="fail"?total : state.section+1;
  $("progBar").style.width = Math.round(pos/total*100)+"%";
}
function renderLang(){
  $("app").innerHTML =
    '<div class="card splash">'+
    '<div class="co">WKO INC.</div>'+
    '<div class="ti-en">Lockout/Tagout Training</div>'+
    '<div class="ti-es">Capacitación de Bloqueo y Etiquetado</div>'+
    '<div class="choose">Choose your language / Elija su idioma:</div>'+
    '<div class="langbtns">'+
    '<button id="langBtnEN">English</button>'+
    '<button id="langBtnES">Español</button>'+
    '</div></div>';
  $("langBtnEN").addEventListener("click", function(){ setLang("en"); });
  $("langBtnES").addEventListener("click", function(){ setLang("es"); });
}
function render(){
  progress();
  if(state.screen==="lang") renderLang();
  else if(state.screen==="intro") renderIntro();
  else if(state.screen==="section") renderSection();
  else if(state.screen==="quiz") renderQuiz();
  else if(state.screen==="pass") renderPass();
  else if(state.screen==="fail") renderFail();
}
function renderIntro(){
  var t=T();
  $("app").innerHTML =
    '<div class="card"><h1>'+t.introH+'</h1><p>'+t.introP1+'</p><p>'+t.introP2+'</p>'+
    '<h2>'+t.nameLabel+'</h2>'+
    '<input type="text" id="nameInput" placeholder="'+t.namePh+'" value="'+esc(state.name)+'" autocomplete="name">'+
    '<br><button class="btn" id="startBtn" disabled>'+t.startBtn+'</button>'+
    '<p style="color:var(--gray);font-size:.85em;margin-top:16px">'+t.basedOn+'</p></div>';
  var inp=$("nameInput"), btn=$("startBtn");
  function gate(){ state.name=inp.value.trim(); btn.disabled = state.name.length<2; }
  inp.addEventListener("input", gate); gate();
  btn.addEventListener("click", function(){ if(state.name.length>=2){ state.screen="section"; state.section=0; render(); window.scrollTo(0,0);} });
}
function renderSection(){
  var t=T(), s=t.sections[state.section];
  var html = '<div class="card"><div class="qnum">'+t.secLabel+' '+(state.section+1)+' '+t.ofLabel+' '+t.sections.length+'</div><h1>'+s.h+'</h1>'+s.body;
  var kcPassed = !!state.kcDone[state.section];
  if(s.kc){
    html += '<div class="kc"><div class="kct">✔ '+s.kc.q+'</div>';
    for(var i=0;i<s.kc.opts.length;i++){
      html += '<label class="opt" id="kcOpt'+i+'"><input type="radio" name="kc" value="'+i+'"'+(kcPassed?' disabled':'')+'>'+s.kc.opts[i]+'</label>';
    }
    html += '<div class="fb" id="kcFb"></div>';
    if(!kcPassed) html += '<button class="btn secondary" id="kcCheck">'+t.checkBtn+'</button>';
    html += '</div>';
  }
  html += '<br><button class="btn" id="contBtn"'+((s.kc&&!kcPassed)?' disabled':'')+'>'+t.continueBtn+'</button></div>';
  $("app").innerHTML = html;
  if(s.kc && !kcPassed){
    $("kcCheck").addEventListener("click", function(){
      var sel=document.querySelector('input[name="kc"]:checked');
      if(!sel) return;
      var v=parseInt(sel.value,10), fb=$("kcFb");
      if(v===s.kc.a){
        state.kcDone[state.section]=true;
        $("kcOpt"+v).className="opt correct";
        fb.className="fb ok"; fb.textContent=t.kcOk;
        $("contBtn").disabled=false; $("kcCheck").disabled=true;
      } else {
        $("kcOpt"+v).className="opt wrong";
        $("kcOpt"+s.kc.a).className="opt correct";
        fb.className="fb bad"; fb.textContent=t.kcBad;
        state.kcDone[state.section]=true;
        $("contBtn").disabled=false; $("kcCheck").disabled=true;
      }
    });
  }
  $("contBtn").addEventListener("click", function(){
    if(state.section < t.sections.length-1){ state.section++; } else { state.screen="quiz"; }
    render(); window.scrollTo(0,0);
  });
}
function renderQuiz(){
  var t=T();
  var html='<div class="card"><h1>'+t.quizH+'</h1><p>'+t.quizIntro+'</p>';
  for(var i=0;i<t.quiz.length;i++){
    var q=t.quiz[i];
    html+='<div class="quizq"><div class="qt">'+(i+1)+'. '+q.q+'</div>';
    for(var j=0;j<q.opts.length;j++){
      var checked = state.quizAnswers[i]===j ? ' checked' : '';
      html+='<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"'+checked+'>'+q.opts[j]+'</label>';
    }
    html+='</div>';
  }
  html+='<div class="fb bad" id="quizWarn" style="display:none">'+t.answerAll+'</div>';
  html+='<button class="btn" id="quizSubmit">'+t.submitBtn+'</button></div>';
  $("app").innerHTML=html;
  var radios=document.querySelectorAll('#app input[type=radio]');
  for(var r=0;r<radios.length;r++){
    radios[r].addEventListener("change", function(e){
      var name=e.target.name, idx=parseInt(name.substring(1),10);
      state.quizAnswers[idx]=parseInt(e.target.value,10);
    });
  }
  $("quizSubmit").addEventListener("click", function(){
    var answers=[];
    for(var i=0;i<t.quiz.length;i++){
      if(typeof state.quizAnswers[i]==="undefined"){ $("quizWarn").style.display="block"; return; }
      answers.push(state.quizAnswers[i]);
    }
    var res=gradeQuiz(answers);
    state.lastScore=res;
    if(res.pass){ state.code=generateCode(); state.screen="pass"; }
    else { state.screen="fail"; }
    render(); window.scrollTo(0,0);
  });
}
function fmtDate(){
  var d=new Date();
  var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var mes=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return state.lang==="es" ? d.getDate()+" "+mes[d.getMonth()]+" "+d.getFullYear() : m[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
}
function renderPass(){
  var t=T(), r=state.lastScore;
  $("app").innerHTML =
    '<div class="card"><p class="passmsg">'+t.passH+'</p></div>'+
    '<div class="cert" id="certBox">'+
      '<div>'+t.passSub+'</div>'+
      '<div class="big" id="certName">'+esc(state.name)+'</div>'+
      '<div>'+t.passModule+'</div>'+
      '<div style="margin:8px 0">'+t.scoreLabel+': <b>'+r.correct+'/'+r.total+' ('+r.pct+'%)</b> &nbsp;·&nbsp; '+t.dateLabel+': <b id="certDate">'+fmtDate()+'</b></div>'+
      '<div>'+t.codeLabel+':</div>'+
      '<div class="code" id="certCode">'+state.code+'</div>'+
    '</div>'+
    '<div class="card"><p>'+t.passInstr+'</p>'+
    '<a class="btn" id="recordLink" href="'+FORM_URL+'" target="_blank" rel="noopener">'+t.recordBtn+'</a></div>';
}
function renderFail(){
  var t=T(), r=state.lastScore;
  $("app").innerHTML =
    '<div class="card" id="failBox"><p class="failmsg">'+t.failH+'</p>'+
    '<p>'+t.yourScore+': <b>'+r.correct+'/'+r.total+' ('+r.pct+'%)</b></p>'+
    '<p>'+t.failMsg+'</p>'+
    '<button class="btn secondary" id="reviewBtn">'+t.reviewBtn+'</button> '+
    '<button class="btn" id="retakeBtn">'+t.retakeBtn+'</button></div>';
  $("reviewBtn").addEventListener("click", function(){ state.quizAnswers={}; state.screen="section"; state.section=0; render(); window.scrollTo(0,0); });
  $("retakeBtn").addEventListener("click", function(){ state.quizAnswers={}; state.screen="quiz"; render(); window.scrollTo(0,0); });
}

/* ------------ Test hooks ------------ */
window.APP = { STR:STR, state:state, gradeQuiz:gradeQuiz, generateCode:generateCode, ANSWER_KEY:ANSWER_KEY, FORM_URL:FORM_URL, PASS_PCT:PASS_PCT, MODULE_VERSION:MODULE_VERSION, CODE_PREFIX:CODE_PREFIX, setLang:setLang, render:render };
window.setLang = setLang;

render();
</script>
</body>
</html>
