<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WKO Inc. — Respiratory Protection SUPERVISOR Training</title>
<style>
  :root { --blue:#2E75B6; --dark:#1F4E79; --gray:#666; --light:#F2F2F2;
          --green:#2E8B57; --amber:#E8A317; --orange:#D2691E; --red:#B22222; --maroon:#701C1C; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:Arial,Helvetica,sans-serif; background:var(--light); color:#222; line-height:1.5; -webkit-text-size-adjust:100%; }
  .wrap { max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:#fff; box-shadow:0 0 24px rgba(0,0,0,.08); }
  header { background:var(--dark); color:#fff; padding:14px 20px; }
  header .co { font-weight:bold; font-size:15px; letter-spacing:.5px; }
  header .prog { font-size:12px; color:#cfe0f0; }
  .badge { display:inline-block; background:var(--amber); color:#2b1c00; font-weight:bold; font-size:11px; letter-spacing:1px; padding:2px 8px; border-radius:999px; margin-top:5px; }
  .bar { height:6px; background:#dce7f2; } .bar span { display:block; height:100%; background:var(--blue); width:0%; transition:width .3s; }
  main { flex:1; padding:24px 20px 32px; }
  h1 { color:var(--dark); font-size:24px; margin-bottom:12px; }
  p { margin-bottom:12px; font-size:16px; }
  ul, ol { margin:0 0 12px 22px; } li { margin-bottom:7px; font-size:16px; }
  .eyebrow { text-transform:uppercase; letter-spacing:1.5px; font-size:11px; color:var(--gray); font-weight:bold; margin-bottom:6px; }
  .card { background:var(--light); border-left:4px solid var(--blue); padding:12px 14px; margin:14px 0; border-radius:0 6px 6px 0; font-size:15px; }
  .card.warn { border-left-color:var(--red); }
  .card.do { border-left-color:var(--green); }
  .btn { display:block; width:100%; background:var(--blue); color:#fff; border:none; border-radius:8px; padding:15px; font-size:17px; font-weight:bold; font-family:inherit; cursor:pointer; margin-top:18px; }
  .btn:active { background:var(--dark); } .btn:disabled { background:#b9c8d6; cursor:default; }
  .btn.secondary { background:#fff; color:var(--blue); border:2px solid var(--blue); }
  a.btn { text-decoration:none; text-align:center; box-sizing:border-box; }
  input[type=text] { width:100%; padding:13px; font-size:17px; font-family:inherit; border:2px solid #c6d4e2; border-radius:8px; margin-top:6px; }
  input[type=text]:focus { outline:none; border-color:var(--blue); }
  label { font-weight:bold; font-size:14px; color:var(--dark); }
  .ladder { margin:16px 0; }
  .rung { display:flex; border-radius:8px; overflow:hidden; margin-bottom:8px; }
  .rung .lvl { flex:0 0 112px; color:#fff; font-weight:bold; padding:10px 8px; font-size:13px; text-align:center; display:flex; flex-direction:column; justify-content:center; }
  .rung .lvl small { font-weight:normal; font-size:11px; opacity:.9; }
  .rung .act { flex:1; background:var(--light); padding:10px 12px; font-size:14px; display:flex; align-items:center; }
  .opt { display:block; width:100%; text-align:left; background:#fff; border:2px solid #c6d4e2; border-radius:8px; padding:13px 14px; font-size:16px; font-family:inherit; margin-top:10px; cursor:pointer; }
  .opt.sel { border-color:var(--blue); background:#eaf2fa; }
  .opt.right { border-color:var(--green); background:#e8f5ee; }
  .opt.wrong { border-color:var(--red); background:#fbeaea; }
  .feedback { margin-top:12px; padding:12px 14px; border-radius:8px; font-size:15px; display:none; }
  .feedback.good { background:#e8f5ee; border-left:4px solid var(--green); display:block; }
  .feedback.bad { background:#fbeaea; border-left:4px solid var(--red); display:block; }
  .qnum { font-size:12px; color:var(--gray); font-weight:bold; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
  .cert { border:3px solid var(--dark); border-radius:10px; padding:22px; text-align:center; margin-top:16px; }
  .cert .big { font-size:22px; font-weight:bold; color:var(--dark); margin:8px 0; }
  .cert .code { font-size:26px; letter-spacing:3px; font-weight:bold; color:var(--blue); background:var(--light); border-radius:8px; padding:10px; margin:12px 0; }
  .score-pill { display:inline-block; background:var(--green); color:#fff; border-radius:999px; padding:6px 18px; font-weight:bold; font-size:18px; }
  .score-pill.fail { background:var(--red); }
  .steps { counter-reset:s; list-style:none; margin-left:0; }
  .steps li { counter-increment:s; position:relative; padding-left:34px; margin-bottom:10px; }
  .steps li:before { content:counter(s); position:absolute; left:0; top:1px; background:var(--blue); color:#fff; width:24px; height:24px; border-radius:50%; text-align:center; font-weight:bold; font-size:14px; line-height:24px; }
  table.mini { border-collapse:collapse; width:100%; margin:12px 0; font-size:14px; }
  table.mini th { background:var(--blue); color:#fff; padding:8px; text-align:left; }
  table.mini td { border:1px solid #d9e2ec; padding:8px; vertical-align:top; }
  table.mini tr:nth-child(even) td { background:var(--light); }
  footer { padding:12px 20px; font-size:11px; color:var(--gray); text-align:center; border-top:1px solid #e4e9ef; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="co">WKO INC.</div>
    <div class="prog">Emergency Action &amp; Fire Prevention — WAC 296-842</div>
    <div class="badge">SUPERVISOR MODULE</div>
  </header>
  <div class="bar"><span id="prog"></span></div>
  <main id="main"></main>
  <footer>WKO Inc. · Carson, WA · WAC 296-842 · Supervisor Module v1.0 (2026)</footer>
</div>

<script>
const FORM_URL = "https://forms.cloud.microsoft/r/YHYEJNbAMt";

let empName = "", slideIdx = 0, quizIdx = 0, quizScore = 0;

const slides = [
{ t:'content', eyebrow:'Section 1 of 9', title:'Why You Are Required to Take This', html:
  `<p>WAC 296-842-16005(1) requires training, based on their duties, for employees who <b>use respirators</b>, <b>supervise respirator users</b>, or <b>issue, repair, or adjust respirators</b>. You are in the second group — and often the third.</p>
  <p>This is not courtesy training. If a DOSH inspector asks who monitors respirator use on your shift, the answer is you, and your training record has to show it.</p>
  <p><b>Your three standing duties under the program:</b></p>
  <ul><li><b>Periodically monitor</b> your crew's respirator use to make sure they are using them properly (WAC 296-842-12005(2)(c)).</li>
  <li><b>Verify clearance before assignment</b> — nobody wears a tight-fitting respirator on your shift without a current medical evaluation and fit test.</li>
  <li><b>Escalate</b> — problems, symptoms, and gaps go to the Environmental Compliance and Safety Lead, not into your back pocket.</li></ul>` },

{ t:'content', eyebrow:'Section 2 of 9', title:'The Three Gates Before Anyone Wears One', html:
  `<p>Before you assign a task requiring a tight-fitting respirator, three things must already be true for that employee. All three. No exceptions, no "just this once."</p>
  <ol><li><b>Medical evaluation</b> — a licensed health care professional (the company's designated occupational-medicine provider) has cleared them. Confidential; you see the clearance, not the medical detail.</li>
  <li><b>Fit test</b> — the company's contracted fall-protection and rescue trainer has fit tested them on the <b>exact make, model, style, and size</b> they will wear. A fit test on a different facepiece is not a fit test for this one.</li>
  <li><b>Training</b> — employee module plus hands-on, current within 12 months.</li></ol>
  <p>If any gate is open, the answer is not "wear it carefully." The answer is: the job waits, or it gets reassigned to someone who is cleared, or engineering controls handle it. <b>You do not have authority to waive a gate</b>, and neither does the employee by volunteering.</p>` },

{ t:'check', q:'A cleared, fit-tested employee is out. Their replacement is trained but has never been fit tested. The job needs a half-face respirator today. You:',
  opts:['Let them use it — they are trained','Have them do a careful seal check and proceed','Do not assign the task; reassign it, delay it, or control the hazard another way, and tell the Safety Lead','Ask them to sign a waiver'], a:2,
  why:'Correct. Training alone does not close the fit-test gate. A respirator that has never been proven to seal on that face gives false confidence — the employee would have stayed out of the area otherwise. Reassign, delay, or control the hazard, and report the gap.' },

{ t:'content', eyebrow:'Section 3 of 9', title:'Facial Hair — The Rule You Will Actually Have to Enforce', html:
  `<p>Of everything in this program, this is the rule supervisors get pushback on. Know it cold.</p>
  <p><b>No facial hair may come between the facepiece and the face.</b> Not a short beard, not two days of stubble, not "it's fine, I pull the straps tight." Hair on the sealing surface breaks the seal and lets contaminated air bypass the filter entirely.</p>
  <p><b>Allowed:</b> mustache or small goatee entirely inside the sealing surface. <b>Not allowed:</b> beards, sideburns crossing the seal, multi-day stubble on the seal area.</p>
  <p><b>When you meet resistance</b>, do not make it a personality contest. There is a real solution: a <b>loose-fitting PAPR</b> uses a hood or helmet, requires no face seal, and works with a beard. Route the employee to the Safety Lead for a PAPR rather than arguing about shaving — you get compliance and they keep their beard.</p>
  <p>They must also be clean-shaven <b>at the fit test</b>. A fit test passed over stubble documents nothing.</p>` },

{ t:'check', q:'An employee arrives with three days of growth and is scheduled for respirator work. He says he will "just tighten it down." You:',
  opts:['Accept it — he is experienced','Let him work and mention it to him later','Do not let him wear the tight-fitting respirator; reassign the task and route him to the Safety Lead for a PAPR option','Have him hold his breath during the worst of it'], a:2,
  why:'Correct. Tightening straps does not create a seal through hair — it just adds pressure while air leaks. Reassign the task now and route him to the Safety Lead, where a loose-fitting PAPR solves the problem without the argument.' },

{ t:'content', eyebrow:'Section 4 of 9', title:'What "Monitoring Use" Actually Looks Like', html:
  `<p>WAC 296-842-12005(2)(c) makes supervisors responsible for periodically checking that respirators are being used properly. In practice, that is a handful of things you look for as you walk your area:</p>
  <ul><li><b>Is it on the face, correctly, the whole time they are exposed?</b> Not pushed up on the forehead, not hanging around the neck, not pulled down to talk.</li>
  <li><b>Is the seal area clean-shaven?</b></li>
  <li><b>Is it the right respirator</b> — the one selected for that hazard, with the right cartridge or filter?</li>
  <li><b>Are cartridges current</b> under the change schedule?</li>
  <li><b>Is it stored properly</b> between uses — bagged or in a container, not tossed in a toolbox or left on a machine?</li>
  <li><b>Are they removing it inside the work area?</b> They should leave the area first, every time.</li></ul>
  <p>When you see a problem, correct it on the spot and report the pattern. A single lapse is coaching. A recurring one is a program problem the Safety Lead needs to know about.</p>` },

{ t:'content', eyebrow:'Section 5 of 9', title:'Symptoms — Treat These as Stop-Work', html:
  `<p>Respirators put real strain on the heart and lungs. That is why medical evaluation exists, and it is why symptoms are never something to push through.</p>
  <p><b>If an employee reports or shows any of these while wearing a respirator — stop the work, get them out of the area, into clean air:</b></p>
  <ul><li>Shortness of breath beyond what the exertion explains</li>
  <li>Chest tightness or pain</li>
  <li>Dizziness or light-headedness</li>
  <li>Nausea</li>
  <li>Unusual fatigue while wearing it</li></ul>
  <p>Then notify the Safety Lead. A medical clearance can be re-evaluated when someone's health changes — that is a normal part of the program, not a mark against the employee. What is not acceptable is a supervisor who hears "I get dizzy in that thing" and says "you'll get used to it."</p>
  <p>Same response if they smell or taste the contaminant, if breathing gets noticeably harder, or if the respirator is damaged: <b>out of the area first</b>, troubleshoot in clean air.</p>` },

{ t:'check', q:'Mid-shift an employee tells you he feels light-headed every time he wears his half-face respirator. You:',
  opts:['Tell him it is normal and he will adjust','Suggest he loosen the straps a little','Get him out of the area to clean air, stop that work, and notify the Safety Lead so his medical clearance can be re-evaluated','Swap him to an N95'], a:2,
  why:'Correct. Light-headedness is one of the listed medical signs that may limit respirator use. It is a stop-work, not a toughen-up. Clean air first, then the Safety Lead — re-evaluation is a normal part of the program.' },

{ t:'content', eyebrow:'Section 6 of 9', title:'Voluntary Use — Know the Line', html:
  `<p>Employees will ask to wear respirators when none is required. Two very different answers depending on what they want:</p>
  <p><b>Voluntary N95 / dust mask — allowed, low bar.</b> The employee gets the WAC 296-842-11005 Table 2 advisory information, follows proper use and storage, and that is it. No medical evaluation, no fit test. You can say yes.</p>
  <p><b>Voluntary half-face or higher — not your call.</b> Because these strain breathing, the medical evaluation, cleaning and storage procedures, and training requirements <b>all still apply</b> even though use is voluntary. The Program Administrator authorizes it case by case. Route the request to the Safety Lead.</p>
  <div class="card warn"><b>The trap to avoid:</b> an employee brings in their own elastomeric half-face from home and wants to wear it "since it's mine and it's voluntary." That is exactly the situation requiring authorization and a medical evaluation. Politely stop it and route it.</div>
  <p>Also remember: use stops being voluntary the moment the company requires it, or a hazard above a PEL is present — then the full program applies.</p>` },

{ t:'content', eyebrow:'Section 7 of 9', title:'Wildfire Smoke — What Changes for You', html:
  `<p>Wildfire smoke is governed by chapter 296-820 WAC, and your obligations escalate with PM2.5. Know where the lines are, because the difference between tiers is the difference between "available on request" and "hand one to every person."</p>
  <ul><li><b>20.5 – 35.4 µg/m³ (AQI 72–100)</b> — N95s provided at no cost on request. Voluntary.</li>
  <li><b>35.5 – 250.4 (AQI 101–350)</b> — company <b>must provide</b> N95s to all exposed employees and encourage use; exposure controls implemented.</li>
  <li><b>250.5 – 500.3 (AQI 351–848)</b> — N95s <b>handed directly</b> to each exposed employee; access to clean air ensured.</li>
  <li><b>500.4 and above (AQI 849+)</b> — respirator use is <b>required</b>, full program applies: medical evaluation and fit testing. At 555+, P100 respirators required.</li></ul>
  <p>The practical supervisor version: as smoke worsens, your job moves from <i>making respirators available</i> to <i>putting one in every hand</i>, and eventually to <i>only cleared and fit-tested people work outside</i>. Employees exposed 15 minutes or less in 24 hours are exempt from the respirator requirements.</p>
  <p>The Safety Lead monitors PM2.5 and will tell you which tier you are in. Do not guess from how the sky looks.</p>` },

{ t:'check', q:'The Safety Lead reports PM2.5 at 300 µg/m³ for outdoor work. Your obligation is:',
  opts:['Mention N95s are in the supply room if anyone wants one','Hand an N95 directly to each exposed employee and encourage use','Require respirators and verify fit tests','Nothing changes until 500'], a:1,
  why:'Correct. At 250.5–500.3 µg/m³ the rule requires direct distribution to each exposed employee, not just availability. Required use with fit testing does not begin until 500.4.' },

{ t:'content', eyebrow:'Section 8 of 9', title:'IDLH — The Line Nobody Crosses', html:
  `<p><b>WKO Inc. does not keep SCBA on site and does not perform IDLH entry.</b> That is a deliberate program decision, and it puts a hard boundary around what your crew may do.</p>
  <p>IDLH means Immediately Dangerous to Life or Health — including oxygen-deficient confined spaces. <b>the local fire department (911) is our designated entry-rescue provider.</b></p>
  <p><b>If IDLH conditions turn up unexpectedly:</b></p>
  <ol><li>Everyone evacuates the area immediately.</li>
  <li>Call <b>911</b>, notify the Environmental Compliance and Safety Lead.</li>
  <li><b>Nobody enters. Nobody attempts rescue.</b> Not with an N95, not with a half-face, not "just to grab him."</li>
  <li>Meet the fire department and tell them what is in there and who.</li></ol>
  <div class="card warn"><b>This is the one you may have to enforce against instinct.</b> A would-be rescuer without an air supply becomes the second casualty — that is the most common way a confined-space incident kills more than one person. Your job in that moment is to physically keep people out and wait for Carson Fire.</div>` },

{ t:'content', eyebrow:'Section 9 of 9', title:'Records, Retraining, and Escalation', html:
  `<p><b>Retraining is required</b> when: it has been 12 months, an employee has not retained the knowledge or skills, or the worksite or respirator type changes enough to make previous training obsolete. If you watch someone fumble a seal check, that is a retraining trigger — report it.</p>
  <p><b>Records WKO Inc. must be able to produce:</b> medical evaluation records (employment + 30 years, confidential), fit test records (until the next fit test), training records (3 years minimum), and program evaluation documentation. Delivery through an outside provider like the company's contracted trainer does not transfer the recordkeeping duty — it stays with WKO.</p>
  <p><b>What comes to the Safety Lead, promptly:</b></p>
  <ul><li>Any employee reporting respirator-related symptoms</li>
  <li>Any facial hair situation needing a PAPR</li>
  <li>Any voluntary half-face or higher request</li>
  <li>Any respirator that fails, is damaged, or does not seal</li>
  <li>Any employee assigned respirator work who is not cleared, fit tested, and trained</li>
  <li>Any change in work conditions that could affect respirator selection</li></ul>
  <p>The written Respiratory Protection Program v2.2 is in the Safety Office. When you are unsure, the answer is always: stop the work and ask.</p>` }
];

const quiz = [
 { q:'WAC 296-842-16005(1) requires respirator training for employees who:',
   opts:['Only those who wear respirators','Wear respirators, supervise respirator users, or issue/repair/adjust respirators','Only maintenance employees','Only new hires'], a:1 },
 { q:'Before you assign a task requiring a tight-fitting respirator, the employee must have:',
   opts:['Training only','A fit test only','Medical evaluation, fit test, and training — all three current','A supervisor\\u2019s verbal approval'], a:2 },
 { q:'An employee has a three-day beard on the sealing surface. The correct action is:',
   opts:['Let him tighten the straps','Allow it for short tasks','Do not allow the tight-fitting respirator; reassign and route him to the Safety Lead for a PAPR','Have him shave at lunch and work until then'], a:2 },
 { q:'A fit test done on a different make and model of facepiece:',
   opts:['Counts — a fit test is a fit test','Counts for 30 days','Does not count — fit testing is specific to make, model, style, and size','Counts if the sizes are similar'], a:2 },
 { q:'An employee reports dizziness while wearing his respirator. You:',
   opts:['Tell him he will get used to it','Loosen the straps','Get him to clean air, stop the work, and notify the Safety Lead for medical re-evaluation','Send him home without pay'], a:2 },
 { q:'An employee wants to voluntarily wear his own elastomeric half-face respirator. You:',
   opts:['Approve it — voluntary use has no requirements','Approve it if it looks clean','Route it to the Safety Lead — medical evaluation, training, and storage procedures still apply and the Program Administrator must authorize it','Refuse and take the respirator'], a:2 },
 { q:'PM2.5 from wildfire smoke reaches 300 µg/m³ where your crew works outdoors. You must:',
   opts:['Make N95s available on request','Hand an N95 directly to each exposed employee and encourage use','Require respirators and verify fit tests','Send everyone home'], a:1 },
 { q:'A worker collapses inside an oxygen-deficient confined space. Your crew wants to pull him out. You:',
   opts:['Send in two people together','Send in one person wearing a P100','Keep everyone out, call 911, and wait for the local fire department (911) to perform the entry rescue','Enter yourself since you are trained'], a:2 },
 { q:'Which of these is a retraining trigger under the program?',
   opts:['Only the 12-month anniversary','An employee who cannot correctly perform a seal check','Only a change of employer','Only a new respirator brand'], a:1 },
 { q:'the company's contracted fall-protection and rescue trainer delivers the hands-on training and fit testing. The recordkeeping obligation:',
   opts:['Transfers to the company's contracted fall-protection and rescue trainer','Is shared and optional','Remains with WKO Inc.','Ends after one year'], a:2 }
];

const main = document.getElementById('main');
const progEl = document.getElementById('prog');
const totalSteps = slides.length + quiz.length + 2;
function setProg(n){ progEl.style.width = Math.min(100, Math.round(n/totalSteps*100)) + '%'; }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function showStart(){
  setProg(0);
  main.innerHTML = `
    <div class="eyebrow">WKO Inc. · Safety Department</div>
    <h1>Respiratory Protection — Supervisor Training</h1>
    <p>Required supervisor training under WAC 296-842-16005(1)(b) and the SDS Respiratory Protection Program v2.2. About 15 minutes.</p>
    <div class="card warn"><b>Complete the employee Respiratory Protection module first.</b> This module covers your additional duties as a supervisor — it does not replace the employee training, and both are required of you.</div>
    <div class="card">Pass the 10-question quiz with <b>80% or better</b> to finish. You'll get a completion code and a button to record it.</div>
    <label for="nm">Enter your full name to begin</label>
    <input type="text" id="nm" autocomplete="name" placeholder="First and last name">
    <button class="btn" id="startBtn" disabled>Start Supervisor Training</button>`;
  const nm=document.getElementById('nm'), b=document.getElementById('startBtn');
  nm.addEventListener('input', ()=>{ b.disabled = nm.value.trim().split(/\s+/).length < 2; });
  b.addEventListener('click', ()=>{ empName=nm.value.trim(); slideIdx=0; showSlide(); });
}

function showSlide(){
  if (slideIdx >= slides.length){ quizIdx=0; quizScore=0; showQuizIntro(); return; }
  setProg(1+slideIdx);
  const s = slides[slideIdx];
  if (s.t === 'content'){
    main.innerHTML = `<div class="eyebrow">${esc(s.eyebrow)}</div><h1>${esc(s.title)}</h1>${s.html}
      <button class="btn" id="nextBtn">Continue</button>`;
    document.getElementById('nextBtn').addEventListener('click', ()=>{ slideIdx++; showSlide(); window.scrollTo(0,0); });
  } else {
    main.innerHTML = `<div class="eyebrow">Knowledge Check</div><h1>Quick Question</h1><p><b>${esc(s.q)}</b></p>
      <div id="opts"></div><div class="feedback" id="fb"></div>
      <button class="btn" id="nextBtn" style="display:none">Continue</button>`;
    const optsEl=document.getElementById('opts');
    s.opts.forEach((o,i)=>{
      const b=document.createElement('button');
      b.className='opt'; b.textContent=o;
      b.addEventListener('click', ()=>{
        const fb=document.getElementById('fb');
        [...optsEl.children].forEach(c=>c.disabled=true);
        if (i===s.a){ b.classList.add('right'); fb.className='feedback good'; fb.textContent=s.why;
          document.getElementById('nextBtn').style.display='block'; }
        else { b.classList.add('wrong'); fb.className='feedback bad'; fb.textContent='Not quite — take another look and try again.';
          setTimeout(()=>{ [...optsEl.children].forEach(c=>{c.disabled=false;c.classList.remove('wrong');}); fb.className='feedback'; },1600); }
      });
      optsEl.appendChild(b);
    });
    document.getElementById('nextBtn').addEventListener('click', ()=>{ slideIdx++; showSlide(); window.scrollTo(0,0); });
  }
}

function showQuizIntro(){
  setProg(1+slides.length);
  main.innerHTML = `<div class="eyebrow">Final Quiz</div>
    <h1>Ready, ${esc(empName.split(' ')[0])}?</h1>
    <p>10 questions. You need <b>8 correct (80%)</b> to pass. If you don't pass, review the material and retake it.</p>
    <button class="btn" id="goBtn">Begin Quiz</button>
    <button class="btn secondary" id="revBtn">Review Material First</button>`;
  document.getElementById('goBtn').addEventListener('click', ()=>{ showQuizQ(); window.scrollTo(0,0); });
  document.getElementById('revBtn').addEventListener('click', ()=>{ slideIdx=0; showSlide(); window.scrollTo(0,0); });
}

function showQuizQ(){
  if (quizIdx >= quiz.length){ showResult(); return; }
  setProg(1+slides.length+quizIdx);
  const qq = quiz[quizIdx];
  main.innerHTML = `<div class="qnum">Question ${quizIdx+1} of ${quiz.length}</div>
    <h1 style="font-size:20px">${esc(qq.q)}</h1><div id="opts"></div>
    <button class="btn" id="subBtn" disabled>Submit Answer</button>`;
  const optsEl=document.getElementById('opts');
  let sel=-1;
  qq.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=o;
    b.addEventListener('click', ()=>{ sel=i; [...optsEl.children].forEach(c=>c.classList.remove('sel')); b.classList.add('sel');
      document.getElementById('subBtn').disabled=false; });
    optsEl.appendChild(b);
  });
  document.getElementById('subBtn').addEventListener('click', ()=>{
    if (sel===qq.a) quizScore++;
    quizIdx++; showQuizQ(); window.scrollTo(0,0);
  });
}

function completionCode(){
  const d=new Date();
  const ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  let h=0; const src=empName.toUpperCase()+ds+quizScore+'SUP';
  for (let i=0;i<src.length;i++){ h=((h<<5)-h+src.charCodeAt(i))|0; }
  return 'RP26S-' + Math.abs(h).toString(36).toUpperCase().slice(0,5).padStart(5,'0');
}

function showResult(){
  setProg(totalSteps);
  const pct = Math.round(quizScore/quiz.length*100);
  const passed = pct >= 80;
  const dateStr = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  if (passed){
    main.innerHTML = `<div class="eyebrow">Training Complete</div><h1>Congratulations!</h1>
      <p style="text-align:center"><span class="score-pill">Score: ${pct}%</span></p>
      <div class="cert">
        <div class="eyebrow">Certificate of Completion</div>
        <div class="big">${esc(empName)}</div>
        <p>has completed <b>Respiratory Protection SUPERVISOR Training</b><br>per WAC 296-842-16005</p>
        <p><b>${dateStr}</b> · Score: <b>${quizScore}/${quiz.length} (${pct}%)</b></p>
        <div class="code">${completionCode()}</div>
        <p style="font-size:13px;color:var(--gray)">WKO Inc. · Carson, WA</p>
      </div>
      <div class="card"><b>Final step — record your completion:</b> Tap the button below to open the SDS Training Completion form. Select the module <b>Respiratory Protection — Supervisor / Protección Respiratoria — Supervisor</b>, enter today's date, your score, and the completion code above, then submit. Screenshot this screen for your own records. Your training is not documented until the form is submitted.</div>
      <a class="btn" href="${FORM_URL}" target="_blank" rel="noopener">Record My Completion</a>`;
  } else {
    main.innerHTML = `<div class="eyebrow">Quiz Result</div><h1>Not Quite — Let's Try Again</h1>
      <p style="text-align:center"><span class="score-pill fail">Score: ${pct}%</span></p>
      <p>You need 80% to pass. Review the material and take the quiz again — your crew is counting on you knowing this cold.</p>
      <button class="btn" id="revBtn">Review Material</button>
      <button class="btn secondary" id="retryBtn">Retake Quiz Now</button>`;
    document.getElementById('revBtn').addEventListener('click', ()=>{ slideIdx=0; showSlide(); window.scrollTo(0,0); });
    document.getElementById('retryBtn').addEventListener('click', ()=>{ quizIdx=0; quizScore=0; showQuizQ(); window.scrollTo(0,0); });
  }
}

/* test hooks */
window.APP = { slides, quiz, FORM_URL, completionCode, showStart,
  get state(){ return { empName, slideIdx, quizIdx, quizScore }; },
  setName(n){ empName = n; }, setScore(s){ quizScore = s; },
  showResult, showSlide, showQuizQ, showQuizIntro };

showStart();
</script>
</body>
</html>
