  passH: "Congratulations — You Passed!",

  reviewBtn: "Review the Material", retakeBtn: "Retake the Quiz",
  passInstr: "<b>Last step — record your completion:</b> tap the button below and submit the completion form. Enter your name, select <b>\"Confined Space Awareness / Conciencia de Espacios Confinados\"</b> from the module list, and enter the completion code shown above. Your training is not on record until you submit the form.",
  passModule: "Confined Space Awareness Training v1.0",
  secLabel: "Section", ofLabel: "of",
  failDetail: "Review the material — especially the three criteria that make a space confined, the atmospheric hazards, the permit requirement, and above all the rule that WKO employees never enter a confined space to perform a rescue — and try again. There is no limit on attempts.",
  quizDetail: "Take your time — you can review the material and retake the quiz if needed.",
  sections: [
    {
      title: "Section 1: What Is a Confined Space?",
      content: `<p>A confined space is not just any tight spot. Under WAC 296-809, a space is a <strong>confined space</strong> only if it meets <strong>all three</strong> of the following criteria:</p>
      <ol>
        <li><strong>Large enough to bodily enter and perform work</strong> — you can get your whole body inside</li>
        <li><strong>Limited or restricted means of entry or exit</strong> — a condition that would hinder your ability to escape in an emergency</li>

      </ol>
      <div class="info">ℹ️ All three must be true. A crawlspace you can exit easily from several points may not qualify. A tank with one small top hatch does.</div>
      <h3>Confined Spaces at WKO Inc.</h3>
      <p>Confined spaces at our facility can include:</p>
      <ul>
        <li>Tanks and pressure vessels</li>
        <li>Boiler drums and steam plant equipment</li>

      <p>A confined space becomes a <strong>permit-required confined space</strong> when it has one or more of these characteristics:</p>
      <ul>

        rightMsg: "✓ Correct — all three criteria must be met. Big enough to bodily enter, limited or restricted means of entry or exit, and not primarily designed for human occupancy.",
        wrongMsg: "✗ Not quite — a confined space must meet all three criteria: large enough to bodily enter and perform work, limited or restricted means of entry or exit, and not primarily designed for human occupancy."

    },
    {
      title: "Section 2: Why Confined Spaces Kill",
      content: `<p>Confined spaces are dangerous because the hazards are usually <strong>invisible</strong>. You cannot see, smell, or taste most of what kills people in these spaces. By the time you feel symptoms, you may already be unable to save yourself.</p>
      <h3>Atmospheric Hazards — The Number One Killer</h3>
      <p><strong>Oxygen deficiency.</strong> Normal air is about 21% oxygen. Oxygen can be consumed by rust, decomposing wood or organic material, or displaced by another gas. Below 19.5% the atmosphere is oxygen deficient. Below 16% is immediately dangerous to life or health.</p>
      <p><strong>Flammable gases and vapors.</strong> A confined space can accumulate combustible gas to the point where any spark causes an explosion.</p>
      <p><strong>Toxic gases.</strong> Carbon monoxide and hydrogen sulfide are the common ones. Hydrogen sulfide smells like rotten eggs at low concentrations — but at dangerous concentrations it <em>deadens your sense of smell</em>. If the smell goes away, that is not good news.</p>
      <h3>Acceptable Atmospheric Levels</h3>
      <table style="width:100%;border-collapse:collapse;margin:10px 0;font-size:.9em">
      <tr><th style="text-align:left;padding:6px;border-bottom:2px solid #2E75B6">Test</th><th style="text-align:left;padding:6px;border-bottom:2px solid #2E75B6">Acceptable</th><th style="text-align:left;padding:6px;border-bottom:2px solid #2E75B6">IDLH</th></tr>
      <tr><td style="padding:6px;border-bottom:1px solid #ddd">Oxygen</td><td style="padding:6px;border-bottom:1px solid #ddd">19.5% – 23.5%</td><td style="padding:6px;border-bottom:1px solid #ddd">Below 16%</td></tr>
      <tr><td style="padding:6px;border-bottom:1px solid #ddd">Flammable (LEL)</td><td style="padding:6px;border-bottom:1px solid #ddd">Below 10% LFL</td><td style="padding:6px;border-bottom:1px solid #ddd">10% LFL or above</td></tr>
      <tr><td style="padding:6px;border-bottom:1px solid #ddd">Carbon Monoxide</td><td style="padding:6px;border-bottom:1px solid #ddd">Below 25 ppm</td><td style="padding:6px;border-bottom:1px solid #ddd">1,200 ppm</td></tr>
      <tr><td style="padding:6px;border-bottom:1px solid #ddd">Hydrogen Sulfide</td><td style="padding:6px;border-bottom:1px solid #ddd">Below 10 ppm</td><td style="padding:6px;border-bottom:1px solid #ddd">100 ppm</td></tr>
      </table>
      <h3>Engulfment</h3>
      <p>Material like sawdust, chips, bark, or grain behaves like quicksand. A person standing on top of bridged material in a bin or silo can break through and be buried in seconds. Engulfment kills by suffocation or by crushing.</p>
      <h3>Physical and Mechanical Hazards</h3>
      <ul>
        <li>Augers, agitators, and moving equipment inside the space</li>
        <li>Stored energy — electrical, hydraulic, pneumatic, steam</li>
        <li>Material entering through unblocked lines</li>
        <li>Heat, noise, poor lighting, slippery surfaces, falling objects</li>
      </ul>
      <div class="danger">🚨 Atmospheric hazards do not announce themselves. The air in a space that was safe yesterday — or an hour ago — may not be safe now.</div>`
    },
    {
      title: "Section 3: Never Enter Without a Permit",
      content: `<p>No employee may enter a permit-required confined space unless they have been trained, the entry has been authorized by a <strong>signed written permit</strong>, and every required safety measure is in place.</p>
      <div class="danger">🚨 <strong>Entry begins the moment any part of your body breaks the plane of the opening.</strong> Reaching in with your head and shoulders to grab something is an entry. There is no such thing as "just leaning in."</div>
      <h3>What the Permit Does</h3>
      <p>The Confined Space Entry Permit is signed by an authorized Entry Supervisor. It documents that:</p>
      <ul>
        <li>The hazards of that specific space have been evaluated</li>
        <li>All energy sources have been locked and tagged out</li>
        <li>Lines have been blanked, blinded, disconnected, or capped</li>
        <li>The atmosphere has been tested and is acceptable</li>
        <li>Ventilation, PPE, monitoring, and communication are in place</li>
        <li>Rescue services have been identified and are available</li>
      </ul>
      <p>The permit is posted at the work site outside the space, is good for one shift only, and is cancelled and returned to the Entry Supervisor when the work is done.</p>
      <h3>Before Anyone Goes In</h3>
      <p>These controls must be in place before entry:</p>
      <ul>
        <li><strong>Lockout/tagout</strong> — every energy source that could affect the space is locked out under the WKO Inc. LOTO Program</li>
        <li><strong>Isolation</strong> — connecting lines blanked, blinded, disconnected, or capped so nothing can flow in</li>
        <li><strong>Product removal</strong> — the space is drained, pumped out, or emptied</li>
        <li><strong>Ventilation</strong> — blowers push clean air <em>into</em> the space and run continuously for the whole entry</li>
        <li><strong>Atmospheric testing</strong> — tested in order: oxygen first, then flammable gases, then toxics</li>
      </ul>
      <div class="info">ℹ️ Ventilation is a method of hazard <em>control</em>, not hazard <em>elimination</em>. Continuous atmospheric monitoring is still required even when the blower is running.</div>
      <h3>The Black Packet</h3>
      <p>WKO Inc. assembles a <strong>Confined Space Black Packet</strong> for every entry. It is a grab-and-go kit containing the decision flow chart, entry permit, alternative methods documentation, gas detector logs, rescue pre-plan, and field logs. A complete packet is verified before anyone breaks the plane of the opening.</p>`,

        question: "You need to reach into a permit-required confined space to retrieve a dropped tool. Your head and shoulders will cross the opening. Is this an entry?",

        correct: 2,

        wrongMsg: "✗ No — entry is defined as any part of your body breaking the plane of the opening. Reaching in with your head and shoulders IS an entry and requires a signed permit."
      }
    },
    {
      title: "Section 4: The Three Roles",
      content: `<p>Every permit entry at WKO Inc. has three defined roles. Each requires specific training before anyone is assigned to it.</p>
      <h3>Entry Supervisor</h3>
      <p>The person responsible for determining whether acceptable entry conditions exist, authorizing entry by signing the permit, overseeing the entry, and terminating it. The Entry Supervisor:</p>
      <ul>
        <li>Signs the permit — nobody enters without that signature</li>
        <li>Verifies all tests were done and all equipment is in place</li>
        <li>Confirms rescue services are available and reachable</li>
        <li>Removes unauthorized people who try to enter</li>
        <li>Terminates the entry when the job is done or conditions change</li>
      </ul>
      <h3>Attendant</h3>
      <p>Stationed <strong>outside</strong> the space for the entire entry. The Attendant is the entrants' lifeline. They:</p>
      <ul>
        <li>Keep an accurate count of who is in the space at all times</li>
        <li>Continuously monitor the gas detector readings, recording them at least hourly</li>
        <li>Stay in communication with the entrants</li>
        <li>Order immediate evacuation if anything goes wrong</li>
        <li>Perform <strong>non-entry</strong> rescue and summon emergency services</li>
        <li>Keep unauthorized people away from the space</li>
      </ul>
      <div class="danger">🚨 <strong>The Attendant never leaves and never takes on other duties.</strong> Not to grab a tool, not to answer a radio call about something else. They monitor and protect the entrants — that is the entire job.</div>
      <h3>Entrant</h3>
      <p>The trained, authorized employee who enters the space. Entrants:</p>
      <ul>
        <li>Know the hazards, and the signs and symptoms of exposure</li>

    },
    {
      title: "Section 5: NEVER Attempt a Rescue",
      content: `<p>This is the single most important thing in this training.</p>
      <div class="danger">🚨 <strong>A large share of people who die in confined spaces are would-be rescuers.</strong> They saw a co-worker collapse, went in to help, and died in the same atmosphere. It happens within seconds and it happens to good people acting on instinct.</div>
      <h3>The WKO Inc. Rule</h3>
      <div class="warn">⚠️ <strong>WKO Inc. employees perform NON-ENTRY rescue only. No WKO Inc. employee enters a confined space to perform a rescue — under any circumstances.</strong></div>
      <p>We do not have self-contained breathing apparatus on site. We are a non-entry rescue operation. If the atmosphere dropped a trained entrant wearing monitored equipment, it will drop you in the same number of seconds — and now there are two casualties instead of one.</p>
      <h3>What Non-Entry Rescue Means</h3>
      <p>Entrants wear a full-body harness with a retrieval line attached to a mechanical retrieval device — a tripod and winch — or a fixed anchor outside the space. Mechanical retrieval equipment is required for vertical spaces deeper than five feet. The Attendant retrieves the entrant <strong>from outside</strong>, without ever entering.</p>
      <h3>Entry Rescue Is the Local Fire Department (911)</h3>
      <p>Any rescue that requires entering the space is performed by the <strong>local fire department (911)</strong>. They are our designated entry-rescue service. For any entry that could expose entrants to conditions immediately dangerous to life or health, the Entry Supervisor notifies the local fire department in advance and they stand by for the duration.</p>
      <h3>If You See Someone Down in a Confined Space</h3>
      <ol>
        <li><strong>DO NOT ENTER.</strong> Not for a second. Not to pull them to the opening.</li>
        <li><strong>Call 911</strong> and state clearly that it is a confined space rescue.</li>
        <li><strong>Alert the Attendant and Entry Supervisor</strong> immediately.</li>
        <li><strong>Keep others out.</strong> Stop anyone else from going in — that is now your job.</li>
        <li><strong>Assist with non-entry retrieval</strong> from outside if you are trained and asked to.</li>
      </ol>
      <div class="danger">🚨 The hardest thing you may ever do is stand at an opening and not go in. Do it anyway. Going in does not save them — it kills you both.</div>`,
      kc: {
        question: "You find a co-worker collapsed inside a confined space. What do you do?",
        options: ["Enter quickly and drag them out before the atmosphere affects you", "Hold your breath and pull them to the opening", "Do not enter — call 911, alert the attendant and supervisor, and keep others out", "Enter only if you can see the exit clearly"],
        correct: 2,
        rightMsg: "✓ Correct — never enter. Call 911, alert the attendant and entry supervisor, and stop anyone else from entering. WKO employees perform non-entry rescue only.",
        wrongMsg: "✗ NEVER enter. Would-be rescuers make up a large share of confined space deaths — the same atmosphere that dropped your co-worker will drop you in seconds. Call 911, alert the attendant and entry supervisor, and keep others out."
      }
    },
    {
      title: "Section 6: Alternative Methods and Contractors",
      content: `<h3>Alternative Methods Entry</h3>
      <p>In some cases a permit-required confined space can be entered <strong>without a full permit</strong>, using what the rule calls alternative methods. This is only allowed when monitoring and inspection data supports it AND one of these is true:</p>
      <ul>
        <li>All hazards — atmospheric and physical — have been eliminated from the space; <strong>or</strong></li>
        <li>All physical hazards have been eliminated and any hazardous atmosphere is controlled by continuous forced-air ventilation, with monitoring data proving the space stays safe. If the ventilation stops, entrants must be able to get out safely.</li>
      </ul>
      <div class="warn">⚠️ Alternative methods is <strong>not</strong> a shortcut or a way to skip paperwork. It is a documented process with its own form and a 15-point pre-entry checklist in the Black Packet. If you cannot answer YES to every checklist item, STOP and use the full entry permit.</div>
      <p>If entry is needed <em>before</em> hazards are eliminated — for example to collect monitoring data — that entry follows the full permit procedure.</p>
      <h3>Hot Work in a Confined Space</h3>
      <p>Any welding, cutting, burning, or heating inside a confined space requires a <strong>separate Hot Work Permit</strong>, approved by the Entry Supervisor and attached to the entry permit. See the Hot Work Safety training for the fire watch and permit requirements.</p>
      <h3>Contractors</h3>
      <p>When a contractor enters a confined space at an WKO Inc. facility, WKO Inc. as host employer must inform them that the workplace contains permit spaces, share the hazards we have identified, provide our program information, and coordinate entry operations when our people and theirs are working in or near the space. After the work, both sides debrief each other on any hazards encountered or created.</p>
      <div class="cross-ref">📋 <strong>Related training:</strong> Lockout/Tagout covers the energy isolation required before entry. Hot Work Safety covers welding and cutting permits. Respiratory Protection covers respirator use. Contractor Site Orientation covers the host-contractor coordination process.</div>`,

        question: "Under alternative methods entry, what happens if the ventilation system stops working?",

        rightMsg: "✓ Correct — one of the conditions for alternative methods entry is that entrants can exit safely if the ventilation stops. If that is not true, alternative methods cannot be used.",
        wrongMsg: "✗ Not quite — alternative methods entry is only permitted if entrants can exit the space safely in the event the ventilation system stops working. That is a required condition, not an optional one."
      }
    },
    {
      title: "Section 7: Your Responsibilities",
      content: `<p>Even if you never enter a confined space, you have responsibilities under this program.</p>
      <h3>Every Employee</h3>
      <ul>
        <li><strong>Recognize confined spaces</strong> and respect the "DANGER — PERMIT-REQUIRED CONFINED SPACE" signs</li>
        <li><strong>Never enter</strong> a permit-required confined space without training and a signed permit</li>
        <li><strong>Never attempt an entry rescue</strong> — call 911 and keep others out</li>
        <li><strong>Report</strong> unmarked spaces, damaged signs, open hatches, or unauthorized entries to your supervisor</li>
        <li><strong>Stay clear</strong> of an entry in progress unless you have a role in it</li>
        <li><strong>Speak up</strong> if you see someone about to enter without a permit</li>
      </ul>
      <h3>If You Are Assigned a Confined Space Role</h3>
      <p>You will receive role-specific training before you are assigned entrant, attendant, or entry supervisor duties — and again whenever your duties change, a new hazard appears, or your performance shows a gap. Annual training including a simulated non-entry rescue is provided by the company's contracted fall-protection and rescue trainer on our own equipment.</p>
      <h3>Emergency Numbers</h3>

    {
      title: "Sección 1: ¿Qué Es un Espacio Confinado?",
      content: `<p>Un espacio confinado no es simplemente cualquier lugar estrecho. Bajo WAC 296-809, un espacio es un <strong>espacio confinado</strong> solo si cumple <strong>los tres</strong> criterios siguientes:</p>
      <ol>
        <li><strong>Suficientemente grande para entrar con el cuerpo y realizar trabajo</strong> — puede meter todo su cuerpo adentro</li>

      <h3>Espacios Confinados en WKO Inc.</h3>

      <h3>Espacio Confinado que Requiere Permiso</h3>

    {
      title: "Sección 2: Por Qué Matan los Espacios Confinados",
      content: `<p>Los espacios confinados son peligrosos porque los peligros generalmente son <strong>invisibles</strong>. No puede ver, oler ni saborear la mayoría de lo que mata a las personas en estos espacios. Para cuando siente síntomas, es posible que ya no pueda salvarse.</p>
      <h3>Peligros Atmosféricos — El Asesino Número Uno</h3>
      <p><strong>Deficiencia de oxígeno.</strong> El aire normal tiene aproximadamente 21% de oxígeno. El oxígeno puede ser consumido por óxido, madera o material orgánico en descomposición, o desplazado por otro gas. Por debajo de 19.5% la atmósfera es deficiente en oxígeno. Por debajo de 16% es inmediatamente peligroso para la vida o la salud.</p>
      <p><strong>Gases y vapores inflamables.</strong> Un espacio confinado puede acumular gas combustible hasta el punto en que cualquier chispa cause una explosión.</p>
      <p><strong>Gases tóxicos.</strong> El monóxido de carbono y el sulfuro de hidrógeno son los comunes. El sulfuro de hidrógeno huele a huevos podridos en concentraciones bajas — pero en concentraciones peligrosas <em>anula su sentido del olfato</em>. Si el olor desaparece, eso no es una buena noticia.</p>
      <h3>Niveles Atmosféricos Aceptables</h3>
      <table style="width:100%;border-collapse:collapse;margin:10px 0;font-size:.9em">
      <tr><th style="text-align:left;padding:6px;border-bottom:2px solid #2E75B6">Prueba</th><th style="text-align:left;padding:6px;border-bottom:2px solid #2E75B6">Aceptable</th><th style="text-align:left;padding:6px;border-bottom:2px solid #2E75B6">IDLH</th></tr>
      <tr><td style="padding:6px;border-bottom:1px solid #ddd">Oxígeno</td><td style="padding:6px;border-bottom:1px solid #ddd">19.5% – 23.5%</td><td style="padding:6px;border-bottom:1px solid #ddd">Menos de 16%</td></tr>
      <tr><td style="padding:6px;border-bottom:1px solid #ddd">Inflamable (LEL)</td><td style="padding:6px;border-bottom:1px solid #ddd">Menos de 10% LFL</td><td style="padding:6px;border-bottom:1px solid #ddd">10% LFL o más</td></tr>
      <tr><td style="padding:6px;border-bottom:1px solid #ddd">Monóxido de Carbono</td><td style="padding:6px;border-bottom:1px solid #ddd">Menos de 25 ppm</td><td style="padding:6px;border-bottom:1px solid #ddd">1,200 ppm</td></tr>
      <tr><td style="padding:6px;border-bottom:1px solid #ddd">Sulfuro de Hidrógeno</td><td style="padding:6px;border-bottom:1px solid #ddd">Menos de 10 ppm</td><td style="padding:6px;border-bottom:1px solid #ddd">100 ppm</td></tr>
      </table>
      <h3>Sepultamiento</h3>
      <p>Material como aserrín, astillas, corteza o grano se comporta como arena movediza. Una persona parada sobre material apuntalado en una tolva o silo puede romper la superficie y ser sepultada en segundos. El sepultamiento mata por asfixia o por aplastamiento.</p>
      <h3>Peligros Físicos y Mecánicos</h3>
      <ul>
        <li>Barrenas, agitadores y equipo en movimiento dentro del espacio</li>
        <li>Energía almacenada — eléctrica, hidráulica, neumática, vapor</li>
        <li>Material que entra por líneas sin bloquear</li>
        <li>Calor, ruido, mala iluminación, superficies resbaladizas, objetos que caen</li>
      </ul>
      <div class="danger">🚨 Los peligros atmosféricos no se anuncian. El aire en un espacio que era seguro ayer — o hace una hora — puede no ser seguro ahora.</div>`

    {
      title: "Sección 3: Nunca Entre Sin un Permiso",
      content: `<p>Ningún empleado puede entrar en un espacio confinado que requiere permiso a menos que haya sido capacitado, la entrada haya sido autorizada por un <strong>permiso escrito firmado</strong>, y cada medida de seguridad requerida esté en su lugar.</p>

      <h3>Qué Hace el Permiso</h3>
      <p>El Permiso de Entrada a Espacio Confinado es firmado por un Supervisor de Entrada autorizado. Documenta que:</p>

      <h3>La Regla de WKO Inc.</h3>
      <div class="warn">⚠️ <strong>Los empleados de WKO Inc. realizan SOLAMENTE rescate sin entrada. Ningún empleado de WKO Inc. entra en un espacio confinado para realizar un rescate — bajo ninguna circunstancia.</strong></div>
      <p>No tenemos aparatos de respiración autónoma en el sitio. Somos una operación de rescate sin entrada. Si la atmósfera derribó a un entrante capacitado usando equipo monitoreado, lo derribará a usted en la misma cantidad de segundos — y ahora hay dos víctimas en lugar de una.</p>
      <h3>Qué Significa Rescate Sin Entrada</h3>

      content: `<h3>Entrada por Métodos Alternativos</h3>
      <p>En algunos casos un espacio confinado que requiere permiso puede ser ingresado <strong>sin un permiso completo</strong>, usando lo que la regla llama métodos alternativos. Esto solo se permite cuando los datos de monitoreo e inspección lo respaldan Y una de estas condiciones es verdadera:</p>

      <p>Cualquier soldadura, corte, quemado o calentamiento dentro de un espacio confinado requiere un <strong>Permiso de Trabajo en Caliente separado</strong>, aprobado por el Supervisor de Entrada y adjunto al permiso de entrada. Vea la capacitación de Seguridad en Trabajo en Caliente para los requisitos de vigilancia de incendios y permisos.</p>
      <h3>Contratistas</h3>
      <p>Cuando un contratista entra en un espacio confinado en una instalación de WKO Inc., WKO Inc. como empleador anfitrión debe informarles que el lugar de trabajo contiene espacios con permiso, compartir los peligros que hemos identificado, proporcionar información de nuestro programa, y coordinar las operaciones de entrada cuando nuestra gente y la de ellos trabajen en o cerca del espacio. Después del trabajo, ambas partes se informan mutuamente sobre cualquier peligro encontrado o creado.</p>
      <div class="cross-ref">📋 <strong>Capacitación relacionada:</strong> Bloqueo y Etiquetado cubre el aislamiento de energía requerido antes de la entrada. Seguridad en Trabajo en Caliente cubre los permisos de soldadura y corte. Protección Respiratoria cubre el uso de respiradores. La Orientación de Contratistas cubre el proceso de coordinación anfitrión-contratista.</div>`,
      kc: {
        question: "Bajo la entrada por métodos alternativos, ¿qué sucede si el sistema de ventilación deja de funcionar?",
        options: ["Los entrantes siguen trabajando hasta que se reinicie el soplador", "Los entrantes deben poder salir del espacio con seguridad", "El asistente entra a revisarlos", "El trabajo continúa si la última lectura fue aceptable"],
        correct: 1,
        rightMsg: "✓ Correcto — una de las condiciones para la entrada por métodos alternativos es que los entrantes puedan salir con seguridad si la ventilación se detiene. Si eso no es cierto, no se pueden usar métodos alternativos.",
        wrongMsg: "✗ No exactamente — la entrada por métodos alternativos solo se permite si los entrantes pueden salir del espacio con seguridad en caso de que el sistema de ventilación deje de funcionar. Esa es una condición requerida, no opcional."
      }
    },
    {
      title: "Sección 7: Sus Responsabilidades",
      content: `<p>Incluso si nunca entra en un espacio confinado, usted tiene responsabilidades bajo este programa.</p>
      <h3>Todo Empleado</h3>
      <ul>
        <li><strong>Reconocer los espacios confinados</strong> y respetar los letreros de "PELIGRO — ESPACIO CONFINADO QUE REQUIERE PERMISO"</li>
        <li><strong>Nunca entrar</strong> en un espacio confinado que requiere permiso sin capacitación y un permiso firmado</li>
        <li><strong>Nunca intentar un rescate con entrada</strong> — llame al 911 y mantenga a otros afuera</li>
        <li><strong>Reportar</strong> espacios sin marcar, letreros dañados, escotillas abiertas o entradas no autorizadas a su supervisor</li>
        <li><strong>Mantenerse alejado</strong> de una entrada en progreso a menos que tenga un rol en ella</li>
        <li><strong>Hablar</strong> si ve a alguien a punto de entrar sin un permiso</li>
      </ul>
      <h3>Si Se Le Asigna un Rol de Espacio Confinado</h3>
      <p>Recibirá capacitación específica antes de ser asignado a tareas de entrante, asistente o supervisor de entrada — y nuevamente cuando sus tareas cambien, aparezca un nuevo peligro, o su desempeño muestre una deficiencia. La capacitación anual que incluye un rescate simulado sin entrada es proporcionada por el capacitador contratado de protección contra caídas y rescate de la compañía con nuestro propio equipo.</p>
      <h3>Números de Emergencia</h3>
      <p><strong>Emergencia: 911</strong> — diga claramente que es un rescate de espacio confinado</p>
      <p><strong>Sala de Emergencias del hospital más cercano</strong> — vea la hoja de contactos de emergencia publicada</p>
      <div class="success-box">✅ El punto de toda esta capacitación es simple: sepa qué es un espacio confinado, manténgase afuera a menos que esté autorizado y con permiso, y nunca — bajo ninguna circunstancia — entre a buscar a alguien. Llame al 911 y mantenga a otros afuera.</div>`
    }
  ],
  quizQuestions: [
    { q: "¿Cuántos criterios debe cumplir un espacio para ser clasificado como 'espacio confinado'?",
      opts: ["Cualquiera de los tres", "Cualquiera dos de los tres", "Los tres — suficientemente grande para entrar, entrada/salida limitada, no diseñado para ocupación", "Depende del tamaño de la abertura"], ans: 2 },
    { q: "¿A qué nivel de oxígeno se considera una atmósfera deficiente en oxígeno?",
      opts: ["Menos de 23.5%", "Menos de 19.5%", "Menos de 16%", "Menos de 21%"], ans: 1 },
    { q: "¿Cuándo ocurre legalmente la 'entrada' a un espacio confinado?",
      opts: ["Cuando cualquier parte de su cuerpo cruza el plano de la abertura", "Solo cuando todo su cuerpo está adentro", "Después de estar adentro 60 segundos", "Cuando ambos pies dejan el suelo afuera"], ans: 0 },
    { q: "Un compañero colapsa dentro de un espacio confinado. ¿Cuál es la acción correcta?",
      opts: ["Entrar inmediatamente a sacarlo", "Contener la respiración y meter la mano por él", "Entrar solo con un compañero de respaldo", "No entrar — llamar al 911, alertar al asistente y supervisor, mantener a otros afuera"], ans: 3 },
    { q: "¿Quién realiza el rescate con entrada en WKO Inc.?",
      opts: ["Cualquier empleado capacitado de WKO Inc.", "El asistente", "El departamento de bomberos local (911)", "El supervisor de entrada"], ans: 2 }
  ]
}
};
// ============================================================
// ENGINE
// ============================================================
const ANSWER_KEY = [2,1,0,3,2];
const FORM_URL = "https://forms.cloud.microsoft/r/YHYEJNbAMt";
const MODULE_VERSION = "v1.0";
const CODE_PREFIX = "CS26-";
const PASS_PCT = 80;
let lang = 'en', userName = '', currentScreen = 'splash', sectionIdx = 0, completionCode = null;
let quizIdx = 0, quizScore = 0, quizAnswers = [], quizLocked = false;

function L() { return LANG[lang]; }
function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === (l==='en'?'English':'Español')));
  render();
}
function genCode() {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let r = ''; for (let i=0;i<5;i++) r += c[Math.floor(Math.random()*c.length)];
  return CODE_PREFIX + r;
}
function render() {
  const l = L();
  document.getElementById('headerTitle').textContent = l.headerTitle;
  document.getElementById('headerSub').textContent = l.headerSub;
  document.getElementById('progBanner').textContent = l.progBanner;
  document.title = l.headerTitle + ' — WKO Inc.';
  const c = document.getElementById('appContainer');
  if (currentScreen === 'splash') renderSplash(c, l);
  else if (currentScreen === 'section') renderSection(c, l);
  else if (currentScreen === 'quiz') renderQuiz(c, l);
  else if (currentScreen === 'results') renderResults(c, l);
}
function renderSplash(c, l) {
  c.innerHTML = `<div class="card active">
    <div class="splash-title">${l.splashTitle}</div>
    <p>${l.splashText}</p>
    <div class="info" style="margin:12px 0">${l.splashNote}</div>
    <p style="margin-top:14px"><strong>${l.enterName}</strong></p>
    <input type="text" id="nameInput" placeholder="${l.namePlaceholder}" style="margin:8px 0">
    <div id="nameErr" class="hidden" style="color:#dc3545;font-size:.9em">${l.nameError}</div>
    <div><button class="btn btn-primary" onclick="startTraining()">${l.beginBtn}</button></div>
  </div>`;
  const inp = document.getElementById('nameInput');
  if (inp) { inp.value = userName; inp.addEventListener('keydown', e => { if (e.key === 'Enter') startTraining(); }); }
}
function startTraining() {
  const v = document.getElementById('nameInput').value.trim();
  if (!v || v.split(/\s+/).length < 2) { document.getElementById('nameErr').classList.remove('hidden'); return; }
  userName = v; currentScreen = 'section'; sectionIdx = 0; render();
}
function renderSection(c, l) {
  const sec = l.sections[sectionIdx];
  const totalSteps = l.sections.length + 1;
  const pct = Math.round((sectionIdx / totalSteps) * 100);
  let html = `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
  html += `<div class="card active"><div style="color:#666;font-size:.85em;margin-bottom:6px">${l.secLabel} ${sectionIdx+1} ${l.ofLabel} ${l.sections.length}</div><h2>${sec.title}</h2>${sec.content}`;
  if (sec.kc) {
    html += `<div style="margin-top:16px;padding-top:12px;border-top:2px solid #e0e0e0">
      <h3 style="color:#1F4E79">✓ ${lang==='en'?'Knowledge Check':'Verificación de Conocimiento'}</h3>
      <p style="margin:8px 0"><strong>${sec.kc.question}</strong></p>`;
    sec.kc.options.forEach((o, i) => {
      html += `<button class="quiz-option" id="kc-opt-${i}" onclick="selectKC(${i})">${o}</button>`;
    });
    html += `<div id="kcFeedback"></div>
      <div id="kcBtnRow" class="hidden"><button class="btn btn-primary" onclick="kcContinue()">${l.continueBtn}</button></div>
    </div>`;
  }
  html += `<div class="nav-row">`;
  if (sectionIdx > 0) html += `<button class="btn btn-secondary" onclick="prevSection()">${l.prevBtn}</button>`;
  else html += `<span></span>`;
  if (!sec.kc) {
    if (sectionIdx < l.sections.length - 1) html += `<button class="btn btn-primary" onclick="nextSection()">${l.nextBtn}</button>`;
    else html += `<button class="btn btn-success" onclick="goQuiz()">${l.startQuiz}</button>`;
  }
  html += `</div></div>`;
  c.innerHTML = html;
  window.scrollTo(0, 0);
}
let kcAnswered = false;
function selectKC(i) {
  if (kcAnswered) return;
  kcAnswered = true;
  const sec = L().sections[sectionIdx];
  const correct = sec.kc.correct;
  document.getElementById(`kc-opt-${i}`).classList.add(i===correct?'correct':'incorrect');
  if (i !== correct) document.getElementById(`kc-opt-${correct}`).classList.add('correct');
  document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
  const fb = document.getElementById('kcFeedback');
  fb.innerHTML = `<div class="kc-feedback ${i===correct?'kc-correct':'kc-incorrect'}">${i===correct?sec.kc.rightMsg:sec.kc.wrongMsg}</div>`;
  document.getElementById('kcBtnRow').classList.remove('hidden');
}
function kcContinue() {
  kcAnswered = false;
  if (sectionIdx < L().sections.length - 1) nextSection();
  else goQuiz();
}
function prevSection() { if (sectionIdx > 0) { sectionIdx--; kcAnswered = false; render(); } }
function nextSection() { sectionIdx++; kcAnswered = false; render(); }
function goQuiz() { currentScreen = 'quiz'; quizIdx = 0; quizScore = 0; quizAnswers = []; quizLocked = false; completionCode = null; render(); }
function renderQuiz(c, l) {
  const qs = l.quizQuestions;
  const q = qs[quizIdx];
  const totalSteps = l.sections.length + 1;
  const prog = Math.round(((l.sections.length + quizIdx/qs.length) / totalSteps) * 100);
  let html = `<div class="card active"><h2>${l.quizTitle}</h2>`;
  if (quizIdx === 0) html += `<p style="font-size:.9em;color:#444;margin-bottom:8px">${l.quizIntro} ${l.quizDetail||''}</p>`;
  html += `
    <div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
    <p style="font-size:.9em;color:#666;margin-bottom:4px">${l.questionOf.replace('{n}',quizIdx+1).replace('{t}',qs.length)}</p>
    <p style="margin:12px 0"><strong>${q.q}</strong></p>`;
  q.opts.forEach((o, i) => {
    html += `<button class="quiz-option" id="q-opt-${i}" onclick="selectQuizOpt(${i})">${o}</button>`;
  });
  html += `<div id="quizBtnRow"><button class="btn btn-primary" id="quizSubmitBtn" onclick="submitQuizAnswer()" disabled>${l.submitAnswer}</button></div></div>`;
  c.innerHTML = html;
  window.scrollTo(0, 0);
}
let selectedQuizOpt = -1;
function selectQuizOpt(i) {
  if (quizLocked) return;
  selectedQuizOpt = i;
  document.querySelectorAll('.quiz-option').forEach((b, j) => b.classList.toggle('selected', j===i));
  document.getElementById('quizSubmitBtn').disabled = false;
}
function submitQuizAnswer() {
  if (quizLocked || selectedQuizOpt < 0) return;
  quizLocked = true;
  const correct = ANSWER_KEY[quizIdx];
  quizAnswers.push(selectedQuizOpt);
  if (selectedQuizOpt === correct) quizScore++;
  document.getElementById(`q-opt-${selectedQuizOpt}`).classList.add(selectedQuizOpt===correct?'correct':'incorrect');
  if (selectedQuizOpt !== correct) document.getElementById(`q-opt-${correct}`).classList.add('correct');
  document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
  const l = L();
  const isLast = quizIdx >= l.quizQuestions.length - 1;
  document.getElementById('quizBtnRow').innerHTML = isLast
    ? `<button class="btn btn-success" onclick="showResults()">${l.seeResults}</button>`
    : `<button class="btn btn-primary" onclick="nextQuizQ()">${l.nextQuestion}</button>`;
}
function nextQuizQ() { quizIdx++; quizLocked = false; selectedQuizOpt = -1; render(); }
function showResults() { currentScreen = 'results'; render(); }
function renderResults(c, l) {
  const needed = Math.ceil(l.quizQuestions.length * PASS_PCT / 100);
  const passed = quizScore >= needed;
  const totalQ = l.quizQuestions.length;
  const pct = Math.round(quizScore / totalQ * 100);
  const today = new Date().toLocaleDateString(lang==='es'?'es-US':'en-US', {year:'numeric',month:'long',day:'numeric'});
  let html = '';
  if (passed) {
    if (!completionCode) completionCode = genCode();
    html += '<div class="card active"><p style="font-size:1.15em;font-weight:bold;color:#28a745">'+l.passH+'</p></div>';
    html += '<div class="cert">';
    html += '<div style="font-size:.95em;color:#666">'+l.passSub+'</div>';
    html += '<div style="font-size:1.5em;font-weight:bold;color:#1F4E79;margin:10px 0">'+userName+'</div>';
    html += '<div>'+l.passModule+'</div>';
    html += '<div style="margin:8px 0">'+l.scoreLabel+': <b>'+quizScore+'/'+totalQ+' ('+pct+'%)</b> &middot; '+l.dateLabel+': <b>'+today+'</b></div>';
    html += '<div style="margin-top:10px">'+l.codeLabel+':</div>';
    html += '<div class="code">'+completionCode+'</div>';
    html += '</div>';
    html += '<div class="card active" style="margin-top:12px"><p>'+l.passInstr+'</p>';
    html += '<div style="text-align:center;margin:12px 0"><a href="'+FORM_URL+'" target="_blank" class="btn btn-success" style="text-decoration:none;color:#fff">'+l.recordBtn+'</a></div>';
    html += '</div>';
  } else {
    html += '<div class="card active">';
    html += '<p style="font-size:1.15em;font-weight:bold;color:#dc3545">'+l.failH+'</p>';
    html += '<p style="margin:8px 0">'+l.yourScore+': <b>'+quizScore+'/'+totalQ+' ('+pct+'%)</b></p>';
    html += '<p style="margin:8px 0;font-size:.95em">'+(l.failDetail||'')+'</p>';
    html += '<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">';
    html += '<button class="btn btn-secondary" onclick="retryFromSections()">'+l.reviewBtn+'</button>';
    html += '<button class="btn btn-primary" onclick="retakeQuiz()">'+l.retakeBtn+'</button>';
    html += '</div></div>';
  }
  c.innerHTML = html;
  window.scrollTo(0, 0);
}
function retryFromSections() { currentScreen = 'section'; sectionIdx = 0; render(); }
function retakeQuiz() { currentScreen = 'quiz'; quizIdx = 0; quizScore = 0; quizAnswers = []; quizLocked = false; selectedQuizOpt = -1; render(); }
render();
</script>

</html>
