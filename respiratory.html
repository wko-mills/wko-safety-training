var STR = {
en: {
  basedOn: "Based on the WKO Inc. Respiratory Protection Program (chapter 296-842 WAC). Questions? Contact the Safety Manager.",
  introH: "Welcome — Respiratory Protection at WKO Inc.",
  introP1: "This training covers the knowledge you need to use a respirator safely at WKO Inc. It takes about 20 minutes.",
  introP2: "</p><div class='notice'><b>Important — this training alone does not clear you to wear a respirator.</b> Before you may use a tight-fitting respirator on the job you must also have: a <b>medical evaluation</b> (the company's designated occupational-medicine provider) and a <b>fit test</b> (the company's contracted fit-testing provider). Passing this module covers the knowledge requirement only.</div><p>Required for anyone who uses a respirator, supervises respirator users, or issues, repairs, or adjusts respirators. Retraining is required within 12 months.",
  nameLabel: "Enter your full name to begin:",
  namePh: "First and last name",
  startBtn: "Start Training",
  continueBtn: "Continue",
  checkBtn: "Check Answer",
  kcOk: "Correct — well done.",
  kcBad: "Not quite — the correct answer is highlighted. Review it, then continue.",
  secLabel: "Section",
  ofLabel: "of",
  sections: [
    { h:"1. Why a Respirator — and Why It Is Not First", body:
      "<p>WKO Inc. controls airborne hazards using the <b>hierarchy of controls</b>: eliminate the hazard, substitute something safer, engineer it out with ventilation or enclosure, control it administratively — and only then, respirators.</p>"+
      "<p>A respirator does not remove the hazard. It filters the air you breathe, and only while it is worn correctly, sealed properly, and fitted with the right cartridge. That makes it the <b>last line of defense</b>, and it makes how you use it critically important.</p>"+
      "<p><b>Respiratory hazards at WKO Inc. include:</b></p>"+
      "<table class='mini'><tr><th>Hazard</th><th>Where</th></tr>"+
      "<tr><td><b>Wood dust</b> — softwood and hardwood</td><td>Sawmill and other production areas, clean-up work</td></tr>"+
      "<tr><td><b>Welding fumes</b> — metal fumes from hot work</td><td>Maintenance shops and field repairs</td></tr>"+
      "<tr><td><b>Chemical vapors</b> — solvents, paints, coatings</td><td>Maintenance, shops</td></tr>"+
      "<tr><td><b>Boiler chemicals</b></td><td>Steam plant, during handling</td></tr>"+
      "<tr><td><b>Wildfire smoke</b> — PM2.5</td><td>All outdoor work, fire season</td></tr>"+
      "<tr><td><b>Oxygen-deficient air</b></td><td>Confined spaces</td></tr></table>",
      kc:{ q:"Why is a respirator considered the last line of defense?", opts:["Because it is the most expensive control","Because it does not remove the hazard — it only filters the air you breathe","Because it is optional","Because supervisors say so"], a:1 } },

    { h:"2. Three Things Before You Wear One", body:
      "<div class='danger'><b>You may not wear a tight-fitting respirator at work until all three are complete:</b>"+
      "<ol><li><b>Medical evaluation</b> — a licensed health care professional confirms you can safely wear one. Breathing through a respirator adds strain on your heart and lungs. Done through the company's designated occupational-medicine provider, at no cost to you, confidentially.</li>"+
      "<li><b>Fit test</b> — proves that the exact make, model, style, and size seals on <i>your</i> face. Done by the company's contracted fit-testing provider, before first use and at least annually.</li>"+
      "<li><b>Training</b> — this module plus the hands-on session.</li></ol></div>"+
      "<p>These are not paperwork. A respirator that does not seal gives you the false confidence of protection while you breathe contaminated air — which is more dangerous than wearing nothing, because you would have stayed out of the area otherwise.</p>"+
      "<p><b>Fit testing must be repeated</b> whenever you change to a different facepiece make, model, style, or size, and whenever your face changes — significant weight change, dental work, facial scarring, or surgery.</p>",
      kc:{ q:"You have completed this training but have not been fit tested. Can you wear a half-face respirator on the job?", opts:["Yes — training is enough","Yes, if a co-worker says it fits","No — medical evaluation and fit testing must also be complete","Only on weekends"], a:2 } },

    { h:"3. Facial Hair and the Seal", body:
      "<div class='danger'><b>No facial hair may come between the facepiece and your face. None.</b></div>"+
      "<p>A tight-fitting respirator works by sealing against skin. Even a day or two of stubble along the sealing surface breaks that seal and lets contaminated air leak in around the edges. This is not a grooming preference — it is why the respirator either works or does not.</p>"+
      "<p><b>What is allowed:</b> a mustache or a small goatee that stays entirely <i>inside</i> the sealing surface is fine. Beards, long sideburns crossing the seal, and multi-day stubble on the seal area are not.</p>"+
      "<p><b>If you cannot or choose not to shave</b>, tell your supervisor or the Safety Manager. A <b>loose-fitting powered air-purifying respirator (PAPR)</b> uses a hood or helmet instead of a face seal and does not require a shaved seal area. There is a solution — but the solution is never to wear a tight-fitting respirator over a beard.</p>"+
      "<p>You must also be clean-shaven at your <b>fit test</b>. A fit test passed over stubble proves nothing.</p>",
      kc:{ q:"You have a three-day beard and need to do a job requiring a half-face respirator. What is correct?", opts:["Pull the straps tighter","Wear it anyway — a short beard is fine","Do not wear it; talk to your supervisor about a PAPR or shave the seal area","Hold your breath during the dusty parts"], a:2 } },

    { h:"4. Knowing Your Respirator and Its Limits", body:
      "<p><b>Air-purifying respirators (APRs)</b> — including N95s, half-face, and full-face — filter contaminants out of the air around you. They <b>cannot make oxygen</b>. Never use an air-purifying respirator in an oxygen-deficient atmosphere or a confined space with an unknown atmosphere.</p>"+
      "<p><b>Assigned Protection Factor (APF)</b> tells you how much protection a respirator gives when used correctly in a working program:</p>"+
      "<table class='mini'><tr><th>Respirator</th><th>APF</th><th>Means</th></tr>"+
      "<tr><td>Filtering facepiece (N95, P100 disposable)</td><td>10</td><td>Up to 10× the exposure limit</td></tr>"+
      "<tr><td>Half-facepiece APR</td><td>10</td><td>Up to 10× the exposure limit</td></tr>"+
      "<tr><td>Full-facepiece APR</td><td>50</td><td>Up to 50×; also protects the eyes</td></tr>"+
      "<tr><td>PAPR — loose-fitting hood or helmet</td><td>25</td><td>No face seal required</td></tr>"+
      "<tr><td>PAPR — full facepiece</td><td>1,000</td><td>Highest APR protection</td></tr></table>"+
      "<p><b>Filters and cartridges are not interchangeable.</b> Particulate filters (N, R, P series) catch dust and mists — they do nothing against gases or vapors. Chemical cartridges catch specific gases and vapors — they do nothing against dust unless combined with a particulate filter. Use only what the Safety Manager selected for your task.</p>"+
      "<p><b>N / R / P:</b> N = not oil resistant, R = somewhat oil resistant, P = oil proof. For wood dust, N95 or P100 are typical.</p>",
      kc:{ q:"An air-purifying respirator in a confined space with an unknown atmosphere is…", opts:["Fine if you work quickly","Acceptable with a P100 filter","Never acceptable — it cannot supply oxygen","Required by the program"], a:2 } },

    { h:"5. Seal Checks — Every Single Time", body:
      "<p>A fit test proves the respirator <i>can</i> seal. A <b>user seal check</b> proves it <i>is</i> sealing right now, this time you put it on. Do one every time — before you enter the work area, never after.</p>"+
      "<p><b>Positive pressure check:</b> cover the exhalation valve and exhale gently. The facepiece should bulge slightly and hold. Air escaping around the edges means no seal.</p>"+
      "<p><b>Negative pressure check:</b> cover the inlets, inhale gently, and hold for about ten seconds. The facepiece should collapse slightly toward your face and stay there. If it springs back or you feel air trickling in, you do not have a seal.</p>"+
      "<p><b>If the seal fails:</b> reposition it and try again. Check the straps, check for a twisted or cracked gasket, check for hair in the seal. If it still fails, do not enter the area — get a different respirator or see your supervisor.</p>"+
      "<div class='notice'><b>Never remove your respirator in the work area</b> to talk, drink, or get comfortable. If you must remove it, leave the area first.</div>",
      kc:{ q:"When do you perform a user seal check?", opts:["Once a year at the fit test","Every time you put the respirator on, before entering the area","Only when the air smells bad","After leaving the work area"], a:1 } },

    { h:"6. Leave the Area Immediately If…", body:
      "<p>Stop work and leave the contaminated area right away if any of these happen:</p>"+
      "<ul><li>You <b>smell, taste, or feel irritation</b> from the contaminant — the cartridge is spent or the seal has failed</li>"+
      "<li><b>Breathing becomes noticeably harder</b> — the filter is loaded and needs changing</li>"+
      "<li>The respirator is <b>damaged</b>, or a part fails</li>"+
      "<li>You feel <b>dizzy, nauseated, short of breath, or unwell</b> in any way</li>"+
      "<li>You need to <b>adjust or reposition</b> the facepiece</li></ul>"+
      "<p>Leave the area first, then deal with the problem in clean air. Report it to your supervisor — a failure that happened to you will happen to the next person unless it gets fixed.</p>"+
      "<p><b>Medical signs to take seriously</b> and report: shortness of breath beyond normal exertion, chest tightness or pain, dizziness or light-headedness, unusual fatigue while wearing the respirator. Your medical clearance can be re-evaluated if your health changes — tell the Safety Manager rather than pushing through.</p>",
      kc:{ q:"You start to smell solvent through your respirator. What do you do?", opts:["Keep working and finish the task","Breathe through your mouth","Leave the area immediately and report it","Tighten the straps and continue"], a:2 } },

    { h:"7. Care, Cleaning, and Storage", body:
      "<p><b>Inspect before and after every use:</b> facepiece for cracks, tears, or distortion; straps for elasticity and wear; valves for cracks, dirt, or sticking; cartridges and filters for damage, correct type, and secure seating; gaskets for cracks or missing pieces.</p>"+
      "<p><b>Cleaning:</b> clean and disinfect after each use if the respirator is yours alone, and <b>before another person uses it</b> if it is shared. Warm water and approved cleaner, air dry in clean air — never with heat or solvents.</p>"+
      "<p><b>Storage:</b> in a clean, dry, sealed container or bag, protected from dust, sunlight, extreme temperature, moisture, and chemicals. Store the facepiece so the seal is not deformed — not squashed at the bottom of a toolbox.</p>"+
      "<div class='notice'><b>Disposable filtering facepieces (N95s) are never cleaned, repaired, or shared.</b> Throw one away when it is dirty, damaged, hard to breathe through, or has been contaminated.</div>"+
      "<p><b>Repairs</b> are made only by trained people using manufacturer parts. Regulators, valves, and alarms are adjusted only by the manufacturer or a manufacturer-trained technician. Never improvise a repair — no tape, no substitute parts.</p>",
      kc:{ q:"Your N95 filtering facepiece is dirty and hard to breathe through. What is correct?", opts:["Wash it and reuse it","Discard it and get a new one","Blow it out with compressed air","Share it with another shift"], a:1 } },

    { h:"8. Cartridge Change Schedules", body:
      "<p>Filters and cartridges do not last forever, and you cannot rely on smell to tell you when a chemical cartridge is spent — many contaminants have poor warning properties, and by the time you smell them, you have already been exposed.</p>"+
      "<p><b>Change your filter or cartridge when:</b></p>"+
      "<ul><li>The <b>change schedule</b> established for your task says so</li>"+
      "<li>The <b>end-of-service-life indicator (ESLI)</b> shows it is spent, if the cartridge has one</li>"+
      "<li>Breathing becomes noticeably <b>harder</b> (particulate filters)</li>"+
      "<li>You <b>smell or taste</b> the contaminant, or feel irritation — leave the area first</li>"+
      "<li>The cartridge or filter is <b>damaged, wet, or dirty</b></li></ul>"+
      "<p>Where air-purifying respirators are used against gases or vapors and no ESLI is available, the Program Administrator establishes a written change schedule based on objective data. Follow it — do not stretch a cartridge because it still seems fine.</p>"+
      "<p>Cartridge and filter labels must stay readable during use. Never remove or paint over the NIOSH approval label.</p>",
      kc:{ q:"You may rely on smell alone to decide when to change a chemical cartridge.", opts:["True — if you can smell it, change it","False — smell is not a reliable indicator; follow the change schedule or ESLI","True, but only for solvents","False — cartridges never need changing"], a:1 } },

    { h:"9. Voluntary Use and Wildfire Smoke", body:
      "<p>Sometimes you may <b>want</b> a respirator even when one is not required. That is allowed, with conditions.</p>"+
      "<p><b>Voluntary N95 (dust mask) use:</b> permitted. The company provides the advisory information required by WAC 296-842-11005 Table 2, and you follow proper use, cleaning, and storage. No medical evaluation or fit test needed for a voluntary N95.</p>"+
      "<p><b>Voluntary half-face or higher:</b> different story. Because these put real strain on your breathing, medical evaluation, cleaning and storage procedures, and training all still apply. The Program Administrator authorizes this case by case — talk to the Safety Manager first.</p>"+
      "<h2>Wildfire smoke</h2>"+
      "<p>Wildfire smoke is governed by chapter 296-820 WAC. Protection escalates as PM2.5 rises:</p>"+
      "<div class='tier t1'><div class='tt'>PM2.5 20.5 – 35.4 (AQI 72 – 100)</div>N95s provided at no cost on request. Voluntary use.</div>"+
      "<div class='tier t2'><div class='tt'>PM2.5 35.5 – 250.4 (AQI 101 – 350)</div>Company must provide N95s to all exposed employees and encourage use. Exposure controls implemented.</div>"+
      "<div class='tier t2'><div class='tt'>PM2.5 250.5 – 500.3 (AQI 351 – 848)</div>N95s handed directly to each exposed employee. Access to clean air ensured.</div>"+
      "<div class='tier t3'><div class='tt'>PM2.5 500.4 and above (AQI 849+)</div>Respirator use is <b>required</b>, not voluntary — full program applies, including medical evaluation and fit testing. At 555+ , P100 respirators are required.</div>"+
      "<p>Wildfire smoke information and training are covered in the Wildfire Smoke module. This section covers only the respirator side.</p>",
      kc:{ q:"You want to wear your own half-face respirator voluntarily for dusty work. What applies?", opts:["Nothing — voluntary use has no requirements","Medical evaluation, cleaning/storage procedures, and training still apply; the Program Administrator must authorize it","Only a fit test is needed","It is prohibited entirely"], a:1 } },

    { h:"10. Emergencies and the Bottom Line", body:
      "<div class='danger'><b>WKO Inc. does not keep SCBA on site and does not perform IDLH entry.</b> Immediately Dangerous to Life or Health atmospheres — including oxygen-deficient confined spaces — are handled by the <b>local fire department (911)</b> as our designated entry-rescue provider.</div>"+
      "<p><b>If IDLH conditions are encountered unexpectedly:</b> everyone evacuates the area immediately, someone calls <b>911</b> and notifies the Safety Manager, and <b>nobody attempts entry or rescue</b> without IDLH-rated equipment and training. A rescuer without an air supply becomes the second victim — this is the single most common way confined-space incidents kill more than one person.</p>"+
      "<p><b>If your respirator fails in a contaminated area:</b> leave immediately by the shortest safe route. Do not stop to troubleshoot inside the area.</p>"+
      "<h2>The bottom line</h2>"+
      "<p>Your respirator protects you only when it is the right one, fits your face, seals every time you put it on, has current cartridges, and is worn the entire time you are exposed. Every one of those is something you control.</p>"+
      "<p>The written Respiratory Protection Program is available in the Safety Office. The Safety Manager will answer any question about it — including questions about your own medical clearance, which stays confidential.</p>",
      kc:{ q:"A co-worker collapses inside a confined space. What is the correct response?", opts:["Enter immediately and pull them out","Put on an N95 and go in","Do not enter — evacuate, call 911, and let Carson Fire perform the entry rescue","Wait for the next shift"], a:2 } }
  ],
  quizH: "Final Quiz",
  quizIntro: "Answer all 10 questions. You need 8 correct (80%) to pass. Take your time — you can review your answers before submitting.",
  submitBtn: "Submit Quiz",
  answerAll: "Please answer every question before submitting.",
  quiz: [
    { q:"Before you may wear a tight-fitting respirator at work, you must have…", opts:["Only this training","A medical evaluation, a fit test, and training","Only a fit test","Your supervisor's verbal approval"], a:1 },
    { q:"Facial hair on the sealing surface of a tight-fitting respirator is…", opts:["Acceptable if straps are tightened","Acceptable for short beards","Never acceptable — it breaks the seal","Only a problem during fit testing"], a:2 },
    { q:"A user seal check must be performed…", opts:["Annually","Every time the respirator is put on, before entering the area","Only after cleaning","Only when the supervisor asks"], a:1 },
    { q:"An air-purifying respirator may be used in an oxygen-deficient atmosphere…", opts:["Yes, with a P100 filter","Yes, for short periods","Never — it cannot supply oxygen","Only in confined spaces"], a:2 },
    { q:"You begin to smell the contaminant through your respirator. You should…", opts:["Tighten the straps and keep working","Leave the area immediately and report it","Switch to mouth breathing","Finish the task first"], a:1 },
    { q:"How often must fit testing be repeated?", opts:["Never after the first one","At least annually, and whenever the facepiece or your face changes","Every five years","Only when a new employee is hired"], a:1 },
    { q:"Disposable N95 filtering facepieces…", opts:["Should be washed and reused","Are never cleaned, repaired, or shared","Can be shared between shifts","Last indefinitely"], a:1 },
    { q:"You may rely on smell alone to decide when to change a chemical cartridge.", opts:["True","False — follow the change schedule or the end-of-service-life indicator","True for solvents only","True if you have a good sense of smell"], a:1 },
    { q:"Voluntary use of a half-facepiece respirator requires…", opts:["Nothing at all","Medical evaluation, training, and cleaning/storage procedures, with Program Administrator authorization","Only a dust mask advisory sheet","A supervisor's signature only"], a:1 },
    { q:"A co-worker collapses in a confined space. WKO Inc.'s correct response is…", opts:["Enter and rescue immediately","Enter wearing an N95","Do not enter — evacuate, call 911, and let the local fire department (911) perform the entry rescue","Send two people in together"], a:2 }
  ],

  passInstr:"<b>Last step — record your completion:</b> tap the button below and submit the completion form. Enter your name, select <b>\"Respiratory Protection / Protección Respiratoria\"</b> from the module list, and enter the completion code shown above. Your training is not on record until you submit the form.<br><br><b>Remember:</b> this certificate covers the knowledge requirement only. You must also have a current medical evaluation and fit test before wearing a tight-fitting respirator.",

es: {

  introH: "Bienvenido — Protección Respiratoria en WKO Inc.",

  sections: [
    { h:"1. Por Qué un Respirador — y Por Qué No Es lo Primero", body:
      "<p>WKO Inc. controla los peligros en el aire usando la <b>jerarquía de controles</b>: eliminar el peligro, sustituirlo por algo más seguro, controlarlo con ingeniería mediante ventilación o encerramiento, controlarlo administrativamente — y solo entonces, respiradores.</p>"+
      "<p>Un respirador no elimina el peligro. Filtra el aire que usted respira, y solo mientras se use correctamente, selle bien y tenga el cartucho adecuado. Por eso es la <b>última línea de defensa</b>, y por eso importa tanto cómo lo use.</p>"+
      "<p><b>Peligros respiratorios en WKO Inc.:</b></p>"+
      "<table class='mini'><tr><th>Peligro</th><th>Dónde</th></tr>"+
      "<tr><td><b>Polvo de madera</b> — blanda y dura</td><td>Aserradero y otras áreas de producción, limpieza</td></tr>"+
      "<tr><td><b>Humos de soldadura</b></td><td>Talleres de mantenimiento y reparaciones en campo</td></tr>"+
      "<tr><td><b>Vapores químicos</b> — solventes, pinturas, recubrimientos</td><td>Mantenimiento, talleres</td></tr>"+
      "<tr><td><b>Químicos de caldera</b></td><td>Planta de vapor, durante el manejo</td></tr>"+
      "<tr><td><b>Humo de incendios forestales</b> — PM2.5</td><td>Todo trabajo al aire libre, temporada de incendios</td></tr>"+
      "<tr><td><b>Aire deficiente en oxígeno</b></td><td>Espacios confinados</td></tr></table>",
      kc:{ q:"¿Por qué se considera al respirador la última línea de defensa?", opts:["Porque es el control más caro","Porque no elimina el peligro — solo filtra el aire que usted respira","Porque es opcional","Porque los supervisores lo dicen"], a:1 } },

    { h:"2. Tres Cosas Antes de Usarlo", body:
      "<div class='danger'><b>No puede usar un respirador de ajuste hermético en el trabajo hasta completar los tres:</b>"+
      "<ol><li><b>Evaluación médica</b> — un profesional de la salud confirma que usted puede usarlo con seguridad. Respirar a través de un respirador agrega esfuerzo al corazón y a los pulmones. Se realiza con el proveedor de medicina ocupacional designado por la compañía, sin costo para usted y de forma confidencial.</li>"+
      "<li><b>Prueba de ajuste</b> — comprueba que la marca, modelo, estilo y talla exactos sellan en <i>su</i> cara. La realiza el proveedor contratado de pruebas de ajuste de la compañía, antes del primer uso y al menos anualmente.</li>"+
      "<li><b>Capacitación</b> — este módulo más la sesión práctica.</li></ol></div>"+
      "<p>Esto no es papeleo. Un respirador que no sella le da la falsa confianza de estar protegido mientras respira aire contaminado — lo cual es más peligroso que no usar nada, porque de otro modo usted se habría mantenido fuera del área.</p>"+
      "<p><b>La prueba de ajuste debe repetirse</b> cuando cambie a otra marca, modelo, estilo o talla de pieza facial, y cuando su cara cambie — cambio de peso significativo, trabajo dental, cicatrices faciales o cirugía.</p>",
      kc:{ q:"Completó esta capacitación pero no la prueba de ajuste. ¿Puede usar un respirador de media cara en el trabajo?", opts:["Sí — la capacitación es suficiente","Sí, si un compañero dice que le queda bien","No — también deben estar completas la evaluación médica y la prueba de ajuste","Solo los fines de semana"], a:2 } },

    { h:"3. El Vello Facial y el Sello", body:
      "<div class='danger'><b>Ningún vello facial puede quedar entre la pieza facial y su cara. Ninguno.</b></div>"+
      "<p>Un respirador de ajuste hermético funciona sellando contra la piel. Incluso uno o dos días de barba incipiente en la superficie de sellado rompen ese sello y dejan entrar aire contaminado por los bordes. Esto no es una preferencia de apariencia — es la razón por la que el respirador funciona o no.</p>"+
      "<p><b>Lo permitido:</b> un bigote o una perilla pequeña que quede completamente <i>dentro</i> de la superficie de sellado está bien. Barbas, patillas largas que cruzan el sello y barba de varios días en el área del sello, no.</p>"+
      "<p><b>Si no puede o no desea afeitarse</b>, dígaselo a su supervisor o al Gerente de Seguridad. Un <b>respirador purificador de aire motorizado (PAPR) de ajuste holgado</b> usa capucha o casco en lugar de sello facial y no requiere área afeitada. Hay una solución — pero la solución nunca es usar un respirador hermético sobre la barba.</p>"+
      "<p>También debe estar afeitado en su <b>prueba de ajuste</b>. Una prueba aprobada sobre barba incipiente no prueba nada.</p>",
      kc:{ q:"Tiene barba de tres días y necesita hacer un trabajo que requiere respirador de media cara. ¿Qué es correcto?", opts:["Apretar más las correas","Usarlo de todos modos — una barba corta está bien","No usarlo; hablar con su supervisor sobre un PAPR o afeitarse el área del sello","Aguantar la respiración en las partes con polvo"], a:2 } },

    { h:"4. Conozca Su Respirador y Sus Límites", body:
      "<p>Los <b>respiradores purificadores de aire (APR)</b> — incluyendo N95, media cara y cara completa — filtran contaminantes del aire a su alrededor. <b>No pueden producir oxígeno.</b> Nunca use un respirador purificador de aire en una atmósfera deficiente en oxígeno ni en un espacio confinado con atmósfera desconocida.</p>"+
      "<p>El <b>Factor de Protección Asignado (APF)</b> indica cuánta protección brinda un respirador cuando se usa correctamente dentro de un programa vigente:</p>"+
      "<table class='mini'><tr><th>Respirador</th><th>APF</th><th>Significa</th></tr>"+
      "<tr><td>Pieza facial filtrante (N95, P100 desechable)</td><td>10</td><td>Hasta 10× el límite de exposición</td></tr>"+
      "<tr><td>APR de media cara</td><td>10</td><td>Hasta 10× el límite de exposición</td></tr>"+
      "<tr><td>APR de cara completa</td><td>50</td><td>Hasta 50×; también protege los ojos</td></tr>"+
      "<tr><td>PAPR — capucha o casco holgado</td><td>25</td><td>No requiere sello facial</td></tr>"+
      "<tr><td>PAPR — cara completa</td><td>1,000</td><td>La mayor protección APR</td></tr></table>"+
      "<p><b>Los filtros y cartuchos no son intercambiables.</b> Los filtros de partículas (series N, R, P) atrapan polvo y neblinas — no hacen nada contra gases o vapores. Los cartuchos químicos atrapan gases y vapores específicos — no hacen nada contra el polvo a menos que se combinen con un filtro de partículas. Use solo lo que el Gerente de Seguridad seleccionó para su tarea.</p>"+
      "<p><b>N / R / P:</b> N = no resistente al aceite, R = algo resistente al aceite, P = a prueba de aceite. Para polvo de madera, N95 o P100 son lo típico.</p>",
      kc:{ q:"Un respirador purificador de aire en un espacio confinado con atmósfera desconocida es…", opts:["Aceptable si trabaja rápido","Aceptable con filtro P100","Nunca aceptable — no puede suministrar oxígeno","Requerido por el programa"], a:2 } },

    { h:"5. Verificación de Sello — Cada Vez", body:
      "<p>La prueba de ajuste demuestra que el respirador <i>puede</i> sellar. La <b>verificación de sello del usuario</b> demuestra que <i>está</i> sellando ahora mismo, esta vez que se lo puso. Hágala cada vez — antes de entrar al área de trabajo, nunca después.</p>"+
      "<p><b>Verificación de presión positiva:</b> cubra la válvula de exhalación y exhale suavemente. La pieza facial debe abombarse ligeramente y mantenerse. Si el aire escapa por los bordes, no hay sello.</p>"+
      "<p><b>Verificación de presión negativa:</b> cubra las entradas, inhale suavemente y sostenga unos diez segundos. La pieza facial debe colapsar levemente hacia su cara y quedarse así. Si rebota o siente entrar aire, no tiene sello.</p>"+
      "<p><b>Si falla el sello:</b> reacomódelo e intente de nuevo. Revise las correas, busque una junta torcida o agrietada, revise si hay vello en el sello. Si sigue fallando, no entre al área — consiga otro respirador o vea a su supervisor.</p>"+
      "<div class='notice'><b>Nunca se quite el respirador dentro del área de trabajo</b> para hablar, beber o estar más cómodo. Si debe quitárselo, salga primero del área.</div>",
      kc:{ q:"¿Cuándo se realiza la verificación de sello del usuario?", opts:["Una vez al año en la prueba de ajuste","Cada vez que se pone el respirador, antes de entrar al área","Solo cuando el aire huele mal","Después de salir del área de trabajo"], a:1 } },

    { h:"6. Salga del Área Inmediatamente Si…", body:
      "<p>Detenga el trabajo y salga del área contaminada de inmediato si ocurre cualquiera de estas cosas:</p>"+
      "<ul><li>Usted <b>huele, saborea o siente irritación</b> del contaminante — el cartucho está agotado o el sello falló</li>"+
      "<li><b>Respirar se vuelve notablemente más difícil</b> — el filtro está cargado y necesita cambio</li>"+
      "<li>El respirador está <b>dañado</b>, o falla una pieza</li>"+
      "<li>Se siente <b>mareado, con náuseas, con falta de aire o mal</b> de cualquier forma</li>"+
      "<li>Necesita <b>ajustar o reacomodar</b> la pieza facial</li></ul>"+
      "<p>Salga primero del área, luego resuelva el problema en aire limpio. Repórtelo a su supervisor — una falla que le ocurrió a usted le ocurrirá al siguiente si no se corrige.</p>"+
      "<p><b>Señales médicas que debe tomar en serio</b> y reportar: falta de aire más allá del esfuerzo normal, opresión o dolor en el pecho, mareo o aturdimiento, fatiga inusual mientras usa el respirador. Su autorización médica puede reevaluarse si su salud cambia — dígaselo al Gerente de Seguridad en lugar de aguantar.</p>",
      kc:{ q:"Comienza a oler solvente a través de su respirador. ¿Qué hace?", opts:["Seguir trabajando y terminar la tarea","Respirar por la boca","Salir del área inmediatamente y reportarlo","Apretar las correas y continuar"], a:2 } },

    { h:"7. Cuidado, Limpieza y Almacenamiento", body:
      "<p><b>Inspeccione antes y después de cada uso:</b> pieza facial en busca de grietas, roturas o deformación; correas por elasticidad y desgaste; válvulas por grietas, suciedad o pegado; cartuchos y filtros por daño, tipo correcto y asiento seguro; juntas por grietas o piezas faltantes.</p>"+
      "<p><b>Limpieza:</b> limpie y desinfecte después de cada uso si el respirador es solo suyo, y <b>antes de que otra persona lo use</b> si es compartido. Agua tibia y limpiador aprobado, secado al aire en aire limpio — nunca con calor ni solventes.</p>"+
      "<p><b>Almacenamiento:</b> en un recipiente o bolsa limpia, seca y sellada, protegido del polvo, la luz solar, temperaturas extremas, humedad y químicos. Guarde la pieza facial de modo que el sello no se deforme — no aplastada en el fondo de una caja de herramientas.</p>"+
      "<div class='notice'><b>Las piezas faciales filtrantes desechables (N95) nunca se limpian, reparan ni comparten.</b> Deséchela cuando esté sucia, dañada, difícil de respirar a través de ella, o contaminada.</div>"+
      "<p>Las <b>reparaciones</b> las hacen solo personas capacitadas con piezas del fabricante. Los reguladores, válvulas y alarmas solo los ajusta el fabricante o un técnico capacitado por el fabricante. Nunca improvise una reparación — sin cinta, sin piezas sustitutas.</p>",
      kc:{ q:"Su pieza facial filtrante N95 está sucia y difícil de respirar. ¿Qué es correcto?", opts:["Lavarla y reutilizarla","Desecharla y conseguir una nueva","Soplarla con aire comprimido","Compartirla con otro turno"], a:1 } },

    { h:"8. Programas de Cambio de Cartuchos", body:
      "<p>Los filtros y cartuchos no duran para siempre, y usted no puede confiar en el olfato para saber cuándo un cartucho químico está agotado — muchos contaminantes tienen malas propiedades de advertencia, y para cuando los huele, ya estuvo expuesto.</p>"+
      "<p><b>Cambie su filtro o cartucho cuando:</b></p>"+
      "<ul><li>El <b>programa de cambio</b> establecido para su tarea lo indique</li>"+
      "<li>El <b>indicador de fin de vida útil (ESLI)</b> muestre que está agotado, si el cartucho lo tiene</li>"+
      "<li>Respirar se vuelva notablemente <b>más difícil</b> (filtros de partículas)</li>"+
      "<li><b>Huela o saboree</b> el contaminante, o sienta irritación — salga primero del área</li>"+
      "<li>El cartucho o filtro esté <b>dañado, mojado o sucio</b></li></ul>"+
      "<p>Cuando se usan respiradores purificadores de aire contra gases o vapores y no hay ESLI disponible, el Administrador del Programa establece un programa de cambio escrito basado en datos objetivos. Sígalo — no estire un cartucho porque todavía parece estar bien.</p>"+
      "<p>Las etiquetas de cartuchos y filtros deben permanecer legibles durante el uso. Nunca quite ni pinte encima de la etiqueta de aprobación NIOSH.</p>",
      kc:{ q:"Puede confiar solo en el olfato para decidir cuándo cambiar un cartucho químico.", opts:["Verdadero — si lo huele, cámbielo","Falso — el olfato no es indicador confiable; siga el programa de cambio o el ESLI","Verdadero, pero solo para solventes","Falso — los cartuchos nunca necesitan cambio"], a:1 } },

    { h:"9. Uso Voluntario y Humo de Incendios Forestales", body:
      "<p>A veces usted puede <b>querer</b> un respirador aunque no sea requerido. Eso está permitido, con condiciones.</p>"+
      "<p><b>Uso voluntario de N95 (mascarilla contra polvo):</b> permitido. La compañía proporciona la información de advertencia requerida por la Tabla 2 de WAC 296-842-11005, y usted sigue el uso, limpieza y almacenamiento adecuados. No se necesita evaluación médica ni prueba de ajuste para un N95 voluntario.</p>"+
      "<p><b>Uso voluntario de media cara o superior:</b> es distinto. Como estos exigen esfuerzo real a su respiración, siguen aplicando la evaluación médica, los procedimientos de limpieza y almacenamiento, y la capacitación. El Administrador del Programa lo autoriza caso por caso — hable primero con el Gerente de Seguridad.</p>"+
      "<h2>Humo de incendios forestales</h2>"+
      "<p>El humo de incendios forestales se rige por el capítulo 296-820 WAC. La protección aumenta conforme sube el PM2.5:</p>"+
      "<div class='tier t1'><div class='tt'>PM2.5 20.5 – 35.4 (AQI 72 – 100)</div>N95 proporcionados sin costo a solicitud. Uso voluntario.</div>"+
      "<div class='tier t2'><div class='tt'>PM2.5 35.5 – 250.4 (AQI 101 – 350)</div>La compañía debe proporcionar N95 a todos los empleados expuestos y fomentar su uso. Se implementan controles de exposición.</div>"+
      "<div class='tier t2'><div class='tt'>PM2.5 250.5 – 500.3 (AQI 351 – 848)</div>N95 entregados directamente a cada empleado expuesto. Se asegura acceso a aire limpio.</div>"+
      "<div class='tier t3'><div class='tt'>PM2.5 500.4 y más (AQI 849+)</div>El uso de respirador es <b>requerido</b>, no voluntario — aplica el programa completo, incluyendo evaluación médica y prueba de ajuste. A 555+ , se requieren respiradores P100.</div>"+
      "<p>La información y capacitación sobre humo de incendios forestales se cubren en el módulo de Humo de Incendios Forestales. Esta sección cubre solo la parte del respirador.</p>",
      kc:{ q:"Quiere usar voluntariamente su propio respirador de media cara para trabajo con polvo. ¿Qué aplica?", opts:["Nada — el uso voluntario no tiene requisitos","Siguen aplicando evaluación médica, procedimientos de limpieza/almacenamiento y capacitación; el Administrador del Programa debe autorizarlo","Solo se necesita una prueba de ajuste","Está totalmente prohibido"], a:1 } },

    { h:"10. Emergencias y lo Fundamental", body:
      "<div class='danger'><b>WKO Inc. no mantiene SCBA en el sitio y no realiza entradas IDLH.</b> Las atmósferas Inmediatamente Peligrosas para la Vida o la Salud — incluyendo espacios confinados deficientes en oxígeno — las maneja el <b>departamento de bomberos local (911)</b> como nuestro proveedor designado de rescate con entrada.</div>"+
      "<p><b>Si se encuentran condiciones IDLH inesperadamente:</b> todos evacuan el área de inmediato, alguien llama al <b>911</b> y notifica al Gerente de Seguridad, y <b>nadie intenta entrar ni rescatar</b> sin equipo y capacitación para IDLH. Un rescatista sin suministro de aire se convierte en la segunda víctima — esta es la forma más común en que los incidentes en espacios confinados matan a más de una persona.</p>"+
      "<p><b>Si su respirador falla en un área contaminada:</b> salga de inmediato por la ruta segura más corta. No se detenga a resolver el problema dentro del área.</p>"+
      "<h2>Lo fundamental</h2>"+
      "<p>Su respirador lo protege solo cuando es el correcto, se ajusta a su cara, sella cada vez que se lo pone, tiene cartuchos vigentes y se usa todo el tiempo que está expuesto. Cada una de esas cosas está bajo su control.</p>"+
      "<p>El Programa escrito de Protección Respiratoria está disponible en la Oficina de Seguridad. El Gerente de Seguridad responderá cualquier pregunta — incluyendo preguntas sobre su propia autorización médica, que es confidencial.</p>",
      kc:{ q:"Un compañero se desploma dentro de un espacio confinado. ¿Cuál es la respuesta correcta?", opts:["Entrar de inmediato y sacarlo","Ponerse un N95 y entrar","No entrar — evacuar, llamar al 911 y dejar que el departamento de bomberos local realice el rescate con entrada","Esperar al siguiente turno"], a:2 } }
  ],

    { q:"La verificación de sello del usuario debe realizarse…", opts:["Anualmente","Cada vez que se pone el respirador, antes de entrar al área","Solo después de limpiarlo","Solo cuando el supervisor lo pida"], a:1 },

    { q:"El uso voluntario de un respirador de media cara requiere…", opts:["Nada en absoluto","Evaluación médica, capacitación y procedimientos de limpieza/almacenamiento, con autorización del Administrador del Programa","Solo una hoja de advertencia de mascarilla","Solo la firma del supervisor"], a:1 },

var ANSWER_KEY = STR.en.quiz.map(function(q){ return q.a; });

/* ------------ State ------------ */
var state = { lang:null, screen:"lang", section:0, name:"", kcDone:{}, quizAnswers:{}, lastScore:null, code:null };

/* ------------ Helpers ------------ */
function T(){ return STR[state.lang]; }
function $(id){ return document.getElementById(id); }
function esc(s){ var d=document.createElement("div"); d.appendChild(document.createTextNode(s)); return d.innerHTML; }

function generateCode(){
  var chars="ABCDEFGHJKMNPQRSTUVWXYZ23456789", out="";
  for(var i=0;i<5;i++){ out+=chars.charAt(Math.floor(Math.random()*chars.length)); }
  return CODE_PREFIX+out;
}
function gradeQuiz(answers){
  var correct=0;
  for(var i=0;i<ANSWER_KEY.length;i++){ if(answers[i]===ANSWER_KEY[i]) correct++; }
  var pct=Math.round(correct/ANSWER_KEY.length*100);
  return { correct:correct, total:ANSWER_KEY.length, pct:pct, pass: pct>=PASS_PCT };
}

/* ------------ Rendering ------------ */
function setLang(l){
  state.lang=l;
  if(state.screen==="lang") state.screen="intro";
  $("langBar").className="langbar";
  $("btnEN").className = l==="en"?"active":"";
  $("btnES").className = l==="es"?"active":"";
  render();
}
function progress(){
  if(state.screen==="lang"){ $("progBar").style.width="0%"; return; }
  var total = T().sections.length + 2;
  var pos = state.screen==="intro"?0 : state.screen==="quiz"?total-1 : state.screen==="pass"||state.screen==="fail"?total : state.section+1;
  $("progBar").style.width = Math.round(pos/total*100)+"%";
}
function renderLang(){
  $("app").innerHTML =
    '<div class="card splash">'+
    '<div class="co">WKO INC.</div>'+
    '<div class="ti-en">Respiratory Protection Training</div>'+
    '<div class="ti-es">Capacitación sobre Protección Respiratoria</div>'+
    '<div class="choose">Choose your language / Elija su idioma:</div>'+
    '<div class="langbtns">'+
    '<button id="langBtnEN">English</button>'+
    '<button id="langBtnES">Español</button>'+
    '</div></div>';
  $("langBtnEN").addEventListener("click", function(){ setLang("en"); });
  $("langBtnES").addEventListener("click", function(){ setLang("es"); });
}
function render(){
  progress();
  if(state.screen==="lang") renderLang();
  else if(state.screen==="intro") renderIntro();
  else if(state.screen==="section") renderSection();
  else if(state.screen==="quiz") renderQuiz();
  else if(state.screen==="pass") renderPass();
  else if(state.screen==="fail") renderFail();
}
function renderIntro(){
  var t=T();
  $("app").innerHTML =
    '<div class="card"><h1>'+t.introH+'</h1><p>'+t.introP1+'</p><p>'+t.introP2+'</p>'+
    '<h2>'+t.nameLabel+'</h2>'+
    '<input type="text" id="nameInput" placeholder="'+t.namePh+'" value="'+esc(state.name)+'" autocomplete="name">'+
    '<br><button class="btn" id="startBtn" disabled>'+t.startBtn+'</button>'+
    '<p style="color:var(--gray);font-size:.85em;margin-top:16px">'+t.basedOn+'</p></div>';
  var inp=$("nameInput"), btn=$("startBtn");
  function gate(){ state.name=inp.value.trim(); btn.disabled = state.name.length<2; }
  inp.addEventListener("input", gate); gate();
  btn.addEventListener("click", function(){ if(state.name.length>=2){ state.screen="section"; state.section=0; render(); window.scrollTo(0,0);} });
}
function renderSection(){
  var t=T(), s=t.sections[state.section];
  var html = '<div class="card"><div class="qnum">'+t.secLabel+' '+(state.section+1)+' '+t.ofLabel+' '+t.sections.length+'</div><h1>'+s.h+'</h1>'+s.body;
  var kcPassed = !!state.kcDone[state.section];
  if(s.kc){
    html += '<div class="kc"><div class="kct">✔ '+s.kc.q+'</div>';
    for(var i=0;i<s.kc.opts.length;i++){
      html += '<label class="opt" id="kcOpt'+i+'"><input type="radio" name="kc" value="'+i+'"'+(kcPassed?' disabled':'')+'>'+s.kc.opts[i]+'</label>';
    }
    html += '<div class="fb" id="kcFb"></div>';
    if(!kcPassed) html += '<button class="btn secondary" id="kcCheck">'+t.checkBtn+'</button>';
    html += '</div>';
  }
  html += '<br><button class="btn" id="contBtn"'+((s.kc&&!kcPassed)?' disabled':'')+'>'+t.continueBtn+'</button></div>';
  $("app").innerHTML = html;
  if(s.kc && !kcPassed){
    $("kcCheck").addEventListener("click", function(){
      var sel=document.querySelector('input[name="kc"]:checked');
      if(!sel) return;
      var v=parseInt(sel.value,10), fb=$("kcFb");
      if(v===s.kc.a){
        state.kcDone[state.section]=true;
        $("kcOpt"+v).className="opt correct";
        fb.className="fb ok"; fb.textContent=t.kcOk;
        $("contBtn").disabled=false; $("kcCheck").disabled=true;
      } else {
        $("kcOpt"+v).className="opt wrong";
        $("kcOpt"+s.kc.a).className="opt correct";
        fb.className="fb bad"; fb.textContent=t.kcBad;
        state.kcDone[state.section]=true;
        $("contBtn").disabled=false; $("kcCheck").disabled=true;
      }
    });
  }
  $("contBtn").addEventListener("click", function(){
    if(state.section < t.sections.length-1){ state.section++; } else { state.screen="quiz"; }
    render(); window.scrollTo(0,0);
  });
}
function renderQuiz(){
  var t=T();
  var html='<div class="card"><h1>'+t.quizH+'</h1><p>'+t.quizIntro+'</p>';
  for(var i=0;i<t.quiz.length;i++){
    var q=t.quiz[i];
    html+='<div class="quizq"><div class="qt">'+(i+1)+'. '+q.q+'</div>';
    for(var j=0;j<q.opts.length;j++){
      var checked = state.quizAnswers[i]===j ? ' checked' : '';
      html+='<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"'+checked+'>'+q.opts[j]+'</label>';
    }
    html+='</div>';
  }
  html+='<div class="fb bad" id="quizWarn" style="display:none">'+t.answerAll+'</div>';
  html+='<button class="btn" id="quizSubmit">'+t.submitBtn+'</button></div>';
  $("app").innerHTML=html;
  var radios=document.querySelectorAll('#app input[type=radio]');
  for(var r=0;r<radios.length;r++){
    radios[r].addEventListener("change", function(e){
      var name=e.target.name, idx=parseInt(name.substring(1),10);
      state.quizAnswers[idx]=parseInt(e.target.value,10);
    });
  }
  $("quizSubmit").addEventListener("click", function(){
    var answers=[];
    for(var i=0;i<t.quiz.length;i++){
      if(typeof state.quizAnswers[i]==="undefined"){ $("quizWarn").style.display="block"; return; }
      answers.push(state.quizAnswers[i]);
    }
    var res=gradeQuiz(answers);
    state.lastScore=res;
    if(res.pass){ state.code=generateCode(); state.screen="pass"; }
    else { state.screen="fail"; }
    render(); window.scrollTo(0,0);
  });
}
function fmtDate(){
  var d=new Date();
  var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var mes=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return state.lang==="es" ? d.getDate()+" "+mes[d.getMonth()]+" "+d.getFullYear() : m[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
}
function renderPass(){
  var t=T(), r=state.lastScore;
  $("app").innerHTML =
    '<div class="card"><p class="passmsg">'+t.passH+'</p></div>'+
    '<div class="cert" id="certBox">'+
      '<div>'+t.passSub+'</div>'+
      '<div class="big" id="certName">'+esc(state.name)+'</div>'+
      '<div>'+t.passModule+'</div>'+
      '<div style="margin:8px 0">'+t.scoreLabel+': <b>'+r.correct+'/'+r.total+' ('+r.pct+'%)</b> &nbsp;·&nbsp; '+t.dateLabel+': <b id="certDate">'+fmtDate()+'</b></div>'+
      '<div>'+t.codeLabel+':</div>'+
      '<div class="code" id="certCode">'+state.code+'</div>'+
    '</div>'+
    '<div class="card"><p>'+t.passInstr+'</p>'+
    '<a class="btn" id="recordLink" href="'+FORM_URL+'" target="_blank" rel="noopener">'+t.recordBtn+'</a></div>';
}
function renderFail(){
  var t=T(), r=state.lastScore;
  $("app").innerHTML =
    '<div class="card" id="failBox"><p class="failmsg">'+t.failH+'</p>'+
    '<p>'+t.yourScore+': <b>'+r.correct+'/'+r.total+' ('+r.pct+'%)</b></p>'+
    '<p>'+t.failMsg+'</p>'+
    '<button class="btn secondary" id="reviewBtn">'+t.reviewBtn+'</button> '+
    '<button class="btn" id="retakeBtn">'+t.retakeBtn+'</button></div>';
  $("reviewBtn").addEventListener("click", function(){ state.quizAnswers={}; state.screen="section"; state.section=0; render(); window.scrollTo(0,0); });
  $("retakeBtn").addEventListener("click", function(){ state.quizAnswers={}; state.screen="quiz"; render(); window.scrollTo(0,0); });
}

/* ------------ Test hooks ------------ */
window.APP = { STR:STR, state:state, gradeQuiz:gradeQuiz, generateCode:generateCode, ANSWER_KEY:ANSWER_KEY, FORM_URL:FORM_URL, PASS_PCT:PASS_PCT, MODULE_VERSION:MODULE_VERSION, CODE_PREFIX:CODE_PREFIX, setLang:setLang, render:render };
window.setLang = setLang;

render();
</script>
</body>
</html>
